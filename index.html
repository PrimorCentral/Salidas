/** Actualiza los contadores junto al título de "Email agencias": nº total,
 *  nº "sin uso", nº "nueva" (falta email) y nº "sin email" (ninguna
 *  agrupación con Definitivo ni Previsión rellenos, para que no se escape
 *  ninguna aunque no esté marcada como "Nueva"). Los tres badges son
 *  clicables y excluyentes entre sí. */
function actualizarTotalEmailsConfig_() {
  const elTotal = document.getElementById('emails-config-total');
  const elSinUso = document.getElementById('emails-config-sinuso');
  const elNueva = document.getElementById('emails-config-nueva');
  const elSinEmail = document.getElementById('emails-config-sinemail');
  if (!elTotal || !elSinUso || !elNueva || !elSinEmail) return;

  const total = EMAILS_CONFIG_ESTADO.datos.length;
  elTotal.textContent = total + (total === 1 ? ' agrupación' : ' agrupaciones');

  const sinUso = EMAILS_CONFIG_ESTADO.datos.filter(function (it) {
    return /^SIN USO/i.test(it.estado || '');
  }).length;
  const nueva = EMAILS_CONFIG_ESTADO.datos.filter(function (it) {
    return /^NUEVA/i.test(it.estado || '');
  }).length;
  const sinEmail = EMAILS_CONFIG_ESTADO.datos.filter(function (it) {
    return (!it.emails || !it.emails.length) && (!it.emailsPrevision || !it.emailsPrevision.length);
  }).length;

  elSinUso.textContent = sinUso + ' sin uso';
  elNueva.textContent = nueva + ' nueva' + (nueva === 1 ? '' : 's');
  elSinEmail.textContent = sinEmail + ' sin email';
  if (sinUso === 0) EMAILS_CONFIG_ESTADO.soloSinUso = false;
  if (nueva === 0) EMAILS_CONFIG_ESTADO.soloNueva = false;
  if (sinEmail === 0) EMAILS_CONFIG_ESTADO.soloSinEmail = false;
  elSinUso.classList.toggle('activo', EMAILS_CONFIG_ESTADO.soloSinUso);
  elNueva.classList.toggle('activo', EMAILS_CONFIG_ESTADO.soloNueva);
  elSinEmail.classList.toggle('activo', EMAILS_CONFIG_ESTADO.soloSinEmail);

  elSinUso.onclick = function () {
    EMAILS_CONFIG_ESTADO.soloSinUso = !EMAILS_CONFIG_ESTADO.soloSinUso;
    if (EMAILS_CONFIG_ESTADO.soloSinUso) { EMAILS_CONFIG_ESTADO.soloNueva = false; EMAILS_CONFIG_ESTADO.soloSinEmail = false; }
    elSinUso.classList.toggle('activo', EMAILS_CONFIG_ESTADO.soloSinUso);
    elNueva.classList.remove('activo');
    elSinEmail.classList.remove('activo');
    pintarListaEmails_();
    ajustarAlturaListaScrollable_('emails-config-lista');
  };

  elNueva.onclick = function () {
    EMAILS_CONFIG_ESTADO.soloNueva = !EMAILS_CONFIG_ESTADO.soloNueva;
    if (EMAILS_CONFIG_ESTADO.soloNueva) { EMAILS_CONFIG_ESTADO.soloSinUso = false; EMAILS_CONFIG_ESTADO.soloSinEmail = false; }
    elNueva.classList.toggle('activo', EMAILS_CONFIG_ESTADO.soloNueva);
    elSinUso.classList.remove('activo');
    elSinEmail.classList.remove('activo');
    pintarListaEmails_();
    ajustarAlturaListaScrollable_('emails-config-lista');
  };

  elSinEmail.onclick = function () {
    EMAILS_CONFIG_ESTADO.soloSinEmail = !EMAILS_CONFIG_ESTADO.soloSinEmail;
    if (EMAILS_CONFIG_ESTADO.soloSinEmail) { EMAILS_CONFIG_ESTADO.soloSinUso = false; EMAILS_CONFIG_ESTADO.soloNueva = false; }
    elSinEmail.classList.toggle('activo', EMAILS_CONFIG_ESTADO.soloSinEmail);
    elSinUso.classList.remove('activo');
    elNueva.classList.remove('activo');
    pintarListaEmails_();
    ajustarAlturaListaScrollable_('emails-config-lista');
  };
}

/** Exporta a PDF la lista de agrupaciones visible en ese momento (respeta
 *  el buscador y los badges "sin uso" / "nueva" / "sin email" activos), con
 *  columnas Agrupación, Emails Definitivo, Emails Previsión, Días y Nota. */
function exportarAgrupacionesConfigPDF_() {
  if (!window.jspdf || !window.jspdf.jsPDF) {
    mostrarErrorServidor({ message: 'No se pudo cargar el generador de PDF.' });
    return;
  }
  const jsPDF = window.jspdf.jsPDF;
  const items = obtenerAgrupacionesConfigFiltradas_();

  const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'l' });
  doc.setFontSize(13);
  doc.text('Email agencias', 14, 14);
  doc.setFontSize(9);
  doc.setTextColor(120);
  doc.text(items.length + ' agrupación' + (items.length === 1 ? '' : 'es') + ' — ' + hoyStr(), 14, 20);
  doc.setTextColor(0);

  doc.autoTable({
    startY: 25,
    head: [['Agrupación', 'Emails Definitivo', 'Emails Previsión', 'Días', 'Nota']],
    body: items.map(function (it) {
      return [
        it.agrupacion || '',
        (it.emails || []).join(', '),
        (it.emailsPrevision || []).join(', '),
        (it.dias || []).join(', '),
        it.notas || ''
      ];
    }),
    styles: { fontSize: 8, cellPadding: 2, overflow: 'linebreak' },
    headStyles: { fillColor: [30, 41, 59] },
    columnStyles: {
      0: { cellWidth: 45 },
      1: { cellWidth: 60 },
      2: { cellWidth: 60 },
      3: { cellWidth: 45 },
      4: { cellWidth: 'auto' }
    }
  });

  doc.save('agrupaciones_' + hoyStr() + '.pdf');
}

/** Exporta a Excel (CSV con BOM y ; como separador) la misma lista visible
 *  que la exportación a PDF, con las mismas columnas. */
function exportarAgrupacionesConfigExcel_() {
  const items = obtenerAgrupacionesConfigFiltradas_();
  const filas = [['Agrupación', 'Emails Definitivo', 'Emails Previsión', 'Días', 'Nota']].concat(items.map(function (it) {
    return [
      it.agrupacion || '',
      (it.emails || []).join(', '),
      (it.emailsPrevision || []).join(', '),
      (it.dias || []).join(', '),
      it.notas || ''
    ];
  }));

  const csv = filas.map(function (fila) {
    return fila.map(function (campo) {
      return '"' + String(campo == null ? '' : campo).replace(/"/g, '""') + '"';
    }).join(';');
  }).join('\r\n');

  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'agrupaciones_' + hoyStr() + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

function cargarAgrupacionesConfig_() {
  if (ESTADO.vista !== 'configuracion' || ESTADO_CONFIG.seccionActiva !== 'emails') return;
  Promise.all([
    llamarApi_('getAgrupacionesConfig', []),
    llamarApi_('getTiendasConfig', [])
  ])
    .then(function (resultados) {
      if (ESTADO.vista !== 'configuracion' || ESTADO_CONFIG.seccionActiva !== 'emails') return;
      EMAILS_CONFIG_ESTADO.datos = resultados[0] || [];
      TIENDAS_POR_AGRUPACION_CONFIG_ = calcularTiendasPorAgrupacion_(resultados[1] || []);
      pintarListaEmails_();
      actualizarTotalEmailsConfig_();
      ajustarAlturaListaScrollable_('emails-config-lista');
    })
    .catch(function (err) {
      mostrarErrorServidor(err);
      const listaEl = document.getElementById('emails-config-lista');
      if (listaEl) listaEl.innerHTML = '<div class="emails-config-vacio">No se ha podido cargar la lista.</div>';
    });
}

/** Cuenta, para cada agrupación (clave de ruta), cuántas tiendas tienen esa
 *  agrupación entre las suyas (una tienda puede estar en varias agrupaciones
 *  distintas según el día). Se usa en la tarjeta de "Email agencias" para
 *  mostrar "Tiendas configuradas: X tiendas". */
function calcularTiendasPorAgrupacion_(tiendas) {
  const mapa = {};
  (tiendas || []).forEach(function (t) {
    (t.agrupaciones || []).forEach(function (a) {
      mapa[a] = (mapa[a] || 0) + 1;
    });
  });
  return mapa;
}

/** Aplica el buscador y los badges (sin uso / nueva / sin email) activos en
 *  EMAILS_CONFIG_ESTADO sobre EMAILS_CONFIG_ESTADO.datos. Centralizado
 *  aquí para que la lista en pantalla y las exportaciones a PDF/Excel
 *  muestren siempre exactamente lo mismo. */
function obtenerAgrupacionesConfigFiltradas_() {
  const filtro = EMAILS_CONFIG_ESTADO.filtroTexto;
  return EMAILS_CONFIG_ESTADO.datos.filter(function (it) {
    const sinEmail = (!it.emails || !it.emails.length) && (!it.emailsPrevision || !it.emailsPrevision.length);
    if (EMAILS_CONFIG_ESTADO.soloSinUso && !/^SIN USO/i.test(it.estado || '')) return false;
    if (EMAILS_CONFIG_ESTADO.soloNueva && !/^NUEVA/i.test(it.estado || '')) return false;
    if (EMAILS_CONFIG_ESTADO.soloSinEmail && !sinEmail) return false;
    if (!filtro) return true;
    const texto = (it.agrupacion + ' ' + it.emails.join(' ') + ' ' + (it.emailsPrevision || []).join(' ') + ' ' + (it.notas || '')).toLowerCase();
    return texto.indexOf(filtro) !== -1;
  });
}

function guardarEmailAgrupacion_(agrupacion, idSeguro, btn) {
  const emailsTexto = document.getElementById(idSeguro + '_emails').value;
  const emailsPrevisionTexto = document.getElementById(idSeguro + '_emailsPrevision').value;
  const notas = document.getElementById(idSeguro + '_notas').value;
  btn.disabled = true;
  llamarApi_('guardarEmailsAgrupacion', [agrupacion, emailsTexto, notas, emailsPrevisionTexto])
    .then(function () {
      mostrarToast('Emails guardados');
      cargarAgrupacionesConfig_();
    })
    .catch(function (err) {
      btn.disabled = false;
      mostrarErrorServidor(err);
    });

function confirmarEliminarAgrupacionConfig_(agrupacion) {
  appConfirm(
    'Eliminar de la configuración',
    '¿Seguro que quieres eliminar "' + agrupacion + '" de Config_Agrupaciones? Si esa agrupación se sigue usando en alguna hoja de día, no se le podrá enviar el resumen por email hasta que vuelvas a añadirla.',
    function () { eliminarAgrupacionConfig_(agrupacion); }
  );
}

function eliminarAgrupacionConfig_(agrupacion) {
  llamarApi_('eliminarAgrupacionConfig', [agrupacion])
    .then(function () {
      mostrarToast('Eliminado');
      cargarAgrupacionesConfig_();
    })
    .catch(mostrarErrorServidor);
}

function sincronizarAgrupacionesDesdeApp_() {
  const btn = document.getElementById('btn-sincronizar-agrupaciones');
  if (btn) { btn.classList.add('girando'); btn.disabled = true; }
  llamarApi_('sincronizarAgrupaciones', [])
    .then(function (resultado) {
      if (btn) { btn.classList.remove('girando'); btn.disabled = false; }
      const nuevas = (resultado && resultado.nuevas) || [];
      const huerfanas = (resultado && resultado.huerfanas) || [];
      mostrarToast(!nuevas.length && !huerfanas.length
        ? 'Todo al día: no hay cambios'
        : nuevas.length + ' nueva(s), ' + huerfanas.length + ' sin uso');
      cargarAgrupacionesConfig_();
    })
    .catch(function (err) {
      if (btn) { btn.classList.remove('girando'); btn.disabled = false; }
      mostrarErrorServidor(err);
    });
}

/* ---------------- CONFIGURACIÓN: "Configuración tiendas" y "Aviso a tiendas" ----------------
 * Dos páginas relacionadas pero separadas:
 * - "Configuración tiendas" (renderConfigTiendas): igual patrón que "Emails
 *   agencias" (Config_Agrupaciones), pero sobre Config_Tiendas: email de
 *   cada tienda para el aviso de "barrido de día" y días de la semana en
 *   que recibe entrega (L M X J V S D, usado para calcular la fecha
 *   prevista del aviso).
 * - "Configuración hora aviso tiendas" (renderConfigHoraAvisoTiendas, dentro
 *   de Configuración): solo para admin, la config de horas del barrido
 *   automático por día de la semana.
 * - "Simulación envío tiendas" (renderSimulacionAvisoTiendas, dentro de
 *   Administración): solo para admin, el panel para lanzar el barrido a
 *   mano: envía a cada tienda con palets asignados ese día un correo con el
 *   total y la fecha de entrega calculada (24H/48H/72H según el marcador
 *   "*"/"^" de su nombre — ver detectarPlazoTienda_ en el backend).
 * Requiere en Code.gs: getTiendasConfig, guardarEmailTienda,
 * eliminarTiendaConfig, sincronizarTiendas y enviarAvisosTiendas.
 */
let TIENDAS_CONFIG_ESTADO = { datos: [], filtroTexto: '', soloSinUso: false, soloNueva: false, soloSinEmail: false };
let BARRIDO_TIENDAS_ESTADO = { fecha: null, resultado: null, resultadoFecha: null, simulado: false };
// Días de la semana para la config del barrido automático, numerados en
// ISO (1=lunes ... 7=domingo, igual que extract(isodow from fecha) en
// Postgres) para que casen directo con dia_semana en config_aviso_tiendas_dias.
const DIAS_SEMANA_AVISO = [
  { num: 1, nombre: 'Lunes' },
  { num: 2, nombre: 'Martes' },
  { num: 3, nombre: 'Miércoles' },
  { num: 4, nombre: 'Jueves' },
  { num: 5, nombre: 'Viernes' },
  { num: 6, nombre: 'Sábado' },
  { num: 7, nombre: 'Domingo' }
];
// Horas entre las que se intenta el envío automático del aviso a
// tiendas, UNA config independiente por día de la semana (ver
// getConfigAvisoTiendas/guardarHoraAvisoTiendas en el backend).
// dias[n] = { hora, horaLimite } para el día ISO n (1=lunes..7=domingo).
//   hora        -> primer barrido (obligatoria para que el automático esté activo ese día)
//   horaLimite  -> último barrido de seguridad (opcional):
//                    - vacía: el automático dispara UNA sola vez ese día, en cuanto
//                      se alcanza "hora". Conteos que se pongan después ese día ya no
//                      se avisan solos, hay que usar los botones de abajo.
//                    - rellena: el automático se repite cada ~15 min mientras
//                      "hora" <= ahora <= "horaLimite", avisando a las tiendas
//                      que se van poniendo listas en esa ventana. Pasada
//                      "horaLimite" no se envía nada más automáticamente ese día.
let HORA_AVISO_TIENDAS_ESTADO = { dias: {}, cargando: false };
// NOTA: antes había aquí un intento de calcular "ya avisadas hoy" por
// diferencia (total de tiendas activas menos la suma de los bloques del
// resultado), asumiendo que toda tienda activa aparece siempre en algún
// bloque. Esa suposición era falsa (hay tiendas activas que ese día ni
// siquiera tienen ruta en el cuadrante -- se filtran por día de la semana
// en enviar_avisos_tiendas -- así que tampoco aparecen en ningún bloque
// sin haber sido avisadas) y daba un número incorrecto. Se sustituyó por
// get_avisos_enviados_tiendas(p_fecha, p_token), un RPC nuevo en Supabase
// que consulta directamente la tabla avisos_enviados_tiendas (la misma
// que usa enviar_avisos_tiendas para saber a quién saltarse), así que el
// dato es exacto.
function cargarAvisosEnviadosTiendas_(fecha) {
  return llamarApi_('getAvisosEnviadosTiendas', [fecha]).catch(function () {
    return null; // si falla, sencillamente no se muestra el dato extra
  });
}

function vincularConfigHoraAvisoTiendas_() {
  const btnGuardarHora = document.getElementById('btn-guardar-hora-aviso');
  if (btnGuardarHora) btnGuardarHora.onclick = function () { guardarHoraAvisoTiendas_(); };
  // Un botón "Quitar" por fila de día: limpia solo los dos inputs de ese
  // día y guarda ya (mismo RPC que "Guardar horas", que siempre manda la
  // config de los 7 días juntos).
  document.querySelectorAll('.barrido-dia-quitar').forEach(function (btn) {
    btn.onclick = function () {
      const dia = btn.getAttribute('data-dia');
      const input = document.getElementById('barrido-hora-automatica-' + dia);
      const inputLimite = document.getElementById('barrido-hora-limite-' + dia);
      if (input) input.value = '';
      if (inputLimite) inputLimite.value = '';
      guardarHoraAvisoTiendas_();
    };
  });
  // Toggle "Avisar también del Domingo" (solo fila Sábado):
  // cambia su estado visual y guarda ya, igual que "Quitar".
  const btnSabadoDomingo = document.getElementById('barrido-sabado-avisa-domingo');
  if (btnSabadoDomingo) {
    btnSabadoDomingo.onclick = function () {
      const activo = btnSabadoDomingo.getAttribute('data-activo') === '1';
      const nuevoActivo = !activo;
      btnSabadoDomingo.setAttribute('data-activo', nuevoActivo ? '1' : '0');
      btnSabadoDomingo.classList.toggle('activo', nuevoActivo);
      guardarHoraAvisoTiendas_(
        nuevoActivo
          ? 'Activado: el barrido del sábado avisará también de las rutas de domingo'
          : 'Desactivado: el barrido del sábado ya no avisa de las rutas de domingo'
      );
    };
  }
  cargarHoraAvisoTiendas_();
}

/** Trae de Supabase las horas configuradas para el aviso automático a
 *  tiendas (una config por día de la semana) y rellena los inputs (solo
 *  los que el admin no ha tocado ya a mano mientras se cargaba). */
function cargarHoraAvisoTiendas_() {
  if (HORA_AVISO_TIENDAS_ESTADO.cargando) return;
  HORA_AVISO_TIENDAS_ESTADO.cargando = true;
  llamarApi_('getConfigAvisoTiendas', [])
    .then(function (dias) {
      HORA_AVISO_TIENDAS_ESTADO.cargando = false;
      const nuevoDias = {};
      (dias || []).forEach(function (d) {
        nuevoDias[d.dia] = {
          hora: d.horaAutomatica || '',
          horaLimite: d.horaLimite || '',
          offsetDias: d.offsetDias || 0
        };
      });
      HORA_AVISO_TIENDAS_ESTADO.dias = nuevoDias;
      DIAS_SEMANA_AVISO.forEach(function (d) {
        const cfg = nuevoDias[d.num] || { hora: '', horaLimite: '', offsetDias: 0 };
        const input = document.getElementById('barrido-hora-automatica-' + d.num);
        if (input && document.activeElement !== input) input.value = cfg.hora;
        const inputLimite = document.getElementById('barrido-hora-limite-' + d.num);
        if (inputLimite && document.activeElement !== inputLimite) inputLimite.value = cfg.horaLimite;
      });
      const btnSabadoDomingo = document.getElementById('barrido-sabado-avisa-domingo');
      if (btnSabadoDomingo) {
        const adelantaDomingo = !!(nuevoDias[6] && nuevoDias[6].offsetDias);
        btnSabadoDomingo.setAttribute('data-activo', adelantaDomingo ? '1' : '0');
        btnSabadoDomingo.classList.toggle('activo', adelantaDomingo);
      }
    })
    .catch(function (err) {
      HORA_AVISO_TIENDAS_ESTADO.cargando = false;
      mostrarErrorServidor(err);
    });
}

/** Guarda de golpe las horas de los 7 días (o las borra en el día que se
 *  haya dejado vacío, dejando el envío automático desactivado solo ese
 *  día). */
function guardarHoraAvisoTiendas_(mensajePersonalizado) {
  const btn = document.getElementById('btn-guardar-hora-aviso');
  const btnSabadoDomingo = document.getElementById('barrido-sabado-avisa-domingo');
  const dias = DIAS_SEMANA_AVISO.map(function (d) {
    const input = document.getElementById('barrido-hora-automatica-' + d.num);
    const inputLimite = document.getElementById('barrido-hora-limite-' + d.num);
    return {
      dia: d.num,
      horaAutomatica: input ? input.value : '',
      horaLimite: inputLimite ? inputLimite.value : '',
      offsetDias: (d.num === 6 && !!btnSabadoDomingo && btnSabadoDomingo.getAttribute('data-activo') === '1') ? 1 : 0
    };
  });
  if (btn) btn.disabled = true;
  llamarApi_('guardarHoraAvisoTiendas', [dias])
    .then(function () {
      if (btn) btn.disabled = false;
      const nuevoDias = {};
      let diasActivos = 0;
      dias.forEach(function (d) {
        nuevoDias[d.dia] = { hora: d.horaAutomatica, horaLimite: d.horaLimite, offsetDias: d.offsetDias };
        if (d.horaAutomatica) diasActivos++;
      });
      HORA_AVISO_TIENDAS_ESTADO.dias = nuevoDias;
      mostrarToast(
        mensajePersonalizado ||
        (diasActivos === 0
          ? 'Envío automático desactivado (solo manual todos los días)'
          : 'Horas guardadas: ' + diasActivos + (diasActivos === 1 ? ' día con' : ' días con') + ' barrido automático')
      );
    })
    .catch(function (err) {
      if (btn) btn.disabled = false;
      mostrarErrorServidor(err);
    });
}

function vincularSimulacionAvisoTiendas_() {
  const fechaInput = document.getElementById('barrido-fecha');
  if (fechaInput) {
    fechaInput.addEventListener('change', function (e) {
      if (!e.target.value) return;
      BARRIDO_TIENDAS_ESTADO.fecha = e.target.value;
      ejecutarBarridoTiendas_(true, true); // vista previa automática al cambiar de fecha, sin toast
    });
  }
  const btnPreview = document.getElementById('btn-barrido-preview');
  if (btnPreview) btnPreview.onclick = function () { ejecutarBarridoTiendas_(true); };
  const btnEnviar = document.getElementById('btn-barrido-enviar');
  if (btnEnviar) {
    btnEnviar.onclick = function () {
      appConfirm(
        'Enviar avisos reales',
        'Vas a encolar un correo real para cada tienda con palets asignados el ' + formatearFechaLarga(BARRIDO_TIENDAS_ESTADO.fecha) + '. Se irán enviando solos en los próximos minutos (máx. 30/min) y no se puede deshacer. ¿Seguro que quieres continuar?',
        function () { ejecutarBarridoTiendas_(false); }
      );
    };
  }
  // Al abrir la página, vista previa automática: así se ve de un vistazo si
  // hay tiendas ya avisadas hoy en un envío anterior, sin tener que pulsar
  // nada. Si ya había un resultado en memoria para esta misma fecha (por
  // ejemplo, al volver de otra pestaña de Configuración), se reutiliza en
  // vez de repetir la llamada.
  if (BARRIDO_TIENDAS_ESTADO.resultado && BARRIDO_TIENDAS_ESTADO.resultadoFecha === BARRIDO_TIENDAS_ESTADO.fecha) {
    pintarResultadoBarridoTiendas_();
  } else {
    ejecutarBarridoTiendas_(true, true);
  }
}

function ejecutarBarridoTiendas_(simulacion, silencioso) {
  const resEl = document.getElementById('barrido-resultado');
  const btnPreview = document.getElementById('btn-barrido-preview');
  const btnEnviar = document.getElementById('btn-barrido-enviar');
  if (btnPreview) btnPreview.disabled = true;
  if (btnEnviar) btnEnviar.disabled = true;
  if (resEl) resEl.innerHTML = '<div class="loader">' + (simulacion ? 'Calculando vista previa…' : 'Encolando correos…') + '</div>';

  const fechaSolicitada = BARRIDO_TIENDAS_ESTADO.fecha;
  llamarApi_('enviarAvisosTiendas', [fechaSolicitada, simulacion])
    .then(function (resultado) {
      if (btnPreview) btnPreview.disabled = false;
      if (btnEnviar) btnEnviar.disabled = false;
      BARRIDO_TIENDAS_ESTADO.resultado = resultado;
      BARRIDO_TIENDAS_ESTADO.resultadoFecha = fechaSolicitada;
      BARRIDO_TIENDAS_ESTADO.simulado = simulacion;
      pintarResultadoBarridoTiendas_();
      if (!silencioso) {
        mostrarToast(simulacion
          ? 'Vista previa: ' + resultado.enviados.length + ' se enviarían'
          : resultado.enviados.length + ' correo(s) encolado(s), se irán enviando a un ritmo máx. de 30/min');
      }
    })
    .catch(function (err) {
      if (btnPreview) btnPreview.disabled = false;
      if (btnEnviar) btnEnviar.disabled = false;
      if (resEl) resEl.innerHTML = '';
      mostrarErrorServidor(err);
    });
}

function pintarResultadoBarridoTiendas_() {
  const resEl = document.getElementById('barrido-resultado');
  if (!resEl) return;
  const r = BARRIDO_TIENDAS_ESTADO.resultado;
  if (!r) { resEl.innerHTML = ''; return; }
  const fecha = BARRIDO_TIENDAS_ESTADO.resultadoFecha;

  function listaColapsable(titulo, items, render) {
    if (!items.length) return '';
    return (
      '<details class="barrido-detalle">' +
        '<summary>' + titulo + ' (' + items.length + ')</summary>' +
        '<ul>' + items.map(render).join('') + '</ul>' +
      '</details>'
    );
  }

  cargarAvisosEnviadosTiendas_(fecha).then(function (yaAvisadas) {
    // El resultado puede haber cambiado (otra fecha, otro clic) mientras se
    // cargaba: si ya no es el que estamos pintando, no lo sobrescribas.
    if (BARRIDO_TIENDAS_ESTADO.resultado !== r) return;

    resEl.innerHTML =
      '<div class="barrido-resumen">' +
        '<div class="barrido-chip ok">' + r.enviados.length + (BARRIDO_TIENDAS_ESTADO.simulado ? ' se enviarían' : ' enviados') + '</div>' +
        (yaAvisadas ? '<div class="barrido-chip' + (yaAvisadas.length ? ' info' : '') + '" title="Tiendas que ya recibieron su aviso real hoy en un envío anterior (dato real de la tabla avisos_enviados_tiendas).">' + yaAvisadas.length + ' ya avisadas hoy</div>' : '') +
        '<div class="barrido-chip">' + (r.pendientesDeOtrasRutas ? r.pendientesDeOtrasRutas.length : 0) + ' sin conteo guardado</div>' +
        '<div class="barrido-chip">' + r.sinEmail.length + ' sin email</div>' +
        '<div class="barrido-chip">' + r.sinPalets.length + ' sin palets</div>' +
        '<div class="barrido-chip">' + r.cerradas.length + ' cerradas</div>' +
        (r.errores.length ? '<div class="barrido-chip error">' + r.errores.length + ' con error</div>' : '') +
      '</div>' +
      listaColapsable(BARRIDO_TIENDAS_ESTADO.simulado ? 'Se enviarían' : 'Encolados (se enviarán a 30/min)', r.enviados, function (it) {
        return '<li>' + escapeHtml(it.tienda) + ' — ' + it.total + ' palet(s) — entrega ' + formatearFechaLarga(it.fechaEntrega) + ' — ' + escapeHtml(it.email) + '</li>';
      }) +
      listaColapsable('Ya avisadas hoy (envío anterior)', yaAvisadas || [], function (it) {
        return '<li>' + escapeHtml(it.tienda) + ' — ' + it.total + ' palet(s) — enviado a las ' + formatearHoraCorta_(it.enviadoEn) + ' — ' + escapeHtml(it.email) + '</li>';
      }) +
      listaColapsable('Sin conteo guardado', r.pendientesDeOtrasRutas || [], function (t) { return '<li>' + escapeHtml(t) + '</li>'; }) +
      listaColapsable('Sin email configurado', r.sinEmail, function (t) { return '<li>' + escapeHtml(t) + '</li>'; }) +
      listaColapsable('Sin palets ese día', r.sinPalets, function (t) { return '<li>' + escapeHtml(t) + '</li>'; }) +
      listaColapsable('Cerradas ese día', r.cerradas, function (t) { return '<li>' + escapeHtml(t) + '</li>'; }) +
      listaColapsable('Errores de envío', r.errores, function (it) { return '<li>' + escapeHtml(it.tienda) + ' — ' + escapeHtml(it.error) + '</li>'; });

    ajustarAlturaListaScrollable_('barrido-resultado');
  });
}

/** Formatea un timestamp ISO (con hora) a "HH:MM" en hora local del
 *  navegador. Usado solo para el listado de "Ya avisadas hoy". */
function formatearHoraCorta_(isoTimestamp) {
  if (!isoTimestamp) return '—';
  const d = new Date(isoTimestamp);
  if (isNaN(d.getTime())) return '—';
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

/** Actualiza los contadores junto al título de "Configuración tiendas":
 *  nº total, nº "sin uso", nº "nueva" (falta email) y nº "sin email"
 *  (ninguna tienda con el campo Email relleno, aunque no esté marcada
 *  como "Nueva", para que no se escape ninguna). Los tres badges son
 *  clicables: alternan un filtro que muestra solo esas tiendas, y son
 *  excluyentes entre sí. */
function actualizarTotalTiendasConfig_() {
  const elTotal = document.getElementById('tiendas-config-total');
  const elSinUso = document.getElementById('tiendas-config-sinuso');
  const elNueva = document.getElementById('tiendas-config-nueva');
  const elSinEmail = document.getElementById('tiendas-config-sinemail');
  if (!elTotal || !elSinUso || !elNueva || !elSinEmail) return;

  const total = TIENDAS_CONFIG_ESTADO.datos.length;
  elTotal.textContent = total + (total === 1 ? ' tienda' : ' tiendas');

  const sinUso = TIENDAS_CONFIG_ESTADO.datos.filter(function (it) {
    return /^SIN USO/i.test(it.estado || '');
  }).length;
  const nueva = TIENDAS_CONFIG_ESTADO.datos.filter(function (it) {
    return /^NUEVA/i.test(it.estado || '');
  }).length;
  const sinEmail = TIENDAS_CONFIG_ESTADO.datos.filter(function (it) {
    return !it.email || !it.email.trim();
  }).length;

  elSinUso.textContent = sinUso + ' sin uso';
  elNueva.textContent = nueva + ' nueva' + (nueva === 1 ? '' : 's');
  elSinEmail.textContent = sinEmail + ' sin email';
  if (sinUso === 0) TIENDAS_CONFIG_ESTADO.soloSinUso = false;
  if (nueva === 0) TIENDAS_CONFIG_ESTADO.soloNueva = false;
  if (sinEmail === 0) TIENDAS_CONFIG_ESTADO.soloSinEmail = false;
  elSinUso.classList.toggle('activo', TIENDAS_CONFIG_ESTADO.soloSinUso);
  elNueva.classList.toggle('activo', TIENDAS_CONFIG_ESTADO.soloNueva);
  elSinEmail.classList.toggle('activo', TIENDAS_CONFIG_ESTADO.soloSinEmail);

  elSinUso.onclick = function () {
    TIENDAS_CONFIG_ESTADO.soloSinUso = !TIENDAS_CONFIG_ESTADO.soloSinUso;
    if (TIENDAS_CONFIG_ESTADO.soloSinUso) { TIENDAS_CONFIG_ESTADO.soloNueva = false; TIENDAS_CONFIG_ESTADO.soloSinEmail = false; }
    elSinUso.classList.toggle('activo', TIENDAS_CONFIG_ESTADO.soloSinUso);
    elNueva.classList.remove('activo');
    elSinEmail.classList.remove('activo');
    pintarListaTiendas_();

  elNueva.onclick = function () {
    TIENDAS_CONFIG_ESTADO.soloNueva = !TIENDAS_CONFIG_ESTADO.soloNueva;
    if (TIENDAS_CONFIG_ESTADO.soloNueva) { TIENDAS_CONFIG_ESTADO.soloSinUso = false; TIENDAS_CONFIG_ESTADO.soloSinEmail = false; }
    elNueva.classList.toggle('activo', TIENDAS_CONFIG_ESTADO.soloNueva);

    elSinEmail.classList.remove('activo');
    pintarListaTiendas_();
    ajustarAlturaListaScrollable_('tiendas-config-lista');
  };

  elSinEmail.onclick = function () {

    if (TIENDAS_CONFIG_ESTADO.soloSinEmail) { TIENDAS_CONFIG_ESTADO.soloSinUso = false; TIENDAS_CONFIG_ESTADO.soloNueva = false; }

    elSinUso.classList.remove('activo');
    elNueva.classList.remove('activo');
    pintarListaTiendas_();
    ajustarAlturaListaScrollable_('tiendas-config-lista');

/** Exporta a PDF la lista de tiendas visible en ese momento (respeta el
 *  buscador y los badges "sin uso" / "nueva" / "sin email" activos), con
 *  columnas Tienda, Email, Tránsito y Nota. Usa jsPDF + autoTable, ya
 *  cargados por CDN en el <head> para los PDFs de conteo. */
function exportarTiendasConfigPDF_() {
  if (!window.jspdf || !window.jspdf.jsPDF) {
    mostrarErrorServidor({ message: 'No se pudo cargar el generador de PDF.' });
    return;
  }
  const jsPDF = window.jspdf.jsPDF;
  const items = obtenerTiendasConfigFiltradas_();

  const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'p' });
  doc.setFontSize(13);
  doc.text('Configuración tiendas', 14, 14);
  doc.setFontSize(9);
  doc.setTextColor(120);
  doc.text(items.length + ' tienda' + (items.length === 1 ? '' : 's') + ' — ' + hoyStr(), 14, 20);
  doc.setTextColor(0);

  doc.autoTable({
    startY: 25,
    head: [['Tienda', 'Email', 'Tránsito', 'Nota']],
    body: items.map(function (it) {
      return [it.tienda || '', it.email || '', transitoTextoTienda_(it.transito), it.notas || ''];
    }),
    styles: { fontSize: 8, cellPadding: 2, overflow: 'linebreak' },
    headStyles: { fillColor: [30, 41, 59] },
    columnStyles: {
      0: { cellWidth: 45 },
      1: { cellWidth: 55 },
      2: { cellWidth: 20 },
      3: { cellWidth: 'auto' }
    }
  });

  doc.save('tiendas_' + hoyStr() + '.pdf');
}

/** Exporta a Excel (CSV con BOM y ; como separador, para que Excel en
 *  español lo abra bien de un doble clic) la misma lista visible que la
 *  exportación a PDF, con las mismas columnas. */
function exportarTiendasConfigExcel_() {
  const items = obtenerTiendasConfigFiltradas_();
  const filas = [['Tienda', 'Email', 'Tránsito', 'Nota']].concat(items.map(function (it) {
    return [it.tienda || '', it.email || '', transitoTextoTienda_(it.transito), it.notas || ''];
  }));

  const csv = filas.map(function (fila) {
    return fila.map(function (campo) {
      return '"' + String(campo == null ? '' : campo).replace(/"/g, '""') + '"';
    }).join(';');
  }).join('\r\n');

  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'tiendas_' + hoyStr() + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

function cargarTiendasConfig_() {
  if (ESTADO.vista !== 'configuracion' || ESTADO_CONFIG.seccionActiva !== 'tiendas') return;
  llamarApi_('getTiendasConfig', [])
    .then(function (datos) {
      if (ESTADO.vista !== 'configuracion' || ESTADO_CONFIG.seccionActiva !== 'tiendas') return;
      TIENDAS_CONFIG_ESTADO.datos = datos || [];
      pintarListaTiendas_();
      actualizarTotalTiendasConfig_();
      ajustarAlturaListaScrollable_('tiendas-config-lista');
    })
    .catch(function (err) {
      mostrarErrorServidor(err);
      const listaEl = document.getElementById('tiendas-config-lista');
      if (listaEl) listaEl.innerHTML = '<div class="emails-config-vacio">No se ha podido cargar la lista.</div>';
    });
}

/** Aplica el buscador y los badges (sin uso / nueva / sin email) activos en
 *  TIENDAS_CONFIG_ESTADO sobre TIENDAS_CONFIG_ESTADO.datos. Centralizado
 *  aquí para que la lista en pantalla y las exportaciones a PDF/Excel
 *  muestren siempre exactamente lo mismo. */
function obtenerTiendasConfigFiltradas_() {
  const filtro = TIENDAS_CONFIG_ESTADO.filtroTexto;
  return TIENDAS_CONFIG_ESTADO.datos.filter(function (it) {
    if (TIENDAS_CONFIG_ESTADO.soloSinUso && !/^SIN USO/i.test(it.estado || '')) return false;
    if (TIENDAS_CONFIG_ESTADO.soloNueva && !/^NUEVA/i.test(it.estado || '')) return false;
    if (TIENDAS_CONFIG_ESTADO.soloSinEmail && (it.email && it.email.trim())) return false;
    if (!filtro) return true;
    const texto = (it.tienda + ' ' + it.email + ' ' + (it.notas || '')).toLowerCase();
    return texto.indexOf(filtro) !== -1;
  });
}

/** Texto legible ("48h (2d)") para el valor numérico (1-5) de tránsito,
 *  reutilizando las mismas etiquetas que el desplegable de la lista. */
function transitoTextoTienda_(valor) {
  const op = TRANSITO_OPCIONES.filter(function (o) { return o.valor === Number(valor || 1); })[0];
  return op ? op.texto : TRANSITO_OPCIONES[0].texto;
}

    const esSinUso = /^SIN USO/i.test(it.estado || '');
    const esSinEmail = !esNueva && !(it.email && it.email.trim());
    const clase = 'emails-config-item' + (esNueva ? ' nueva' : (esSinUso ? ' sinuso' : (esSinEmail ? ' sinemail' : '')));
    const badge = esNueva
      ? '<span class="emails-config-badge nueva">Nueva — falta email</span>'
      : (esSinUso ? '<span class="emails-config-badge sinuso">Sin uso</span>'

    const idSeguro = 'tc' + idx;
    const dias = it.dias || {};
    const DIAS_FILA = [
      { clave: 'lunes', letra: 'L' },
      { clave: 'martes', letra: 'M' },
      { clave: 'miercoles', letra: 'X' },
      { clave: 'jueves', letra: 'J' },
      { clave: 'viernes', letra: 'V' },
      { clave: 'sabado', letra: 'S' },

    ];

        '<div class="emails-config-fila-info-col">' +

                '" data-dia-tienda="' + escapeAttr(it.tienda) + '" data-dia="' + d.clave +
                '" title="' + (activo ? 'Recibe entrega en ' : 'No recibe entrega en ') + d.clave +
                '" ' + (tienePermiso('tiendas') ? '' : 'disabled') + '>' + d.letra + '</button>';
            }).join('') +
          '</div>' +
        '</div>' +
        '<div class="emails-config-fila-info-col">' +
          '<div class="emails-config-dias-etiqueta">Configurada en los conteos del</div>' +
          '<div class="emails-config-dias-conteo">' +
            (diasConteo.length ? diasConteo.map(escapeHtml).join(', ') : '—') +
          '</div>' +
        '</div>' +

          '<div class="emails-config-dias-etiqueta">Agrupación configurada</div>' +
          '<div class="emails-config-dias-conteo">' +

                '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>' +
              '</button>' : '') +

          '<span class="emails-config-acciones-derecha">' +

            '<button type="button" class="emails-config-borrar" title="' + (esSinUso ? 'Eliminar de la configuración' : 'No se puede eliminar: esta tienda está activa en el cuadrante de algún día') + '" data-borrar="' + escapeAttr(it.tienda) + '" ' + (esSinUso ? '' : 'disabled') + '>' +
              '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>' +

          '</div>' +

            '<label>Notas</label>' +

              TRANSITO_OPCIONES.map(function (op) {
                return '<option value="' + op.valor + '"' + (Number(it.transito || 1) === op.valor ? ' selected' : '') + '>' + op.texto + '</option>';
              }).join('') +

          '<button type="button" class="emails-config-guardar" data-guardar="' + escapeAttr(it.tienda) + '" data-id="' + idSeguro + '">' +
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>' +
            'Guardar</button>' +

  listaEl.querySelectorAll('[data-guardar]').forEach(function (btn) {

    btn.onclick = function () {
      if (btn.disabled) return;
      confirmarEliminarTiendaConfig_(btn.getAttribute('data-borrar'));
    };
  });
  listaEl.querySelectorAll('[data-renombrar]').forEach(function (btn) {
    btn.onclick = function () { abrirModalRenombrarTiendaConfig_(btn.getAttribute('data-renombrar')); };
  });
  listaEl.querySelectorAll('[data-dia-tienda]').forEach(function (btn) {
    btn.onclick = function () {
      toggleDiaEntregaTienda_(btn.getAttribute('data-dia-tienda'), btn.getAttribute('data-dia'), btn);
    };
  });
  listaEl.querySelectorAll('[data-transito-tienda]').forEach(function (sel) {
    sel.onchange = function () { guardarTransitoTienda_(sel.getAttribute('data-transito-tienda'), sel); };
  });
}

/** Opciones del selector de tránsito en "Configuración tiendas". Sustituye
 *  al viejo sistema de poner "*" (48H) o "^" (72H) al final del nombre de
 *  la tienda: ahora el tránsito se guarda como campo propio en
 *  config_tiendas.transito_dias (1 a 5) y se lee desde ahí en las
 *  pantallas de conteo, en vez de parsearlo del nombre. */
var TRANSITO_OPCIONES = [
  { valor: 1, texto: '24h (1d)' },
  { valor: 2, texto: '48h (2d)' },
  { valor: 3, texto: '72h (3d)' },
  { valor: 4, texto: '96h (4d)' },
  { valor: 5, texto: '120h (5d)' }
];

function guardarTransitoTienda_(tienda, sel) {
  const valorAnterior = sel.getAttribute('data-valor-anterior') || sel.value;
  sel.disabled = true;
  llamarApi_('guardarTransitoTienda', [tienda, Number(sel.value)])
    .then(function () {
      sel.setAttribute('data-valor-anterior', sel.value);
      sel.disabled = false;
      mostrarToast('Tránsito guardado');
    })
    .catch(function (err) {
      sel.value = valorAnterior;
      sel.disabled = false;
      mostrarErrorServidor(err);
    });
}

function toggleDiaEntregaTienda_(tienda, dia, btn) {
  const activarAhora = !btn.classList.contains('activo');
  btn.disabled = true;
  llamarApi_(activarAhora ? 'activarDiaEntregaTienda' : 'desactivarDiaEntregaTienda', [tienda, dia])
    .then(function () {
      cargarTiendasConfig_();
    })
    .catch(function (err) {
      btn.disabled = false;
      mostrarErrorServidor(err);
    });
}

function guardarEmailTienda_(tienda, idSeguro, btn) {
  const email = document.getElementById(idSeguro + '_email').value;
  const notas = document.getElementById(idSeguro + '_notas').value;
  btn.disabled = true;
  llamarApi_('guardarEmailTienda', [tienda, email, notas])
    .then(function () {
      mostrarToast('Email guardado');
      cargarTiendasConfig_();
    })
    .catch(function (err) {
      btn.disabled = false;
      mostrarErrorServidor(err);
    });
}

/** Modal para cambiar el nombre de una tienda desde "Configuración
 *  tiendas". Antes de mostrar el formulario, consulta en cuántos días
 *  (hojas de ruta activas) aparece esa tienda, para avisar de que el
 *  cambio se propagará a todas ellas -- igual que ya pasaba al renombrar
 *  desde "Rutas y tiendas (plantilla)". */
function abrirModalRenombrarTiendaConfig_(claveActual) {
  document.getElementById('modal-box').classList.remove('ancho');
  document.getElementById('modal-box').classList.remove('usuario-form');
  document.getElementById('modal-box').classList.add('medio');
  document.getElementById('modal-box').classList.remove('peligro');
  document.getElementById('modal-title').style.display = '';
  document.getElementById('modal-title').textContent = 'Cambiar nombre de tienda';
  document.getElementById('modal-text').style.display = 'block';
  document.getElementById('modal-text').textContent = 'Consultando en cuántos días aparece…';
  document.getElementById('modal-textarea').style.display = 'none';

  const custom = document.getElementById('modal-custom');
  custom.style.display = 'block';
  custom.innerHTML =
    '<div class="modal-campo">' +
      '<label for="modal-tienda-nombre-nuevo">Nombre nuevo</label>' +
      '<input type="text" id="modal-tienda-nombre-nuevo" value="' + escapeAttr(claveActual) + '">' +
    '</div>';

  const actions = document.getElementById('modal-actions');
  actions.innerHTML =
    '<button class="modal-cancel" id="modal-cancel-btn">Cancelar</button>' +
    '<button class="modal-confirm" id="modal-confirm-btn" disabled>Cambiar nombre</button>';
  document.getElementById('modal-overlay').style.display = 'flex';
  document.getElementById('modal-cancel-btn').onclick = cerrarModal;

  llamarApi_('aparicionesTiendaConfig', [claveActual])
    .then(function (resultado) {
      const total = (resultado && resultado.total) || 0;
      const dias = (resultado && resultado.dias) || [];
      const ORDEN_DIAS_SEMANA = ['LUNES', 'MARTES', 'MIERCOLES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SABADO', 'SÁBADO', 'DOMINGO'];
      const diasOrdenados = dias.slice().sort(function (a, b) {
        const ia = ORDEN_DIAS_SEMANA.indexOf(String(a).toUpperCase());
        const ib = ORDEN_DIAS_SEMANA.indexOf(String(b).toUpperCase());
        return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
      });
      document.getElementById('modal-text').textContent = total > 0
        ? 'Esta tienda aparece en los conteos de ' + total + (total === 1 ? ' día' : ' días') +
          (diasOrdenados.length ? ' (' + diasOrdenados.join(', ') + ')' : '') +
          '. Si le cambias el nombre, también se cambiará en todos esos días.'
        : 'Esta tienda no aparece actualmente en ningún día de las hojas de ruta activas.';
      const btn = document.getElementById('modal-confirm-btn');
      if (btn) btn.disabled = false;
    })
    .catch(function (err) {
      document.getElementById('modal-text').textContent = '';
      mostrarErrorServidor(err);
    });

  document.getElementById('modal-confirm-btn').onclick = function () {
    const input = document.getElementById('modal-tienda-nombre-nuevo');
    const nombreNuevo = input.value.trim();
    if (!nombreNuevo) { input.focus(); return; }
    const btn = document.getElementById('modal-confirm-btn');
    btn.disabled = true;
    llamarApi_('renombrarTiendaConfig', [claveActual, nombreNuevo])
      .then(function (resultado) {
        cerrarModal();
        const propagadas = (resultado && resultado.propagadas) || 0;
        mostrarToast('Nombre actualizado' + (propagadas ? ' en ' + propagadas + (propagadas === 1 ? ' sitio' : ' sitios') : ''));
        cargarTiendasConfig_();
      })
      .catch(function (err) { btn.disabled = false; mostrarErrorServidor(err); });
  };
  setTimeout(function () { document.getElementById('modal-tienda-nombre-nuevo').focus(); document.getElementById('modal-tienda-nombre-nuevo').select(); }, 50);
}

function confirmarEliminarTiendaConfig_(tienda) {
  const it = TIENDAS_CONFIG_ESTADO.datos.find(function (d) { return d.tienda === tienda; });
  const esSinUso = !it || /^SIN USO/i.test(it.estado || '');
  if (!esSinUso) {
    mostrarToast('No se puede eliminar: esta tienda está activa en el cuadrante de algún día.');
    return;
  }
  appConfirm(
    'Eliminar de la configuración',
    '¿Seguro que quieres eliminar "' + tienda + '" de Config_Tiendas?',
    function () { eliminarTiendaConfig_(tienda); }
  );
}

function eliminarTiendaConfig_(tienda) {
  llamarApi_('eliminarTiendaConfig', [tienda])
    .then(function () {
      mostrarToast('Eliminado');
      cargarTiendasConfig_();
    })
    .catch(mostrarErrorServidor);
}

function sincronizarTiendasDesdeApp_() {
  const btn = document.getElementById('btn-sincronizar-tiendas');
  if (btn) { btn.classList.add('girando'); btn.disabled = true; }
  llamarApi_('sincronizarTiendas', [])
    .then(function (resultado) {
      if (btn) { btn.classList.remove('girando'); btn.disabled = false; }
      const nuevas = (resultado && resultado.nuevas) || [];
      const huerfanas = (resultado && resultado.huerfanas) || [];
      mostrarToast(!nuevas.length && !huerfanas.length
        ? 'Todo al día: no hay cambios'
        : nuevas.length + ' nueva(s), ' + huerfanas.length + ' sin uso');
      cargarTiendasConfig_();
    })
    .catch(function (err) {
      if (btn) { btn.classList.remove('girando'); btn.disabled = false; }
      mostrarErrorServidor(err);
    });
}

/** Compara por similitud de texto todas las claves de tiendas y muestra
 * en un modal las que se parecen mucho entre sí, para detectar la misma
 * tienda escrita de forma distinta algún día (espacios, guiones,
 * tildes...). El backend (buscar_posibles_duplicados_tiendas, con
 * pg_trgm) hace la comparación; aquí solo se pinta el resultado. */
function buscarDuplicadosTiendas_() {
  const btn = document.getElementById('btn-duplicados-tiendas');
  if (btn) { btn.classList.add('girando'); btn.disabled = true; }
  llamarApi_('buscarPosiblesDuplicadosTiendas', [])
    .then(function (pares) {
      if (btn) { btn.classList.remove('girando'); btn.disabled = false; }
      mostrarModalDuplicadosTiendas_(pares || []);
    })
    .catch(function (err) {
      if (btn) { btn.classList.remove('girando'); btn.disabled = false; }
      mostrarErrorServidor(err);
    });
}

function mostrarModalDuplicadosTiendas_(pares) {
  document.getElementById('modal-box').classList.add('medio');
  document.getElementById('modal-box').classList.remove('ancho');
  document.getElementById('modal-box').classList.remove('usuario-form');
  document.getElementById('modal-title').style.display = '';
  document.getElementById('modal-title').textContent = 'Posibles tiendas duplicadas';
  document.getElementById('modal-text').style.display = 'none';
  document.getElementById('modal-textarea').style.display = 'none';

  const custom = document.getElementById('modal-custom');
  custom.style.display = 'block';
  custom.innerHTML = !pares.length
    ? '<div class="modal-envio-ok">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>' +
        '<span>No se ha encontrado ningún nombre sospechosamente parecido.</span>' +
      '</div>'
    : '<p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 10px;">Estos nombres se parecen mucho entre sí. Si son la misma tienda, corrige el nombre en "Rutas y tiendas" el día que esté distinto, para que quede igual todos los días.</p>' +
      '<div style="display:flex;flex-direction:column;gap:8px;">' +
        pares.map(function (p) {
          return '<div style="border:1px solid var(--line);border-radius:9px;padding:9px 11px;">' +
            '<div style="font-weight:700;font-size:13px;color:var(--navy);">' + escapeHtml(p.tienda1) + '</div>' +
            '<div style="font-weight:700;font-size:13px;color:var(--navy);">' + escapeHtml(p.tienda2) + '</div>' +
            '<div style="font-size:11px;color:var(--ink-soft);margin-top:3px;">Coincidencia: ' + Math.round(p.similitud * 100) + '%</div>' +
          '</div>';
        }).join('') +
      '</div>';

  const actions = document.getElementById('modal-actions');
  actions.innerHTML = '<button class="modal-confirm" id="modal-confirm-btn">Cerrar</button>';
  document.getElementById('modal-overlay').style.display = 'flex';
  document.getElementById('modal-confirm-btn').onclick = cerrarModal;
}

/* ---------------- ADMINISTRACIÓN: "Palets forzados" ----------------
 * Pantalla de solo lectura sobre la hoja Palets_Forzados: cada vez que
 * alguien confirma dar palets en una casilla que traía "NO" (ver
 * escribirCeldaConteo_ / registrarPaletForzado_ en el backend), queda un
 * registro ahí. Hasta ahora solo se podía consultar abriendo la Google
 * Sheet a mano; esta pantalla lo trae a la app con filtro por fechas y
 * búsqueda de tienda.
 *
 * Requiere la función de backend getPaletsForzadosAdmin(fechaIni, fechaFin)
 * (SOLO ADMIN) -- ver nota al final de este bloque para añadirla a
 * Codigo.gs si todavía no existe.
 */
let ADMIN_PALETS_ESTADO = { fechaIni: null, fechaFin: null, filtroTexto: '', datos: null };

/** 'yyyy-MM-dd' de hace "dias" días, calculado en el propio navegador. */
function fechaHaceDiasJs_(dias) {
  const d = new Date();
  d.setDate(d.getDate() - dias);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function renderAdminPaletsForzados() {
  const cont = document.getElementById('admin-contenido');
  if (!cont) return;

  // Por defecto, últimos 30 días: es la ventana más útil para revisar
  // incidencias recientes sin cargar todo el histórico de golpe.
  if (!ADMIN_PALETS_ESTADO.fechaIni) ADMIN_PALETS_ESTADO.fechaIni = fechaHaceDiasJs_(30);
  if (!ADMIN_PALETS_ESTADO.fechaFin) ADMIN_PALETS_ESTADO.fechaFin = hoyStr();
  ADMIN_PALETS_ESTADO.filtroTexto = '';

  cont.innerHTML =

function pintarTarjetaServidor_(s) {
  const conectado = !!s.conectado;
  const cuotaConocida = s.cuotaRestante !== null && s.cuotaRestante !== undefined;
  const cuotaMaximaConocida = cuotaConocida && s.cuotaMaxima !== null && s.cuotaMaxima !== undefined && Number(s.cuotaMaxima) > 0;
  const pctCuota = cuotaMaximaConocida ? Math.max(0, Math.min(100, Math.round((Number(s.cuotaRestante) / Number(s.cuotaMaxima)) * 100))) : null;
  const cuotaBaja = pctCuota !== null && pctCuota <= 15;

  const filaCuota = cuotaConocida
    ? ('<div class="servidor-card-fila"><span class="etiqueta">Cuota email hoy</span><span class="valor">' +
        escapeHtml(String(s.cuotaRestante)) + (cuotaMaximaConocida ? (' / ' + escapeHtml(String(s.cuotaMaxima))) : '') +
      '</span></div>' +
      (cuotaMaximaConocida
        ? '<div class="servidor-card-cuota-barra' + (cuotaBaja ? ' baja' : '') + '"><div style="width:' + pctCuota + '%;"></div></div>'
        : ''))
    : '<div class="servidor-card-fila"><span class="etiqueta">Cuota email hoy</span><span class="valor">—</span></div>';

  const filaConexion = s.esEstaCuenta
    ? '<div class="servidor-card-fila"><span class="etiqueta">Conexión</span><span class="valor">Esta misma cuenta</span></div>'
    : '<div class="servidor-card-fila"><span class="etiqueta">Última conexión</span><span class="valor">' +
        (s.ultimaConexion ? escapeHtml(s.ultimaConexion) : 'nunca') +
      '</span></div>' +
      (s.minutosDesdeUltimaConexion !== null && s.minutosDesdeUltimaConexion !== undefined
        ? '<div class="servidor-card-fila"><span class="etiqueta">Hace</span><span class="valor">' + formatearMinutosTranscurridos_(s.minutosDesdeUltimaConexion) + '</span></div>'
        : '');

  return (
    '<div class="servidor-card ' + (conectado ? 'conectado' : 'desconectado') + '">' +
      '<div class="servidor-card-header">' +
        '<div>' +
          '<div class="servidor-card-nombre">' + escapeHtml(s.nombre || ('Lote ' + s.lote)) + '</div>' +
          (s.email ? '<div class="servidor-card-email">' + escapeHtml(s.email) + '</div>' : '') +
        '</div>' +
        '<span class="servidor-estado-badge ' + (conectado ? 'ok' : 'mal') + '"><span class="badge-dot"></span>' +
          (conectado ? 'Conectado' : 'Sin conexión reciente') +
        '</span>' +
      '</div>' +
      filaCuota +
      filaConexion +
      (s.notas ? '<div class="servidor-card-notas">' + escapeHtml(s.notas) + '</div>' : '') +
    '</div>'
  );
}

/** minutos -> "hace 5 min" / "hace 2 h 10 min" / "hace 3 días", para la
 *  tarjeta de cada cuenta puente en Administración > Servidores. */
function formatearMinutosTranscurridos_(minutos) {
  minutos = Number(minutos) || 0;
  if (minutos < 1) return 'ahora mismo';
  if (minutos < 60) return minutos + ' min';
  const horas = Math.floor(minutos / 60);
  const restoMin = minutos % 60;
  if (horas < 24) return horas + ' h' + (restoMin ? ' ' + restoMin + ' min' : '');
  const dias = Math.floor(horas / 24);
  return dias + (dias === 1 ? ' día' : ' días');
}

      { clave: 'agencias', etiqueta: 'Agencias y emails', desc: 'Editar emails y notas de cada agrupación de rutas, y sincronizar agrupaciones.' },

/** Devuelve el HTML de la cuadrícula de permisos, con las casillas ya
 *  marcadas según `permisosActuales` (objeto { clave: true/false, ... }
 *  tal cual viene/va en la columna jsonb "permisos" de la tabla usuarios). */
function renderPermisosCheckboxes_(permisosActuales) {
  const permisos = permisosActuales || {};
  return '<div class="permisos-grupos">' +
    CATALOGO_PERMISOS.map(function (grupo) {
      return '<div class="permiso-grupo">' +
        '<h4>' + escapeHtml(grupo.grupo) + '</h4>' +
        grupo.items.map(function (item) {
          const id = 'permiso-' + item.clave;
          const marcado = permisos[item.clave] ? ' checked' : '';
          return '<div class="permiso-item">' +
            '<input type="checkbox" id="' + id + '" data-permiso-clave="' + escapeAttr(item.clave) + '"' + marcado + '>' +
            '<div class="permiso-item-textos">' +
              '<label class="permiso-item-etiqueta" for="' + id + '">' + escapeHtml(item.etiqueta) + '</label>' +
              '<div class="permiso-item-desc">' + escapeHtml(item.desc) + '</div>' +
            '</div>' +
          '</div>';
        }).join('') +
      '</div>';
    }).join('') +
  '</div>';
}

/** Lee las casillas marcadas del formulario y devuelve el objeto de
 *  permisos { clave: true, ... } listo para mandar a crear_usuario /
 *  editar_usuario (solo se incluyen las que están marcadas). */
function leerPermisosMarcados_(custom) {
  const permisos = {};
  custom.querySelectorAll('[data-permiso-clave]').forEach(function (chk) {
    if (chk.checked) permisos[chk.getAttribute('data-permiso-clave')] = true;
  });
  return permisos;
}

    clearTimeout(temporizadorBusquedaUsuarios);
    const valor = e.target.value;
    temporizadorBusquedaUsuarios = setTimeout(function () {
      ADMIN_USUARIOS_ESTADO.filtroTexto = valor.trim().toLowerCase();
      pintarTablaUsuarios_();
    }, 200);
  });

  if (ADMIN_USUARIOS_ESTADO.datos) {
    pintarTablaUsuarios_();
  } else {
    cargarUsuariosAdmin_();
  }
}

function cargarUsuariosAdmin_(esRefrescoManual) {
  if (ESTADO.vista !== 'administracion' || ESTADO_ADMIN.seccionActiva !== 'usuarios') return;
  const resultadoEl = document.getElementById('admin-usuarios-resultado');
  const btnRefrescar = document.getElementById('btn-admin-usuarios-refrescar');
  if (esRefrescoManual && btnRefrescar) { btnRefrescar.classList.add('girando'); btnRefrescar.disabled = true; }
  if (!esRefrescoManual && resultadoEl) resultadoEl.innerHTML = '<div class="loader">Cargando…</div>';

  llamarApi_('getUsuarios', [])
    .then(function (datos) {
      if (ESTADO.vista !== 'administracion' || ESTADO_ADMIN.seccionActiva !== 'usuarios') return;
      if (btnRefrescar) { btnRefrescar.classList.remove('girando'); btnRefrescar.disabled = false; }
      ADMIN_USUARIOS_ESTADO.datos = datos || [];
      pintarTablaUsuarios_();
    })
    .catch(function (err) {
      if (btnRefrescar) { btnRefrescar.classList.remove('girando'); btnRefrescar.disabled = false; }
      mostrarErrorServidor(err);
      if (resultadoEl) resultadoEl.innerHTML = '<div class="emails-config-vacio">No se ha podido cargar la lista de usuarios.</div>';
    });
}

/** El usuario "12942" es el administrador principal y no se puede editar,
 *  cambiar de contraseña ni eliminar salvo que quien esté conectado sea
 *  precisamente ese mismo usuario (SESSION_USUARIO). Además, desde ahora,
 *  ningún Operario (aunque tenga el permiso "usuarios") puede tocar
 *  ninguna cuenta con rol Administrador -- eso incluye asignar o quitar
 *  ese rol, solo lo puede hacer otro Administrador. El backend
 *  (editar_usuario / eliminar_usuario / cambiar_password_usuario) hace
 *  además las mismas comprobaciones por su cuenta, así que esto es solo
 *  para no mostrar botones que el servidor rechazaría igualmente. */
function esUsuarioProtegidoIntocable_(usuario) {
  if (usuario.usuario === '12942' && SESSION_USUARIO !== '12942') return true;
  if (usuario.rol === 'admin' && !esAdmin()) return true;
  return false;
}

function pintarTablaUsuarios_() {
  const cont = document.getElementById('admin-usuarios-resultado');
  if (!cont) return;
  const datos = ADMIN_USUARIOS_ESTADO.datos || [];

  const filtro = ADMIN_USUARIOS_ESTADO.filtroTexto;
  const items = datos.filter(function (it) {
    if (!filtro) return true;
    const texto = (it.usuario + ' ' + (it.nombreCompleto || '')).toLowerCase();
    return texto.indexOf(filtro) !== -1;
  });

  if (!items.length) {
    cont.innerHTML =
      '<div class="emails-config-vacio">' +
        '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/></svg>' +
        (datos.length ? 'Ningún usuario coincide con la búsqueda.' : 'No hay usuarios todavía.') +
      '</div>';
    return;
  }

  const totalAdmin = datos.filter(function (it) { return it.rol === 'admin' && it.activo; }).length;

  cont.innerHTML =
    '<div class="admin-resumen">' + items.length + (items.length === 1 ? ' usuario' : ' usuarios') +
      ' · ' + totalAdmin + (totalAdmin === 1 ? ' administrador activo' : ' administradores activos') + '</div>' +
    '<div class="admin-tabla-wrap"><table class="admin-tabla usuarios-tabla">' +
      '<thead><tr><th>Nombre completo</th><th>Usuario</th><th>Rol</th><th>Estado</th><th>Creado</th><th></th></tr></thead>' +
      '<tbody>' + items.map(function (it) {
        return '<tr>' +
          '<td class="usuarios-col-nombre">' + escapeHtml(it.nombreCompleto || '—') + '</td>' +
          '<td>' + escapeHtml(it.usuario) + '</td>' +
          '<td><span class="usuarios-badge-rol ' + it.rol + '">' + (it.rol === 'admin' ? 'Administrador' : 'Operario') + '</span></td>' +
          '<td><span class="usuarios-badge-estado ' + (it.activo ? 'activo' : 'inactivo') + '"><span class="badge-dot"></span>' + (it.activo ? 'Activo' : 'Inactivo') + '</span></td>' +
          '<td>' + escapeHtml(it.creadoEn || '') + '</td>' +
          '<td><div class="usuarios-fila-acciones">' +
            (esUsuarioProtegidoIntocable_(it) ?
              '<button type="button" class="usuarios-btn-icono" title="Este usuario no se puede modificar" disabled>' +
                '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>' +
              '</button>'
            :
              '<button type="button" class="usuarios-btn-icono" title="Editar" data-editar="' + escapeAttr(it.id) + '">' +
                '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>' +
              '</button>' +
              '<button type="button" class="usuarios-btn-icono" title="Cambiar contraseña" data-password="' + escapeAttr(it.id) + '">' +
                '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3"/><path d="M16 7l3 3"/><path d="M19 4l3 3"/></svg>' +
              '</button>' +
              '<button type="button" class="usuarios-btn-icono peligro" title="Eliminar" data-eliminar="' + escapeAttr(it.id) + '">' +
                '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>' +
              '</button>'
            ) +
          '</div></td>' +
        '</tr>';
      }).join('') +
      '</tbody>' +
    '</table></div>';

  cont.querySelectorAll('[data-editar]').forEach(function (btn) {
    btn.onclick = function () {
      const usuario = ADMIN_USUARIOS_ESTADO.datos.find(function (u) { return u.id === btn.getAttribute('data-editar'); });
      if (usuario) abrirModalUsuario_(usuario);
    };
  });
  cont.querySelectorAll('[data-password]').forEach(function (btn) {
    btn.onclick = function () {
      const usuario = ADMIN_USUARIOS_ESTADO.datos.find(function (u) { return u.id === btn.getAttribute('data-password'); });
      if (usuario) abrirModalPasswordUsuario_(usuario);
    };
  });
  cont.querySelectorAll('[data-eliminar]').forEach(function (btn) {
    btn.onclick = function () {
      const usuario = ADMIN_USUARIOS_ESTADO.datos.find(function (u) { return u.id === btn.getAttribute('data-eliminar'); });
      if (usuario) confirmarEliminarUsuario_(usuario);
    };
  });
}

/** Modal de "Añadir usuario" (usuarioExistente = null) o "Editar usuario"
 *  (usuarioExistente = fila de ADMIN_USUARIOS_ESTADO.datos). La contraseña
 *  se pide aquí solo al crear; para cambiarla en un usuario ya existente
 *  está el botón aparte (llave), vía abrirModalPasswordUsuario_. */
function abrirModalUsuario_(usuarioExistente) {
  const esNuevo = !usuarioExistente;

  document.getElementById('modal-box').classList.remove('peligro');
  document.getElementById('modal-box').classList.remove('medio');
  document.getElementById('modal-box').classList.remove('ancho');
  document.getElementById('modal-box').classList.add('usuario-form');
  document.getElementById('modal-title').style.display = '';
  document.getElementById('modal-title').textContent = esNuevo ? 'Añadir usuario' : 'Editar usuario';
  document.getElementById('modal-text').style.display = 'none';
  document.getElementById('modal-textarea').style.display = 'none';

  const rolInicial = usuarioExistente ? usuarioExistente.rol : 'operario';
  const activoInicial = usuarioExistente ? !!usuarioExistente.activo : true;
  const permisosIniciales = (usuarioExistente && usuarioExistente.permisos) || {};

  const custom = document.getElementById('modal-custom');
  custom.style.display = 'block';
  custom.innerHTML =
    '<div class="modal-usuario-grid">' +
      '<div class="modal-usuario-col-izq">' +
        '<div class="modal-campo">' +
          '<label for="modal-usuario-nombre">Nombre completo</label>' +
          '<input type="text" id="modal-usuario-nombre" placeholder="Ej: JOSE LUIS FRANCO FERNANDEZ" value="' + escapeAttr(usuarioExistente ? usuarioExistente.nombreCompleto : '') + '">' +
        '</div>' +
        '<div class="modal-campo">' +
          '<label for="modal-usuario-usuario">Usuario (para entrar en la app)</label>' +
          '<input type="text" id="modal-usuario-usuario" placeholder="Ej: 12942" value="' + escapeAttr(usuarioExistente ? usuarioExistente.usuario : '') + '">' +
        '</div>' +
        (esNuevo
          ? '<div class="modal-campo">' +
              '<label for="modal-usuario-password">Contraseña</label>' +
              '<input type="password" id="modal-usuario-password" placeholder="Mínimo 3 caracteres" autocomplete="new-password">' +
            '</div>'
          : '') +
        '<div class="modal-campo">' +
          '<label>Rol</label>' +
          '<div class="modal-pills" id="modal-usuario-rol-pills">' +
            (esAdmin()
              ? '<button type="button" class="modal-pill' + (rolInicial === 'admin' ? ' activo' : '') + '" data-rol="admin">Administrador</button>'
              : '') +
            '<button type="button" class="modal-pill' + (rolInicial === 'operario' || !esAdmin() ? ' activo' : '') + '" data-rol="operario">Operario</button>' +
          '</div>' +
          (!esAdmin() ? '<div class="modal-campo-ayuda">Solo un administrador puede asignar el rol de Administrador.</div>' : '') +
        '</div>' +
        '<div class="modal-campo">' +
          '<div class="modal-campo-check">' +
            '<input type="checkbox" id="modal-usuario-activo"' + (activoInicial ? ' checked' : '') + '>' +
            '<label for="modal-usuario-activo">Activo (puede entrar en la app)</label>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="modal-usuario-col-der">' +
        '<div class="modal-campo" id="modal-usuario-permisos-wrap"' + (rolInicial === 'operario' ? '' : ' style="display:none"') + '>' +
          '<div class="modal-permisos-cabecera">' +
            '<label>Permisos</label>' +
            '<span class="modal-campo-ayuda modal-campo-ayuda-inline">Marca lo que este operario puede hacer. Lo que no esté marcado no lo verá ni podrá usarlo.</span>' +
          '</div>' +
          renderPermisosCheckboxes_(permisosIniciales) +
        '</div>' +
        '<div class="modal-campo" id="modal-usuario-permisos-admin-nota"' + (rolInicial === 'admin' ? '' : ' style="display:none"') + '>' +
          '<div class="permisos-admin-nota">Un Administrador tiene acceso a todo automáticamente, así que aquí no hay nada que marcar.</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  custom.querySelectorAll('#modal-usuario-rol-pills .modal-pill').forEach(function (pill) {
    pill.onclick = function () {
      custom.querySelectorAll('#modal-usuario-rol-pills .modal-pill').forEach(function (p) { p.classList.remove('activo'); });
      pill.classList.add('activo');
      const esOperario = pill.getAttribute('data-rol') === 'operario';
      document.getElementById('modal-usuario-permisos-wrap').style.display = esOperario ? '' : 'none';
      document.getElementById('modal-usuario-permisos-admin-nota').style.display = esOperario ? 'none' : '';
    };
  });

  const actions = document.getElementById('modal-actions');
  actions.innerHTML =
    '<button class="modal-cancel" id="modal-cancel-btn">Cancelar</button>' +
    '<button class="modal-confirm" id="modal-confirm-btn">' + (esNuevo ? 'Crear usuario' : 'Guardar cambios') + '</button>';
  document.getElementById('modal-overlay').style.display = 'flex';
  document.getElementById('modal-cancel-btn').onclick = cerrarModal;
  document.getElementById('modal-confirm-btn').onclick = function () {
    const inputNombre = document.getElementById('modal-usuario-nombre');
    const inputUsuario = document.getElementById('modal-usuario-usuario');
    const nombreCompleto = inputNombre.value.trim();
    const usuario = inputUsuario.value.trim();
    const rolElegido = custom.querySelector('#modal-usuario-rol-pills .modal-pill.activo');
    const rol = rolElegido ? rolElegido.getAttribute('data-rol') : null;
    const activo = document.getElementById('modal-usuario-activo').checked;

    if (!usuario) { inputUsuario.focus(); return; }
    if (!rol) { mostrarToast('Elige un rol', true); return; }

    // Los administradores tienen acceso a todo por su rol, así que no se
    // les guarda ningún permiso fino (el backend los deja pasar igual).
    const permisos = rol === 'operario' ? leerPermisosMarcados_(custom) : {};

    if (esNuevo) {
      const inputPassword = document.getElementById('modal-usuario-password');
      const password = inputPassword.value;
      if (!password || password.length < 3) { inputPassword.focus(); return; }
      const btn = document.getElementById('modal-confirm-btn');
      btn.disabled = true;
      llamarApi_('crearUsuario', [usuario, nombreCompleto, password, rol, permisos])
        .then(function () {
          cerrarModal();
          mostrarToast('Usuario creado');
          cargarUsuariosAdmin_(true);
        })
        .catch(function (err) { btn.disabled = false; mostrarErrorServidor(err); });
    } else {
      const btn = document.getElementById('modal-confirm-btn');
      btn.disabled = true;
      llamarApi_('editarUsuario', [usuarioExistente.id, usuario, nombreCompleto, rol, activo, permisos])
        .then(function () {
          cerrarModal();
          mostrarToast('Usuario actualizado' + (usuario === SESSION_USUARIO ? ' (vuelve a entrar para ver el nombre nuevo arriba)' : ''));
          cargarUsuariosAdmin_(true);
        })
        .catch(function (err) { btn.disabled = false; mostrarErrorServidor(err); });
    }
  };
  setTimeout(function () { document.getElementById('modal-usuario-nombre').focus(); }, 50);
}

/** Modal pequeño solo para cambiar la contraseña de un usuario existente
 *  (separado del formulario de editar, para no pedir la contraseña cada
 *  vez que se toca el nombre o el rol). */
function abrirModalPasswordUsuario_(usuarioExistente) {
  document.getElementById('modal-box').classList.remove('ancho');
  document.getElementById('modal-box').classList.remove('usuario-form');
  document.getElementById('modal-box').classList.add('medio');
  document.getElementById('modal-box').classList.remove('peligro');
  document.getElementById('modal-title').style.display = '';
  document.getElementById('modal-title').textContent = 'Cambiar contraseña';
  document.getElementById('modal-text').style.display = 'block';
  document.getElementById('modal-text').textContent = 'Nueva contraseña para "' + (usuarioExistente.nombreCompleto || usuarioExistente.usuario) + '" (usuario ' + usuarioExistente.usuario + ').';
  document.getElementById('modal-textarea').style.display = 'none';

  const custom = document.getElementById('modal-custom');
  custom.style.display = 'block';
  custom.innerHTML =
    '<div class="modal-campo">' +
      '<label for="modal-usuario-password-nueva">Contraseña nueva</label>' +
      '<input type="password" id="modal-usuario-password-nueva" placeholder="Mínimo 3 caracteres" autocomplete="new-password">' +
    '</div>';

  const actions = document.getElementById('modal-actions');
  actions.innerHTML =
    '<button class="modal-cancel" id="modal-cancel-btn">Cancelar</button>' +
    '<button class="modal-confirm" id="modal-confirm-btn">Cambiar contraseña</button>';
  document.getElementById('modal-overlay').style.display = 'flex';
  document.getElementById('modal-cancel-btn').onclick = cerrarModal;
  document.getElementById('modal-confirm-btn').onclick = function () {
    const input = document.getElementById('modal-usuario-password-nueva');
    const password = input.value;
    if (!password || password.length < 3) { input.focus(); return; }
    const btn = document.getElementById('modal-confirm-btn');
    btn.disabled = true;
    llamarApi_('cambiarPasswordUsuario', [usuarioExistente.id, password])
      .then(function () {
        cerrarModal();
        mostrarToast('Contraseña actualizada');
      })
      .catch(function (err) { btn.disabled = false; mostrarErrorServidor(err); });
  };
  setTimeout(function () { document.getElementById('modal-usuario-password-nueva').focus(); }, 50);
}

/** Modal "Mi usuario": abre el icono de persona en la topbar. Muestra los
 *  datos de la sesión actual (nombre, usuario, rol, permisos) en solo
 *  lectura -- ya vienen en memoria desde el login (SESSION_*), no hace
 *  falta pedirlos otra vez al servidor -- y debajo deja cambiar la propia
 *  contraseña (pidiendo la actual, a diferencia del cambio de contraseña
 *  de OTRO usuario desde Administración, que no la pide). */
function abrirModalMiUsuario_() {
  document.getElementById('modal-box').classList.remove('ancho');
  document.getElementById('modal-box').classList.remove('usuario-form');
  document.getElementById('modal-box').classList.add('medio');
  document.getElementById('modal-box').classList.remove('peligro');
  document.getElementById('modal-title').style.display = '';
  document.getElementById('modal-title').textContent = 'Mi usuario';
  document.getElementById('modal-text').style.display = 'none';
  document.getElementById('modal-textarea').style.display = 'none';

  const esAdministrador = esAdmin();
  const clavesPermisos = Object.keys(SESSION_PERMISOS || {}).filter(function (c) { return SESSION_PERMISOS[c]; });
  const etiquetasPermisos = [];
  CATALOGO_PERMISOS.forEach(function (grupo) {
    grupo.items.forEach(function (item) {
      if (clavesPermisos.indexOf(item.clave) !== -1) etiquetasPermisos.push(item.etiqueta);
    });
  });
  const permisosHtml = esAdministrador
    ? '<div class="modal-pills"><span class="modal-pill activo">Acceso a todo (Administrador)</span></div>'
    : (etiquetasPermisos.length
        ? '<div class="modal-pills">' + etiquetasPermisos.map(function (e) { return '<span class="modal-pill activo">' + escapeHtml(e) + '</span>'; }).join('') + '</div>'
        : '<div class="mi-usuario-permisos-vacio">Sin permisos adicionales asignados.</div>');

  const custom = document.getElementById('modal-custom');
  custom.style.display = 'block';
  custom.innerHTML =
    '<div class="modal-campo">' +
      '<label>Nombre completo</label>' +
      '<input type="text" readonly value="' + escapeAttr(SESSION_NOMBRE || '') + '">' +
    '</div>' +
    '<div class="modal-campo">' +
      '<label>Usuario</label>' +
      '<input type="text" readonly value="' + escapeAttr(SESSION_USUARIO || '') + '">' +
    '</div>' +
    '<div class="modal-campo">' +
      '<label>Rol</label>' +
      '<input type="text" readonly value="' + (esAdministrador ? 'Administrador' : 'Operario') + '">' +
    '</div>' +
    '<div class="modal-campo">' +
      '<label>Permisos</label>' +
      permisosHtml +
    '</div>' +
    '<hr class="mi-usuario-separador">' +
    '<div class="modal-campo">' +
      '<label for="mi-usuario-password-actual">Contraseña actual</label>' +
      '<input type="password" id="mi-usuario-password-actual" autocomplete="current-password">' +
    '</div>' +
    '<div class="modal-campo">' +
      '<label for="mi-usuario-password-nueva">Contraseña nueva</label>' +
      '<input type="password" id="mi-usuario-password-nueva" placeholder="Mínimo 3 caracteres" autocomplete="new-password">' +
    '</div>' +
    '<div class="modal-campo">' +
      '<label for="mi-usuario-password-repetir">Repetir contraseña nueva</label>' +
      '<input type="password" id="mi-usuario-password-repetir" autocomplete="new-password">' +
    '</div>';

  const actions = document.getElementById('modal-actions');
  actions.innerHTML =
    '<button class="modal-cancel" id="modal-cancel-btn">Cerrar</button>' +
    '<button class="modal-confirm" id="modal-confirm-btn">Cambiar contraseña</button>';
  document.getElementById('modal-overlay').style.display = 'flex';
  document.getElementById('modal-cancel-btn').onclick = cerrarModal;
  document.getElementById('modal-confirm-btn').onclick = function () {
    const inputActual = document.getElementById('mi-usuario-password-actual');
    const inputNueva = document.getElementById('mi-usuario-password-nueva');
    const inputRepetir = document.getElementById('mi-usuario-password-repetir');

    if (!inputActual.value) { mostrarToast('Escribe tu contraseña actual', true); inputActual.focus(); return; }
    if (!inputNueva.value || inputNueva.value.length < 3) { mostrarToast('La contraseña nueva debe tener al menos 3 caracteres', true); inputNueva.focus(); return; }
    if (inputRepetir.value !== inputNueva.value) { mostrarToast('Las dos contraseñas nuevas no coinciden', true); inputRepetir.focus(); return; }

    const btn = document.getElementById('modal-confirm-btn');
    btn.disabled = true;
    llamarApi_('cambiarMiPassword', [inputActual.value, inputNueva.value])
      .then(function () {
        cerrarModal();
        mostrarToast('Contraseña actualizada');
      })
      .catch(function (err) { btn.disabled = false; mostrarErrorServidor(err); });
  };
}

function confirmarEliminarUsuario_(usuarioExistente) {
  appConfirm(
    'Eliminar usuario',
    '¿Seguro que quieres eliminar a "' + (usuarioExistente.nombreCompleto || usuarioExistente.usuario) + '" (usuario ' + usuarioExistente.usuario + ')? No podrá volver a entrar en la app.',
    function () {
      llamarApi_('eliminarUsuario', [usuarioExistente.id])
        .then(function () {
          mostrarToast('Usuario eliminado');
          cargarUsuariosAdmin_(true);
        })
        .catch(mostrarErrorServidor);
    },
    true
  );
}

/* ---------------- ADMINISTRACIÓN: "Cola de avisos a tiendas" ----------------
 * Los avisos de palets a tiendas (barrido del día, ver "Aviso a tiendas"
 * en Configuración) ya NO se envían al momento: enviar_avisos_tiendas()
 * los deja encolados en la tabla cola_emails_tiendas y un job de
 * pg_cron (procesar_cola_emails_tiendas, cada minuto) los va mandando de
 * verdad a un ritmo máximo de 30/min, para no saturar el SMTP.
 * Esta página es solo de consulta/control de esa cola: contadores por
 * estado, filtro por fecha y reintento manual de los que hayan quedado
 * en error (tras 5 intentos automáticos fallidos).
 */
let ADMIN_COLA_EMAILS_ESTADO = { datos: null, fecha: hoyStr(), refrescoAuto: null, filtroEstado: 'encola' };
