    border-top-left-radius: 3px; border-top-right-radius: 3px;
  }
  table.conteo tbody tr.fila-grupo-header .grupo-header {
    display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--amber-dark); font-weight: 700;
  }
  table.conteo tbody tr.fila-grupo-header .grupo-header svg { flex-shrink: 0; }
  table.conteo tbody tr.fila-grupo-header .grupo-header-tiendas { color: var(--ink); font-weight: 700; }
  table.conteo tbody tr.fila-grupo-header .grupo-header-chip {
    margin-left: auto; background: #fdf3e6; padding: 3px 9px; border-radius: 10px; white-space: nowrap;
  }
  table.conteo tbody tr.fila-grupo-header .grupo-header-chip.nota-grupo-aviso { background: #fbe6c4; }
  table.conteo tbody tr.fila-grupo-header .grupo-header-chip.nota-grupo-alerta { background: var(--danger); color: #fff; }
  table.conteo tbody tr.fila-grupo-header.fila-grupo-header-alerta td { background: #fbdada; border-top-color: var(--danger); }
  table.conteo tbody tr.fila-grupo-header.fila-grupo-header-alerta td::before { background: var(--danger); }
  table.conteo tbody tr.fila-grupo-header.fila-grupo-header-aviso td { background: #fbe6c4; }
  table.conteo td.limite { font-family: var(--mono); color: var(--ink-soft); }
  table.conteo input.celda {
    width: 52px; padding: 7px 4px; text-align: center; border: 1px solid var(--line);
    border-radius: 7px; font-family: var(--mono); font-size: 13.5px; background: #fff;
  }
  table.conteo input.celda::-webkit-outer-spin-button,
  table.conteo input.celda::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  table.conteo input.celda { -moz-appearance: textfield; }
  table.conteo input.celda:focus { outline: none; border-color: var(--navy-soft); box-shadow: 0 0 0 3px rgba(44,62,94,.1); }
  table.conteo input.celda:disabled { background: #f0f1f3; color: var(--ink-soft); cursor: not-allowed; }

  table.conteo input.celda-total {
    width: 60px; padding: 8px 4px; font-weight: 800; font-size: 14px; color: var(--navy);
    background: #eef1f7; border: 1.5px solid #d4dae4; cursor: default;
  }
  table.conteo input.celda-total:focus { box-shadow: none; }
  table.conteo input.celda-total:disabled { background: #eef1f7; color: var(--navy); opacity: .6; }

  table.conteo input.celda-total-visual {
    width: 60px; padding: 8px 4px; font-weight: 800; font-size: 14px; color: var(--navy);
    background: #eef1f7; border: 1.5px solid #d4dae4; cursor: default;
  }
  table.conteo input.celda-total-visual:focus { box-shadow: none; }
  table.conteo input.celda-total-visual:disabled { background: #eef1f7; color: var(--navy); opacity: .6; }

  table.conteo tr.fila-aviso input.celda { border-color: var(--amber); background: #fdf6ea; }
  table.conteo tr.fila-aviso input.celda-total,
  table.conteo tr.fila-aviso input.celda-total-visual { background: var(--amber); color: #2a1c04; border-color: var(--amber-dark); }
  table.conteo tr.fila-alerta input.celda { border-color: var(--danger); background: #fceded; color: var(--danger); }
  table.conteo tr.fila-alerta input.celda-total,
  table.conteo tr.fila-alerta input.celda-total-visual { background: var(--danger); color: #fff; border-color: var(--danger); }

  /* Casilla que trae "NO" desde el Excel (esa tienda no debe recibir palets
     por esa vía). Se muestra en rojo, no editable; el botón "+" permite
     forzar un número igualmente si hiciera falta, sin perder el "NO" original. */
  table.conteo input.celda-no {
    width: 52px; padding: 7px 4px; text-align: center; border-radius: 7px; font-family: var(--mono);
    font-size: 13.5px; font-weight: 800; color: var(--danger); background: #fceded; border: 1.5px solid var(--danger);
    cursor: pointer;
  }
  table.conteo input.celda-no:hover { background: #f8d7d7; }
  table.conteo input.celda-forzada {
    border-color: var(--amber-dark); background: #fdf6ea; color: var(--amber-dark); font-weight: 800;
  }
  .diff-nota { font-size: 10.5px; margin-top: 2px; font-weight: 600; }
  .diff-nota.aviso { color: var(--amber-dark); }
  .diff-nota.alerta { color: var(--danger); }

  table.conteo tr.fila-cerrada { background: #fceded !important; }
  table.conteo tr.fila-cerrada td.nombre { color: #8a3a3a; }
  .motivo-cierre { font-size: 13px; color: var(--danger); font-weight: 700; margin-top: 2px; max-width: none; width: 100%; text-align: center; }
  /* Tienda que hoy SALE de esta agrupación por un cambio puntual (excepción):
     tachada, en el mismo tono azul usado para "cambio" en el resto de la
     app (Gestión festivos, mini calendario). */
  table.conteo tr.fila-sale-excepcion { background: #eaf1fc !important; }
  table.conteo tr.fila-sale-excepcion td.nombre { color: #1f4e8c; text-decoration: line-through; text-decoration-color: #6f93c4; }
  .motivo-excepcion { color: #1f4e8c !important; max-width: none; width: 100%; font-size: 13px; font-weight: 700; text-align: center; }
  /* Tienda que hoy ENTRA a esta agrupación por un cambio puntual (excepción):
     toda la fila en amarillo suave para que resalte entre las de siempre. */
  table.conteo tr.fila-entra-excepcion { background: #fff8de !important; }
  table.conteo tr.fila-entra-excepcion td.nombre { color: #7a5417; }

  .btn-cerrar-tienda {
    background: none; border: none; color: var(--ink-soft); padding: 5px; border-radius: 6px; display: inline-flex;
  }
  .btn-cerrar-tienda:hover { background: #fceded; color: var(--danger); }
  .btn-reabrir {
    background: var(--danger); color: #fff; border: none; border-radius: 6px; padding: 5px 9px; font-size: 11px; font-weight: 700;
  }
  .btn-reabrir:hover { background: #a83e3e; }

  .btn { border: none; border-radius: 8px; padding: 10px 14px; font-size: 12.5px; font-weight: 600; width: 100%; line-height: 1.3; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }

  .seccion-body { border-top: 1px solid var(--line); display: flex; }
  .seccion-acciones {
    flex: 0 0 148px; padding: 16px; display: flex; flex-direction: column; gap: 8px;
    border-right: 1px solid var(--line); background: #fbfbfc;

  @media (max-width: 700px) {
    .seccion-body { flex-direction: column; }

    .orden-retirada { flex-basis: 100%; }
  }

  /* ---------- MODAL ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(20,26,36,.55);
    display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-box {
    background: #fff; border-radius: 16px; padding: 26px; max-width: 400px; width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,.3);
    max-height: calc(100vh - 40px); overflow-y: auto;
    transition: max-width .18s ease;
    position: relative;
  }
  .modal-cerrar-x {
    position: absolute; top: 16px; right: 16px; width: 30px; height: 30px;
    border: none; border-radius: 50%; background: transparent; color: var(--ink-soft);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background .15s, color .15s;
  }
  .modal-cerrar-x:hover { background: #eef0f3; color: var(--ink); }
  .modal-box h3 { margin: 0 0 8px; font-size: 16px; padding-right: 26px; }
  .modal-box p { margin: 0 0 16px; color: var(--ink-soft); font-size: 14px; line-height: 1.5; white-space: pre-line; }
  .modal-box textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
    font-size: 14px; resize: vertical; min-height: 76px; margin-bottom: 16px;
  }
  .modal-box textarea:focus { outline: none; border-color: var(--navy-soft); box-shadow: 0 0 0 3px rgba(44,62,94,.1); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 18px; }
  .modal-actions button { border: none; border-radius: 9px; padding: 10px 18px; font-size: 13.5px; font-weight: 600; transition: filter .15s, transform .05s; }
  .modal-actions button:hover { filter: brightness(1.06); }
  .modal-actions button:active { transform: scale(.97); }
  .modal-cancel { background: #eef0f3; color: var(--ink); }
  .modal-confirm { background: var(--navy); color: #fff; }
  .modal-confirm.danger { background: var(--danger); }
  .modal-confirm:disabled { background: #c7cbd3; color: #fff; cursor: not-allowed; }
  .modal-confirm:disabled:hover { filter: none; }

  /* ---------- Modal de confirmación "peligro" (borrado) ---------- */
  .modal-box.peligro { border-top: 5px solid var(--danger); }
  .modal-box.peligro h3 { color: var(--danger); display: flex; align-items: center; gap: 8px; }
  .modal-box.peligro h3::before {
    content: ''; flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%;
    background: var(--danger) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"><line x1="12" y1="8" x2="12" y2="13"/><circle cx="12" cy="16.5" r="0.5" fill="white" stroke="white"/></svg>') center/12px no-repeat;
  }

  /* ---------- Modal "Enviar Previsión / Enviar Definitivo" (versión amplia) ---------- */
  .modal-box.ancho { max-width: 680px; }

  /* ---------- Modal "Añadir/Editar usuario": mucho más ancho, con los
     datos básicos a la izquierda y los permisos a la derecha, pensado
     para verse entero de un vistazo sin necesidad de hacer scroll. ---------- */
  .modal-box.usuario-form {
    max-width: 1100px; min-height: 620px; padding: 34px;
    display: flex; flex-direction: column;
  }
  .modal-box.usuario-form #modal-custom { flex: 1; }
  .modal-box.usuario-form .modal-actions { margin-top: 24px; flex-shrink: 0; }
  .modal-usuario-grid { display: flex; gap: 36px; align-items: flex-start; }
  .modal-usuario-col-izq { flex: 0 0 270px; display: flex; flex-direction: column; }
  .modal-usuario-col-der { flex: 1; min-width: 0; }
  .modal-usuario-col-der .permisos-grupos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .modal-usuario-col-der .permiso-grupo { padding: 13px 14px; }
  .modal-usuario-col-der .permiso-item { padding: 8px 3px; }
  @media (max-width: 720px) {
    .modal-usuario-grid { flex-direction: column; gap: 0; }
    .modal-usuario-col-izq { flex-basis: auto; width: 100%; }
    .modal-usuario-col-der .permisos-grupos { grid-template-columns: 1fr; }
  }

  .modal-envio-cabecera {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
    padding-bottom: 16px; margin-bottom: 18px; border-bottom: 1px solid var(--line);
  }
  .modal-envio-cabecera-icono {
    width: 42px; height: 42px; border-radius: 11px; background: var(--navy);
    display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0;
  }
  .modal-envio-cabecera-texto { flex: 1; min-width: 0; }
  .modal-envio-cabecera-texto .nombre {
    font-size: 18px; font-weight: 800; color: var(--ink); line-height: 1.25;
    overflow-wrap: break-word;
  }
  .modal-envio-cabecera-texto .fecha { font-size: 13px; color: var(--ink-soft); margin-top: 2px; text-transform: capitalize; }

  .modal-envio-stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px;
  }
  .modal-envio-stat {
    background: #f6f7f9; border-radius: 12px; padding: 13px 14px; display: flex; flex-direction: column; gap: 6px;
  }
  .modal-envio-stat .lbl {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; color: var(--ink-soft);
    display: flex; align-items: center; gap: 5px;
  }
  .modal-envio-stat .val { font-size: 22px; font-weight: 800; color: var(--ink); line-height: 1; }
  .modal-envio-stat.acento { background: #fdf6ea; }
  .modal-envio-stat.acento .val { color: var(--amber-dark); }
  .modal-envio-stat.completo { background: #eaf7ef; }
  .modal-envio-stat.completo .val { color: #1f7a45; }
  .modal-envio-barra { height: 6px; border-radius: 3px; background: #e2e5ea; overflow: hidden; margin-top: 2px; }
  .modal-envio-barra-fill { height: 100%; border-radius: 3px; background: var(--amber); transition: width .35s ease; }
  .modal-envio-barra-fill.completo { background: var(--ok); }

  .modal-envio-aviso, .modal-envio-ok {
    display: flex; align-items: flex-start; gap: 9px; font-size: 12.5px; line-height: 1.5;
    border-radius: 10px; padding: 11px 13px; margin-bottom: 14px; font-weight: 600;
  }
  .modal-envio-aviso { background: #fdf6ea; color: var(--amber-dark); flex-direction: column; align-items: stretch; gap: 8px; }
  .modal-envio-aviso-titulo { display: flex; align-items: center; gap: 8px; }
  .modal-envio-aviso svg { flex-shrink: 0; }
  .modal-envio-ok { background: #eaf7ef; color: #1f7a45; }
  .modal-envio-ok svg { flex-shrink: 0; margin-top: 1px; }

  .modal-envio-chips {
    display: flex; flex-wrap: wrap; gap: 6px; max-height: 130px; overflow-y: auto; padding: 2px 2px 0;
  }
  .modal-envio-chip {
    background: #fff; color: var(--amber-dark); border: 1px solid #f3dfb3; border-radius: 20px;
    padding: 4px 11px; font-size: 12px; font-weight: 700; white-space: nowrap;
  }

  .modal-envio-alerta { background: #fceded; color: var(--danger); }
  .modal-envio-alerta .modal-envio-chip {
    color: var(--danger); border-color: #f3c6c6;
  }

  .modal-envio-nota {
    font-size: 12.5px; color: var(--ink-soft); line-height: 1.55; margin: 0;
    background: #f9fafb; border-radius: 10px; padding: 11px 13px;
  }

  .modal-cargando {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 18px 0 6px; text-align: center;
  }
  .modal-cargando span:last-child { font-size: 14px; font-weight: 600; color: var(--ink); }
  .spinner-navy {
    width: 30px; height: 30px; border-radius: 50%; border: 3px solid #e3e7ee;
    border-top-color: var(--navy); animation: girar .7s linear infinite; display: block;
  }
  .modal-resultado {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 14px 0 6px; text-align: center; font-size: 14px; font-weight: 600;
  }
  .modal-resultado.exito { color: #1f7a45; }
  .modal-resultado.error { color: var(--danger); }
  .modal-resultado svg { flex-shrink: 0; }

  /* ---------- Modal "Actualización obligatoria" ---------- */
  .modal-overlay.overlay-actualizacion {
    background: rgba(12,17,26,.78); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .modal-box.actualizacion {
    max-width: 380px; padding: 0; overflow: hidden; text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }
  .actualizacion-cabecera {
    background:
      radial-gradient(circle at 20% 15%, rgba(217,140,43,.35), transparent 55%),
      linear-gradient(160deg, var(--navy) 0%, #0f1a2c 100%);
    padding: 34px 28px 22px;
  }
  .actualizacion-icono {
    width: 60px; height: 60px; margin: 0 auto 16px; border-radius: 50%;
    background: linear-gradient(150deg, var(--amber), var(--amber-dark));

    box-shadow: 0 0 0 7px rgba(217,140,43,.16), 0 10px 22px rgba(0,0,0,.35);

  @keyframes pulso-actualizacion {
    0%, 100% { box-shadow: 0 0 0 7px rgba(217,140,43,.16), 0 10px 22px rgba(0,0,0,.35); }
    50% { box-shadow: 0 0 0 11px rgba(217,140,43,.08), 0 10px 22px rgba(0,0,0,.35); }
  }
  .actualizacion-cabecera h3 { margin: 0 0 6px; font-size: 18px; font-weight: 800; color: #fff; }
  .actualizacion-cabecera p { margin: 0; font-size: 13px; color: rgba(255,255,255,.65); line-height: 1.5; }
  .actualizacion-versiones {
    display: flex; align-items: center; justify-content: center; gap: 9px; margin-top: 16px;
  }
  .actualizacion-version-chip {
    font-size: 11.5px; font-weight: 700; letter-spacing: .02em; padding: 4px 10px; border-radius: 20px;
    font-variant-numeric: tabular-nums;
  }
  .actualizacion-version-chip.actual { background: rgba(255,255,255,.1); color: rgba(255,255,255,.65); }
  .actualizacion-version-chip.nueva { background: var(--amber); color: #fff; }
  .actualizacion-cuerpo { padding: 22px 26px 26px; }
  .actualizacion-motivo {
    display: flex; align-items: flex-start; gap: 9px; text-align: left; font-size: 12.5px;
    color: var(--ink-soft); line-height: 1.5; background: #f6f7f9; border-radius: 10px; padding: 11px 12px;
    margin-bottom: 18px;
  }
  .actualizacion-motivo svg { flex-shrink: 0; margin-top: 1px; color: var(--amber-dark); }
  .btn-actualizar-obligatorio {
    width: 100%; border: none; border-radius: 11px; padding: 14px 18px; font-size: 14.5px; font-weight: 700;
    background: linear-gradient(135deg, var(--navy), var(--navy-soft)); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    transition: filter .15s, transform .05s; box-shadow: 0 8px 18px rgba(28,43,69,.35);
  }
  .btn-actualizar-obligatorio:hover { filter: brightness(1.08); }
  .btn-actualizar-obligatorio:active { transform: scale(.98); }
  .btn-actualizar-obligatorio:disabled { opacity: .8; cursor: default; }
  .btn-actualizar-obligatorio .spinner { display: none; }
  .btn-actualizar-obligatorio.cargando .spinner { display: inline-block; }
  .actualizacion-nota-obligatoria {
    margin: 12px 0 0; font-size: 11px; color: var(--ink-soft); opacity: .8;
  }

  /* ---------- Insignia de versión (login e Inicio) ---------- */
  .version-badge {
    position: absolute; right: 18px; bottom: 34px; z-index: 2;
    font-size: 13px; font-weight: 700; letter-spacing: .02em;
    color: rgba(255,255,255,.35); pointer-events: none; user-select: none;
  }

  /* ---------- Banner "Instalar app" (solo en Inicio, si no está instalada) ---------- */
  .instalar-banner {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; margin: 16px 18px 0;
  }
  .instalar-banner-icon { width: 40px; height: 40px; border-radius: 9px; flex-shrink: 0; display: block; }
  .instalar-banner-texto { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .instalar-banner-texto strong { font-size: 14px; color: var(--navy); }
  .instalar-banner-texto span { font-size: 12.5px; color: var(--ink-soft); line-height: 1.4; }
  .instalar-banner-texto span svg { color: var(--navy); flex-shrink: 0; }
  .btn-instalar-app {

    .instalar-banner { margin: 12px 12px 0; padding: 12px; }

  /* Toast */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--navy); color: #fff; padding: 12px 20px; border-radius: 8px;
    font-size: 13.5px; opacity: 0; transition: all .25s; z-index: 300; pointer-events: none;
    max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { background: var(--danger); }

  .loader {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 50px 20px; color: var(--ink-soft); font-size: 14px;
  }
  .loader .spinner-navy { display: block; }

  /* ---------- Modal "Añadir observación" (algo más ancho que el estándar,
     para que quepan bien las píldoras de tipo y los chips de selección) ---- */
  .modal-box.medio { max-width: 480px; }

  /* ---------- Modal "Gestión de observaciones" (admin): más ancho y más
     alto que el "medio" estándar, ya que aquí hay bastante más contenido
     (píldoras de tipo, buscador con resultados desplegables, chips de
     selección) y en pantallas de escritorio sobra espacio de sobra. En
     pantallas estrechas cae a un ancho normal para no desbordar. ---------- */
  .modal-box.gestor-obs { max-width: 760px; padding: 34px 38px; }
  .modal-box.gestor-obs .gestor-form { gap: 20px; }
  .modal-box.gestor-obs .gestor-tipo-pills { grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .modal-box.gestor-obs .gestor-tipo-pill { padding: 14px 8px; font-size: 12.5px; }
  .modal-box.gestor-obs .gestor-campo input[type="date"],
  .modal-box.gestor-obs .gestor-campo input[type="text"],

    .modal-box.gestor-obs { max-width: 480px; padding: 26px; }
    .modal-box.gestor-obs .gestor-tipo-pills { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .modal-box.gestor-obs .gestor-tipo-pill { padding: 10px 6px; font-size: 11.5px; }
  }
  @media (max-width: 480px) {
    .modal-box.gestor-obs .gestor-tipo-pills { grid-template-columns: 1fr; }
    .modal-box.gestor-obs .gestor-tipo-pill { flex-direction: row; justify-content: flex-start; padding: 9px 12px; }
  }

  /* ---------- GESTIÓN DE OBSERVACIONES (admin, cualquier día) ---------- */
  .gestor-form { display: flex; flex-direction: column; gap: 16px; }

  /* Overlay de carga: cubre todo el modal (fondo blanco translúcido) con un
     spinner centrado, mientras se piden las agrupaciones/tiendas de ese día. */
  .gestor-loading-overlay {
    position: absolute; inset: 0; background: rgba(255,255,255,.82);
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px;
    border-radius: 16px; z-index: 5;
  }
  .gestor-loading-overlay.visible { display: flex; }
  .gestor-spinner {
    width: 30px; height: 30px; border-radius: 50%;
    border: 3px solid #e2e5eb; border-top-color: var(--navy); animation: gestor-spin .7s linear infinite;
  }
  @keyframes gestor-spin { to { transform: rotate(360deg); } }
  .gestor-loading-texto { font-size: 12.5px; color: var(--ink-soft); }

  /* Aviso de error al cargar (fallo del servidor o timeout): reemplaza al
     spinner y deja un botón para reintentar, en vez de quedarse colgado. */
  .gestor-aviso-error {
    display: none; align-items: flex-start; gap: 8px; background: #fdeceb; border: 1px solid #f6c6c1;
    color: var(--danger); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; line-height: 1.5;
  }
  .gestor-aviso-error.visible { display: flex; }
  .gestor-aviso-error button {
    flex-shrink: 0; background: #fff; border: 1px solid var(--danger); color: var(--danger);
    border-radius: 6px; padding: 4px 10px; font-size: 12px; font-weight: 700; white-space: nowrap;
  }
  .gestor-aviso-error button:hover { background: var(--danger); color: #fff; }
  .gestor-campo label {
    display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--ink-soft); font-weight: 700; margin-bottom: 6px;
  }
  .gestor-campo input[type="date"],
  .gestor-campo input[type="text"],
  .gestor-campo textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
    font-size: 14px; font-family: inherit;
  }
  .gestor-campo input[type="date"]:focus,
  .gestor-campo input[type="text"]:focus,
  .gestor-campo textarea:focus {
    outline: none; border-color: var(--navy-soft); box-shadow: 0 0 0 3px rgba(44,62,94,.1);
  }
  .gestor-campo textarea { min-height: 74px; resize: vertical; }
  .gestor-campo-ayuda { font-size: 11.5px; color: var(--ink-soft); margin-top: 6px; }

  /* Píldoras de tipo, ahora con icono + texto, en tarjetas algo más grandes
     para que se lean como una elección clara (no un simple filtro). */
  .gestor-tipo-pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .gestor-tipo-pill {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: #f9fafb; border-radius: 10px; padding: 10px 6px;
    font-size: 11.5px; font-weight: 700; color: var(--ink-soft); text-align: center; line-height: 1.2;
    transition: background .12s, border-color .12s, color .12s;
  }
  .gestor-tipo-pill svg { flex-shrink: 0; }
  .gestor-tipo-pill:hover:not(.activa):not(:disabled) { background: #f0f2f6; }
  .gestor-tipo-pill.activa { background: var(--navy); border-color: var(--navy); color: #fff; }
  .gestor-tipo-pill:disabled { opacity: .4; cursor: not-allowed; }
  @media (max-width: 480px) {
    .gestor-tipo-pills { grid-template-columns: 1fr; }
    .gestor-tipo-pill { flex-direction: row; justify-content: flex-start; padding: 9px 12px; }
  }

  .gestor-busqueda-wrap { position: relative; }
  .gestor-busqueda-wrap input { padding-right: 32px; }
  .gestor-busqueda-clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px;
    border: none; background: #eef1f5; border-radius: 50%; color: var(--ink-soft); cursor: pointer;
    display: none; align-items: center; justify-content: center; font-size: 13px; line-height: 1; padding: 0;
  }
  .gestor-busqueda-clear:hover { background: #dfe3e9; color: var(--ink); }
  .gestor-busqueda-clear.visible { display: flex; }
  .gestor-busqueda-resultados {
    /* position: fixed (no absolute): así el desplegable "escapa" del propio
       modal en vez de quedar atrapado por su scroll interno. Si fuera
       absolute (relativo al modal), cuando la lista era más alta de lo que
       cabía había que hacer scroll del modal ENTERO para verla completa —
       de ahí el corte feo con doble barra de scroll. Con fixed, la posición
       y la altura máxima se calculan por JS (ver posicionarResultadosGestorObs_)
       según el hueco real disponible en la pantalla en cada momento, así
       nunca se corta ni depende de nada más. */
    position: fixed; background: #fff;
    border: 1px solid var(--line); border-radius: 8px; overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,.18); z-index: 300;
  }
  .gestor-busqueda-item { display: flex; align-items: center; gap: 10px; padding: 8px 11px; font-size: 13px; cursor: pointer; }
  .gestor-busqueda-item:hover { background: #f0f2f6; }
  .gestor-busqueda-item .sub { font-size: 11px; color: var(--ink-soft); }
  .gestor-busqueda-item-texto { flex: 1 1 auto; min-width: 0; }
  .gestor-busqueda-item mark { background: #ffe9a8; color: inherit; border-radius: 2px; padding: 0 1px; }
  .gestor-busqueda-grupo {
    position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 6px 11px; font-size: 11px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase;
    color: var(--ink-soft); background: #f6f7f9; border-bottom: 1px solid var(--line); border-top: 1px solid var(--line);
  }
  .gestor-busqueda-grupo:first-child { border-top: none; }
  .gestor-busqueda-grupo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gestor-grupo-toggle {
    flex-shrink: 0; border: none; background: none; color: var(--navy); font-weight: 700; font-size: 11px;
    text-transform: none; letter-spacing: 0; cursor: pointer; padding: 2px 4px;
  }
  .gestor-grupo-toggle:hover { text-decoration: underline; }
  .gestor-busqueda-footer { padding: 8px 11px; font-size: 11.5px; color: var(--ink-soft); text-align: center; border-top: 1px solid var(--line); }
  .gestor-busqueda-vacio { padding: 14px 11px; font-size: 13px; color: var(--ink-soft); text-align: center; }
  /* Casilla de selección múltiple (solo se usa en "Cerrar tienda"): un
     cuadrito que se rellena al marcar, para dejar claro que se puede elegir
     más de una tienda sin cerrar el desplegable cada vez. */
  .gestor-check {
    width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid #c7cdd6; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; color: #fff; background: #fff;
  }
  .gestor-busqueda-item.marcada .gestor-check { background: var(--navy); border-color: var(--navy); }
  .gestor-busqueda-item.marcada { background: #f3f5f9; }

  .gestor-seleccion-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .gestor-seleccion-chip {
    display: inline-flex; align-items: center; gap: 6px; background: #eef1f5; border-radius: 20px;
    padding: 5px 10px 5px 12px; font-size: 12.5px; font-weight: 600; color: var(--navy);
  }
  .gestor-seleccion-chip button { background: none; border: none; cursor: pointer; color: var(--ink-soft); font-size: 15px; line-height: 1; padding: 0; }
  .gestor-seleccion-contador { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; margin-bottom: 6px; }
  .gestor-aviso { font-size: 12px; color: var(--ink-soft); background: #f6f7f9; border-radius: 8px; padding: 8px 10px; }

  /* ---------- PERMISOS (admin vs operario con permisos finos) ----------
     A PROPÓSITO al final de la hoja de estilos: en CSS, con la misma
     especificidad, gana la regla que aparece más abajo, y .btn-add-nota /
     .btn-cerrar-tienda / .btn-reabrir ya tienen su propio "display" definido
     más arriba (para su aspecto normal). Puesto aquí + !important, esto
     manda siempre por encima de esas reglas, esté donde esté cada una.

     Oculto por defecto; se muestra cuando <body> tiene la clase "es-admin"
     o la clase "perm-<clave>" del permiso correspondiente (las pone
     aplicarPermisosUI() tras un login correcto, según el rol y los
     permisos que devuelve el backend -- ver CATALOGO_PERMISOS). El usuario
     sin ese permiso sigue viendo el contenido de las notas y los cierres,
     solo no puede crearlos/borrarlos.
     ".nota-chip .del" (borrar una nota o un cierre ya puesto) se muestra
     con cualquiera de los tres, igual que hace eliminar_observacion en el
     backend (verificar_permiso con ['notas','cierres','festivos'], vale
     con tener uno solo). */
  #btn-nota-dia,
  #btn-festivos-anadir,
  .btn-add-nota,
  .nota-chip .del,
  .btn-cerrar-tienda,
  .btn-reabrir,
  .festivos-del {
    display: none !important;
  }
  body.es-admin #btn-nota-dia, body.perm-notas #btn-nota-dia { display: flex !important; }
  body.es-admin #btn-festivos-anadir, body.perm-festivos #btn-festivos-anadir { display: flex !important; }
  body.es-admin .btn-add-nota, body.perm-notas .btn-add-nota { display: flex !important; }
  body.es-admin .nota-chip .del,
  body.perm-notas .nota-chip .del,
  body.perm-cierres .nota-chip .del,
  body.perm-festivos .nota-chip .del { display: inline-block !important; }
  body.es-admin .btn-cerrar-tienda, body.perm-cierres .btn-cerrar-tienda { display: inline-flex !important; }
  body.es-admin .festivos-del, body.perm-festivos .festivos-del { display: inline-flex !important; }
  body.es-admin .btn-reabrir, body.perm-cierres .btn-reabrir { display: inline-block !important; }

  /* ---------- ADMINISTRACIÓN (admin, u operario con algún permiso de ese menú) ----------
     El menú entero se oculta si no queda ninguna sección visible: admin lo
     ve siempre completo (clase "es-admin"); un operario lo ve si tiene
     marcado al menos uno de los permisos de ADMIN_SECCIONES (clase
     "tiene-menu-administracion", la pone aplicarPermisosUI() calculando
     seccionesAdminPermitidas_()). Dentro, poblarDropdownAdministracion()
     ya solo lista las secciones concretas a las que tiene acceso --
     "Servidores" nunca aparece para un operario. */
  #topbar-dropdown-administracion { display: none; }
  body.es-admin #topbar-dropdown-administracion,
  body.tiene-menu-administracion #topbar-dropdown-administracion { display: block; }

  /* ---------- DISEÑO / CONFIGURACIÓN (admin, u operario con algún permiso de ese menú) ----------
     Mismo criterio que Administración, con "tiene-menu-diseno" /
     seccionesConfigPermitidas_() en vez de las de Administración. */
  #topbar-dropdown-configuracion { display: none; }
  body.es-admin #topbar-dropdown-configuracion,
  body.tiene-menu-diseno #topbar-dropdown-configuracion { display: block; }

  .admin-filtros { display: flex; align-items: flex-end; gap: 10px; margin: 14px 0 12px; flex-wrap: wrap; }

  }

  }

  .btn-admin-refrescar {
    display: flex; align-items: center; gap: 6px; background: #eef1f7; border: 1px solid #dde3ee; color: var(--navy);
    border-radius: 8px; padding: 7px 12px; font-size: 12px; font-weight: 700; white-space: nowrap; flex-shrink: 0; height: 32px;
  }

  .btn-admin-buscar {

  table.admin-tabla { width: 100%; border-collapse: collapse; font-size: 12.5px; }

  .permiso-item + .permiso-item { border-top: 1px solid var(--line); }
  .permiso-item input[type="checkbox"] { width: 16px; height: 16px; margin-top: 2px; flex-shrink: 0; }
  .permiso-item-textos { display: flex; flex-direction: column; gap: 1px; }
  .permiso-item-etiqueta { font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer; }
  .permiso-item-desc { font-size: 11.5px; color: var(--ink-soft); }
  .permisos-admin-nota {
    font-size: 12px; color: var(--ink-soft); background: #fafbfc; border: 1px dashed var(--line);
    border-radius: 9px; padding: 10px 12px;
  }

  /* ---------- IMPRESIÓN DEL CONTEO DEL DÍA ----------
   * Ya NO se imprime el contenido de la pantalla (tarjetas, colores,
   * botones…): al pulsar imprimir se construye aparte, desde cero, una
   * hoja de cuadrícula pensada para rellenar a mano en papel (ver
   * construirHojaImpresionDia_() e imprimirConteoDia_()), que es lo único
   * visible mientras se imprime. En pantalla normal este contenedor no se
   * ve nunca. */
  #hoja-impresion-manual { display: none; }
  @media print {
    @page { size: A4 portrait; margin: 9mm; }
    /* El fondo gris de la app (var(--bg), puesto en <body>) se ve por
       detrás de ".hi-pagina" en el hueco vacío que deja al final de cada
       hoja (ocupa los 279mm completos para poder anclar el pie abajo, ver
       .hi-pagina más adelante) -- y si el navegador tiene activado
       "imprimir gráficos de fondo" ese gris sale también en el papel. Se
       fuerza blanco aquí para que ese hueco quede siempre en blanco,
       tanto si el usuario tiene esa opción activada como si no. */
    html, body, #hoja-impresion-manual {
      background: #fff !important;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    /* OJO: visibility:hidden NO quita el espacio que ocupa un elemento en
       la página, solo lo hace invisible -- así que el resto de la app
       (calendario, todas las agrupaciones de la pantalla, etc.) seguía
       "contando" para la paginación aunque no se viera, y salían
       decenas de páginas en blanco. Con display:none sí se quita del
       todo del flujo, así el alto de la página lo marca solo el
       contenido real de la hoja de impresión. */
    #app, #modal-overlay, #toast { display: none !important; }
    #hoja-impresion-manual {
      display: block !important; position: static !important;
      color: #000; font-family: Arial, Helvetica, sans-serif;
    }

    .hi-cabecera {
      border: 1px solid #000; padding: 5px 10px; margin-bottom: 8px;
      display: flex; justify-content: center; gap: 6px; font-size: 12.5px;
    }
    .hi-cabecera b { font-weight: 800; }
    .hi-aviso {
      text-align: center; font-weight: 800; font-size: 11px; text-transform: uppercase;
      margin: 0 0 12px; line-height: 1.5;
    }

    /* Paginación manual (ver paginarYMontarHojaImpresion_ en el JS): cada
       ".hi-pagina" ocupa el alto útil completo de una hoja A4 (297mm menos
       los 2x9mm de margen de @page = 279mm), así el pie de cada una queda
       pegado a su borde inferior real (flex + justify-content:space-between)
       sin necesidad de position:fixed -- que solo repite lo mismo en cada
       hoja, pero no permite saber ni mostrar "página N de X", porque el
       navegador nunca expone cuántas páginas va a imprimir en total. Aquí
       en cambio se calcula de antemano midiendo alturas reales, por eso el
       número total sí puede ser correcto. */
    .hi-pagina {
      display: flex; flex-direction: column; justify-content: space-between;
      min-height: 279mm; background: #fff;
    }
    .hi-pagina-salto { page-break-after: always; break-after: page; }
    .hi-pagina-contenido { flex: 0 0 auto; }
    .hi-pie-pagina {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: end;
      column-gap: 10px; font-size: 9.5px; color: #000;
      padding-top: 3px; border-top: 1px solid #000; margin-top: 10px;
    }
    .hi-pie-titulo { text-align: center; font-weight: 700; text-transform: uppercase; }
    .hi-pie-num { text-align: right; font-weight: 600; white-space: nowrap; }

    /* Cada agrupación (cabecera + tabla + cajas laterales) no debe
       partirse entre páginas; si no cabe entera en lo que queda de
       página, salta entera a la siguiente. Todo el andamiaje de esta hoja
       son <table> anidadas -- a propósito, en vez de flexbox: los
       navegadores paginan de forma mucho más fiable tablas y bloques
       normales que contenedores flex (con flex, break-inside:avoid no se
       respeta de forma consistente al imprimir). */
    .hi-grupo { break-inside: avoid; page-break-inside: avoid; margin-bottom: 14px; }
    .hi-grupo-titulo {
      background: var(--amber); border: 1px solid #000; border-bottom: none;
      font-weight: 800; font-size: 14px; text-transform: uppercase; padding: 5px 10px;
      text-align: center;
    }
    .hi-notas-carga {
      border: 1px solid #000; border-top: none; border-bottom: none; padding: 4px 10px;
      font-size: 10.5px; font-style: italic; text-align: center;
    }
    .hi-notas-carga div + div { margin-top: 2px; }

    /* Todo el bloque (tabla + TOTAL + "quitar en este orden") va dentro de
       UN ÚNICO rectángulo exterior continuo: el borde lo dibuja esta
       tabla contenedora (.hi-layout) en sus 4 lados; las columnas de
       dentro (tabla / total / orden) solo llevan un borde izquierdo, a
       modo de línea divisoria interior, nunca un borde propio por fuera
       -- así no hay piezas sueltas ni bordes que se corten. */
    .hi-layout {
      width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed;
      border: 1px solid #000; break-inside: avoid; page-break-inside: avoid;
    }
    .hi-layout > tbody > tr > td { vertical-align: top; padding: 0; }
    .hi-tabla-cell { width: auto; }
    .hi-total-cell { width: 80px; }
    .hi-orden-cell { width: 130px; }

    /* La tabla interior no dibuja su propio borde exterior (izquierda,
       arriba, abajo) porque ya lo pone el rectángulo de fuera -- solo las
       líneas internas de la cuadrícula (entre filas y columnas). */
    .hi-tabla { width: 100%; border-collapse: collapse; font-size: 10.5px; }
    .hi-tabla th, .hi-tabla td { border: 1px solid #000; padding: 3px 4px; text-align: center; }
    .hi-tabla th { font-size: 9px; font-weight: 800; text-transform: uppercase; background: #f0f0f0; }
    .hi-tabla thead tr:first-child th { border-top: none; }
    .hi-tabla tr td:first-child, .hi-tabla tr th:first-child { border-left: none; }
    .hi-tabla tbody tr:last-child td { border-bottom: none; }
    .hi-tabla td.hi-lim { width: 26px; font-weight: 700; }
    .hi-tabla td.hi-nombre { text-align: left; font-weight: 700; white-space: nowrap; }
    .hi-tabla td.hi-blanco { height: 20px; } /* celda vacía para rellenar a mano */
    .hi-tabla td.hi-no { font-weight: 800; line-height: 1; } /* "NO" de origen: se marca con X en vez de dejarla en blanco, sin agrandar la fila */

    /* Fila de cabecera de una agrupación de rutas (p.ej. "INGENIO + INGENIO
       2"): fondo más marcado, borde superior grueso para que se note dónde
       empieza el bloque. */
    .hi-tabla tr.hi-fila-grupo td {
      background: #e3e6ea; text-align: left; font-style: italic; font-weight: 800;
      font-size: 9.5px; text-transform: uppercase; border-top: 2px solid #000 !important;
    }
    /* Todas las filas de tiendas que pertenecen a esa agrupación (no solo la
       cabecera) llevan el mismo fondo tenue, para que se vea de un vistazo
       qué tiendas están dentro del bloque y cuáles no. */
    .hi-tabla tr.hi-fila-grupo-miembro td { background: #f4f5f7; }
    /* Última fila de la agrupación: borde inferior grueso que cierra el
       bloque, dejando claro que las filas siguientes (sin este fondo) ya
       son tiendas sueltas y no forman parte de esa ruta. */
    .hi-tabla tr.hi-fila-grupo-fin td { border-bottom: 2px solid #000 !important; }

    /* La celda del TOTAL ocupa toda la altura de la agrupación (para que
       la línea divisoria llegue de arriba a abajo), pero el recuadro
       donde se escribe el número va centrado en medio de ese espacio y
       es más grande, no una cajita pequeña pegada arriba. */
    .hi-total-cell { border-left: 1px solid #000; text-align: center; padding: 4px; vertical-align: middle; }
    .hi-total-label { font-weight: 800; font-size: 10px; text-transform: uppercase; margin-bottom: 5px; }
    .hi-total-box { border: 1px solid #000; height: 60px; width: 60px; margin: 0 auto; }

    /* Va dentro del mismo rectángulo exterior que la tabla y el TOTAL
       (border-left hace de línea divisoria), pero sin caja propia
       alrededor del texto: solo texto libre. */
    .hi-orden-cell { border-left: 1px solid #000; padding: 4px 6px; vertical-align: top; }
    .hi-orden-wrap { padding-left: 6px; }
    .hi-orden-label { font-weight: 800; font-size: 8.5px; text-transform: uppercase; margin-bottom: 3px; text-align: center; }
    .hi-orden-tabla { width: 100%; border-collapse: collapse; font-size: 9px; }
    .hi-orden-tabla td { border: none; padding: 1px 0; }
    .hi-orden-tabla td.hi-orden-num { width: 16px; font-weight: 700; }
  }
</style>

<script>
/* ---------------- COMUNICACIÓN CON EL BACKEND (Apps Script como Aplicación Web) ---------------- */
// Esta página ya no se sirve desde Apps Script (ahora vive en GitHub Pages,
// de cara a convertirla en PWA instalable), así que "google.script.run"
// —que solo existe dentro del HtmlService de Apps Script— no está disponible.
// En su lugar se llama al backend por fetch() contra la URL de la
// implementación como "Aplicación web". Para no tener que tocar el resto del
// archivo, se crea aquí una réplica de "google.script.run" con la misma
// forma (withSuccessHandler / withFailureHandler / nombreMetodo(args)).

// 👉 Apunta DIRECTAMENTE a la implementación de Apps Script como
//    "Aplicación web" (ya no hay ningún Worker de Cloudflare por delante:
//    ese proxy se usó en su día para esquivar los 302/CORS erráticos de
//    Apps Script visto desde el navegador, pero ya no está en uso — se ha
//    quitado también toda la lógica de reintentos que asumía su
//    comportamiento, ver llamarApi_ más abajo). Si algún día vuelve a
//    hacer falta un proxy delante de Apps Script, solo hay que tocar esta
//    línea.
// APPS_SCRIPT_URL ELIMINADA: la app ya no llama a Apps Script para nada.
// Lo que aún no está migrado a Supabase avisa con "no configurado aún con
// Supabase" (ver SUPABASE_ACCIONES_ / llamarApi_ más abajo) en vez de
// intentar hablar con el backend antiguo.

// Versión con la que se sirvió ESTE index.html. Se muestra abajo a la
// derecha en el login y en "Inicio", y es la que se compara contra
// version.json para saber si hay una actualización nueva (ver más abajo,
// sección PWA). Súbela a mano cada vez que despliegues, junto con
// version.json y con CACHE_VERSION en service-worker.js (los tres deben
// coincidir).
const APP_VERSION_ACTUAL = '1.7.6';
{
  const badgeLogin = document.getElementById('login-version-badge');
  if (badgeLogin) badgeLogin.textContent = 'v' + APP_VERSION_ACTUAL;
}

const TOKEN_STORAGE_KEY = 'conteos_diarios_token';
// El token de sesión ya NO se guarda en localStorage a propósito: así la PWA
// siempre pide contraseña al abrirse (cada vez que se recarga o se relanza
// la app), aunque dentro de la misma sesión abierta el token siga viviendo
// en memoria para no tener que reintroducir la contraseña en cada llamada.
let SESSION_TOKEN = null;
// Rol de la sesión actual: 'admin' | 'operario' | null (aún sin login). Solo
// el rol "admin" puede crear/borrar notas y cerrar/reabrir tiendas; se
// guarda igual que el token, solo en memoria (no en localStorage).
let SESSION_ROL = null;
// Permisos finos del operario actual (objeto { clave: true, ... }, tal cual
// devuelve login desde usuarios.permisos). Un admin no necesita mirar esto
// -- ver tienePermiso() -- se queda vacío en su caso.
let SESSION_PERMISOS = {};
// Nombre completo de la persona que ha entrado (el que devuelve login desde
// usuarios.nombre_completo), para mostrarlo en la topbar en vez del rol.
let SESSION_NOMBRE = null;
// Nombre de usuario con el que se ha entrado (el que devuelve login), por si
// hace falta mostrarlo o compararlo (p.ej. en la pantalla de Usuarios, para
// no dejar que alguien se desactive/borre a sí mismo). También en memoria.
let SESSION_USUARIO = null;

/* ---------------- SUPABASE ---------------- */
// El login usa esta función RPC (login.sql / ya creada en tu proyecto) en
// vez de Apps Script. El resto de acciones de la app SIGUEN sin migrar:
// llamarApi_ (más abajo) las detecta y avisa con "no configurado aún con
// Supabase" en vez de intentar llamar a Apps Script (que ya no existe en
// este archivo).
//
// El login NO usa Supabase Auth (no hay "usuarios" de verdad): llama a la
// función RPC public.login que ya tenías creada en Supabase, que reproduce
// el mismo esquema que Apps Script -- hashes en config_app
// (app_password_admin_hash / app_password_hash) y token de sesión en la
// tabla sesiones. Por eso solo hace falta la clave "anon" / "publishable",
// nunca la "service_role".
//
// 👉 Rellena estos dos valores con los de tu proyecto (Supabase ->
//    Project Settings -> API -> "Project URL" / "anon public" o
//    "Publishable key").
const SUPABASE_URL = 'https://plqcnqjlxfxjvxyktqbx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_O7FxndlZ08NVAbZeGx6jYw_HKdqLqFr';

const supabaseClient = (window.supabase && SUPABASE_URL.indexOf('TU_SUPABASE_URL') === -1)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;
if (!supabaseClient) {
  console.warn('[Supabase] cliente NO inicializado -- window.supabase =', typeof window.supabase, '(¿ha cargado el <script> del CDN? revisa la pestaña Network). No se intentará el login en paralelo.');
} else {
  console.info('[Supabase] cliente inicializado contra', SUPABASE_URL);
}

/** Llama a la RPC public.login con el usuario y la contraseña tal cual los
 *  ha escrito la persona (la comparación con el hash bcrypt la hace el
 *  propio Postgres). Devuelve { token, rol, usuario, permisos } si son
 *  correctos, null si no lo son, o rechaza la Promise si hay un fallo real
 *  (red, Supabase mal configurado...). */
function loginSupabase_(usuario, pass) {
  if (!supabaseClient) {
    return Promise.reject(new Error('Supabase no está configurado todavía (revisa SUPABASE_URL / SUPABASE_ANON_KEY).'));
  }
  return supabaseClient.rpc('login', { p_usuario: usuario, p_password: pass })
    .then(function (resp) {
      if (resp.error) {
        if (resp.error.message && resp.error.message.indexOf('Usuario o contraseña incorrectos') !== -1) {
          return null; // credenciales mal -- no es un error de servidor
        }
        throw resp.error;
      }
      return resp.data;
    });
}

/* ---------------- INSTALAR APP (PWA) ---------------- */
// Chrome/Edge/Android disparan "beforeinstallprompt" cuando la PWA cumple
// los requisitos (manifest + service worker + HTTPS); lo capturamos aquí
// para poder lanzar el diálogo nativo de instalación nosotros mismos, al

// navegador mete en la barra de direcciones (fácil de no ver). iOS Safari
// no dispara este evento (Apple no lo soporta): ahí se muestran
// instrucciones manuales en su lugar ("Compartir" > "Añadir a inicio").
let INSTALL_PROMPT_EVENT = null;

window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  INSTALL_PROMPT_EVENT = e;
  actualizarBannerInstalacion();

/** true si la app YA se está ejecutando instalada/standalone (abierta
 *  desde el icono, sin barra de navegador): cubre Android/Chrome/Edge
 *  (display-mode: standalone) y iOS Safari (navigator.standalone). */
function appYaInstalada_() {
  if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
  if (window.navigator.standalone === true) return true;
  return false;
}

function esIOS_() {
  return /iphone|ipad|ipod/i.test(window.navigator.userAgent);
}

/** HTML del banner de "Inicio": vacío/oculto si ya está instalada; botón
 *  de instalación nativo si el navegador soporta beforeinstallprompt;
 *  instrucciones manuales en iOS; nada en el resto (navegadores sin
 *  soporte de instalación detectable, p.ej. Firefox). */
function htmlBannerInstalacion_() {
  if (appYaInstalada_()) return '<div id="instalar-banner" style="display:none;"></div>';

  if (INSTALL_PROMPT_EVENT) {
    return (
      '<div class="instalar-banner" id="instalar-banner">' +
        '<img src="icon-192.png" alt="" class="instalar-banner-icon">' +
        '<div class="instalar-banner-texto">' +
          '<strong>Instala la app en tu dispositivo</strong>' +
          '<span>Acceso directo desde tu pantalla de inicio, a pantalla completa.</span>' +
        '</div>' +
        '<button type="button" class="btn-instalar-app" id="btn-instalar-app">Instalar</button>' +
      '</div>'
    );
  }

  if (esIOS_()) {
    return (
      '<div class="instalar-banner" id="instalar-banner">' +
        '<img src="icon-192.png" alt="" class="instalar-banner-icon">' +
        '<div class="instalar-banner-texto">' +
          '<strong>Instala la app en tu iPhone/iPad</strong>' +
          '<span>Toca <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;"><path d="M12 2v13M8 6l4-4 4 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg> (Compartir) y luego "Añadir a pantalla de inicio".</span>' +
        '</div>' +
      '</div>'
    );
  }

  return '<div id="instalar-banner" style="display:none;"></div>';
}

/** Vuelve a pintar el banner si "Inicio" está visible ahora mismo (p.ej.
 *  cuando "beforeinstallprompt" llega DESPUÉS de haber renderizado ya la
 *  vista). Si "Inicio" no está en pantalla, no hace nada. */
function actualizarBannerInstalacion() {
  const cont = document.getElementById('instalar-banner');
  if (!cont) return;
  cont.outerHTML = htmlBannerInstalacion_();
  vincularBotonInstalar_();
}

function vincularBotonInstalar_() {
  const btn = document.getElementById('btn-instalar-app');
  if (!btn) return;
  btn.addEventListener('click', function () {
    if (!INSTALL_PROMPT_EVENT) return;
    INSTALL_PROMPT_EVENT.prompt();
    INSTALL_PROMPT_EVENT.userChoice.finally(function () {
      INSTALL_PROMPT_EVENT = null;
      actualizarBannerInstalacion();
    });
  });
}

/** true si la sesión actual es de administrador. Se usa para mostrar u
 *  ocultar en el momento los controles de notas/observaciones/cierres. */
function esAdmin() { return SESSION_ROL === 'admin'; }

/** true si la sesión actual puede realizar algo protegido por `clave`
 *  (una de las de CATALOGO_PERMISOS). Un admin siempre puede -- igual que
 *  hace verificar_permiso en el backend, que le deja pasar sin mirar la
 *  columna "permisos". Para un operario, mira SESSION_PERMISOS. */
function tienePermiso(clave) {
  if (esAdmin()) return true;
  return !!(SESSION_PERMISOS && SESSION_PERMISOS[clave]);
}

/** Secciones de "Diseño" / "Administración" que la sesión actual puede
 *  ver, en el mismo orden del catálogo. Un admin las ve todas. */
function seccionesConfigPermitidas_() { return CONFIG_SECCIONES.filter(function (s) { return tienePermiso(s.permiso); }); }
function seccionesAdminPermitidas_() { return ADMIN_SECCIONES.filter(function (s) { return s.permiso && tienePermiso(s.permiso); }); }

// Claves de CATALOGO_PERMISOS que se traducen en una clase "perm-<clave>"
// en <body>, para que el CSS pueda mostrar botones sueltos (crear/borrar
// notas, cerrar tienda...) sin tener que tocar JS cada vez. Se recalculan
// aquí en vez de leer CATALOGO_PERMISOS directamente porque ese catálogo
// vive más abajo en el archivo (se define junto al resto de "Usuarios").
const CLAVES_PERMISOS_UI_ = [
  'usuarios', 'notas', 'cierres', 'agencias',
  'tiendas', 'plantilla', 'aviso_tiendas', 'config_hora_aviso_tiendas',
  'festivos', 'palets_forzados', 'cola_emails', 'ver_cuadrante_completo'
];

/** Añade/quita la clase 'es-admin' en <body> (compatibilidad con las
 *  reglas CSS ya existentes) y, para operarios, una clase "perm-<clave>"
 *  por cada permiso fino que tengan marcado -- así el CSS puede mostrar
 *  botones concretos (nota, cerrar tienda...) sin depender de ser admin.
 *  También reconstruye los desplegables de "Diseño" y "Administración"
 *  con solo las secciones a las que la sesión actual tiene acceso, y
 *  reajusta la sección activa si la que había por defecto no es una de
 *  ellas. */
function aplicarPermisosUI() {
  document.body.classList.toggle('es-admin', esAdmin());
  CLAVES_PERMISOS_UI_.forEach(function (clave) {
    document.body.classList.toggle('perm-' + clave, tienePermiso(clave));
  });

  const configPermitidas = seccionesConfigPermitidas_();
  const adminPermitidas = seccionesAdminPermitidas_();
  document.body.classList.toggle('tiene-menu-diseno', configPermitidas.length > 0);
  document.body.classList.toggle('tiene-menu-administracion', adminPermitidas.length > 0);

  if (!configPermitidas.some(function (s) { return s.id === ESTADO_CONFIG.seccionActiva; })) {
    ESTADO_CONFIG.seccionActiva = configPermitidas.length ? configPermitidas[0].id : ESTADO_CONFIG.seccionActiva;
  }
  if (!adminPermitidas.some(function (s) { return s.id === ESTADO_ADMIN.seccionActiva; })) {
    ESTADO_ADMIN.seccionActiva = adminPermitidas.length ? adminPermitidas[0].id : ESTADO_ADMIN.seccionActiva;
  }

  const elRol = document.getElementById('topbar-usuario-rol');
  if (elRol) elRol.textContent = SESSION_ROL ? (SESSION_NOMBRE || (esAdmin() ? 'Administrador' : 'Operario')) : '';
  poblarDropdownConfiguracion();
  poblarDropdownAdministracion();
}

/** Llama a una función RPC de Postgres (Supabase) pasando SIEMPRE el token
 *  de sesión actual como p_token -- mismo patrón que usan las funciones
 *  migradas en el backend (get_conteo_dia, ...), que validan el token
 *  contra la tabla "sesiones" ellas mismas (en vez de depender de
 *  Supabase Auth, que aquí no se usa -- ver loginSupabase_ más arriba).
 *  Si el RPC devuelve el error de sesión caducada, se dispara
 *  volverALogin_() igual que hacía antes sesionCaducada:true en Apps
 *  Script, y además se rechaza la Promise para que el .catch(mostrarErrorServidor)
 *  de turno no muestre un toast duplicado encima del aviso de "vuelve a
 *  entrar". */
function llamarRpcSupabase_(nombreFuncion, argsExtra) {
  if (!supabaseClient) {
    return Promise.reject(new Error('Supabase no está configurado todavía.'));
  }
  const params = Object.assign({ p_token: SESSION_TOKEN }, argsExtra || {});
  return supabaseClient.rpc(nombreFuncion, params).then(function (resp) {
    if (resp.error) {
      if (resp.error.message && resp.error.message.indexOf('Sesión caducada') !== -1) {
        volverALogin_();
        return Promise.reject(new Error('')); // ya se ha avisado con el toast de volverALogin_
      }
      throw resp.error;
    }
    return resp.data;
  });
}

function llamarApi_(accion, args) {
  if (Object.prototype.hasOwnProperty.call(SUPABASE_ACCIONES_, accion)) {
    return Promise.resolve().then(function () { return SUPABASE_ACCIONES_[accion](args || []); });
  }
  return Promise.reject(new Error('"' + accion + '" no configurado aún con Supabase'));
}

/** Cierre de sesión manual (botón "Salir" de la cabecera): a diferencia de
 *  volverALogin_ (que salta cuando el token caduca solo), este es un logout
 *  voluntario, así que no muestra el aviso de "sesión caducada". Pide
 *  confirmación antes de salir, para evitar cierres accidentales. */
function cerrarSesion() {
  if (!window.confirm('¿Seguro que quieres salir?')) return;
  SESSION_TOKEN = null;
  SESSION_ROL = null;
  SESSION_NOMBRE = null;
  SESSION_PERMISOS = {};
  document.body.classList.remove('es-admin', 'tiene-menu-diseno', 'tiene-menu-administracion');
  CLAVES_PERMISOS_UI_.forEach(function (clave) { document.body.classList.remove('perm-' + clave); });
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  const campoUsuario = document.getElementById('login-usuario');
  const campoPass = document.getElementById('login-pass');
  campoUsuario.value = '';
  campoPass.value = '';
  document.getElementById('login-error').style.display = 'none';
  campoUsuario.focus();
}

/** Aviso de confirmación al cerrar la pestaña/navegador (la X) o recargar
 *  la página, para evitar salir sin querer en medio de un conteo. Solo se
 *  activa si ha entrado sesión (no molesta en la pantalla de login). Los
 *  navegadores modernos ignoran el texto y muestran su propio mensaje
 *  genérico ("¿Salir del sitio? Los cambios podrían no guardarse"); por
 *  eso basta con e.preventDefault() + returnValue, no hace falta (ni
 *  sirve) intentar personalizar el texto. */
window.addEventListener('beforeunload', function (e) {
  if (!SESSION_TOKEN) return;
  e.preventDefault();
  e.returnValue = '';
});

    run: {
      withSuccessHandler: function (onSuccess) {
        return {
          withFailureHandler: function (onFailure) {
            const runner = {};
            Object.keys(METODOS_REMOTOS_).forEach(function (nombreLocal) {
              runner[nombreLocal] = function () {
                const args = Array.prototype.slice.call(arguments);
                const accion = METODOS_REMOTOS_[nombreLocal];
                llamarApi_(accion, args)
                  .then(onSuccess)
                  .catch(onFailure);
              };
            });
            return runner;
          }
        };
      }
    }
  }
};

function intentarLogin() {
  const usuario = document.getElementById('login-usuario').value.trim();
  const pass = document.getElementById('login-pass').value;
  const btn = document.getElementById('btn-login');
  const spinner = document.getElementById('login-spinner');
  const btnText = document.getElementById('login-btn-text');

  document.getElementById('login-error').style.display = 'none';
  if (!usuario) { document.getElementById('login-usuario').focus(); return; }
  btn.disabled = true; spinner.style.display = 'inline-block'; btnText.textContent = 'Comprobando…';

  loginSupabase_(usuario, pass)
    .then(function (resultado) {
      btn.disabled = false; spinner.style.display = 'none'; btnText.textContent = 'Entrar';
      if (!resultado) {
        document.getElementById('login-error').style.display = 'block';
        return;
      }
      SESSION_TOKEN = resultado.token;
      SESSION_ROL = resultado.rol;
      SESSION_USUARIO = resultado.usuario;
      SESSION_NOMBRE = resultado.nombre_completo;
      SESSION_PERMISOS = resultado.permisos || {};
      aplicarPermisosUI();
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      ajustarAlturaTopbar_();
      ESTADO.fecha = hoyStr();
      ESTADO.anioMes = anioMesDe(ESTADO.fecha);
      cambiarVista('inicio');
    })
    .catch(function (err) {
      btn.disabled = false; spinner.style.display = 'none'; btnText.textContent = 'Entrar';
      mostrarErrorServidor(err);
    });
}

/* ---------------- FECHAS HELPERS ---------------- */
function hoyStr() {
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function pad2(n) { return String(n).padStart(2, '0'); }
/** "2026-08-10" -> "10-08-2026". Si no viene en ese formato, se devuelve tal cual. */
function fechaDDMMYYYY_(fecha) {
  if (!fecha) return fecha;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(fecha);
  return m ? (m[3] + '-' + m[2] + '-' + m[1]) : fecha;
}
/** Timestamp ISO/con zona ("2026-08-08 17:31:00.013218+00") -> "08-08-2026 17:31",
 *  en la hora local del navegador. Devuelve '' si no hay fecha. */
function fechaHoraDDMMYYYY_(fechaHora) {
  if (!fechaHora) return '';
  const d = new Date(fechaHora);
  if (isNaN(d.getTime())) return fechaHora;
  return pad2(d.getDate()) + '-' + pad2(d.getMonth() + 1) + '-' + d.getFullYear() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function anioMesDe(fecha) { return fecha.slice(0, 7); }

/** Reloj en vivo de la cabecera: "11/08/2026  -  21:42:23h", hora local
 *  del navegador, actualizado cada segundo. */
function actualizarRelojTopbar_() {
  const el = document.getElementById('topbar-reloj');
  if (!el) return;
  const d = new Date();
  const fecha = pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear();
  const hora = pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
  el.textContent = fecha + '  -  ' + hora + 'h';
}
actualizarRelojTopbar_();
setInterval(actualizarRelojTopbar_, 1000);
function formatearFechaLarga(fecha) {
  const d = new Date(fecha + 'T12:00:00');
  return DIAS_SEMANA_ES[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES_ES[d.getMonth()] + ' de ' + d.getFullYear();
}

/* ---------------- GESTIÓN FESTIVOS ----------------
 * Resumen de todas las notas y cierres de tienda guardados (pasados y
 * futuros), construido sin necesitar un endpoint nuevo: se recorre mes a
 * mes con getMesCalendario (que ya trae qué días tienen notas/cierres) y
 * solo se pide el detalle completo (getConteoDia) de los días marcados.
 *
 * Por defecto se muestra 1 mes (navegable con las flechas). Además hay
 * filtros por texto (tienda/agrupación/contenido), por tipo (cierre u
 * observación) y, opcionalmente, un rango de fechas personalizado que
 * sustituye a la navegación mensual mientras esté activo. Los filtros de
 * texto/tipo se aplican en el cliente sobre los datos ya cargados
 * (FESTIVOS_ESTADO.datosCache), sin volver a pedir nada al servidor; solo
 * cambiar de mes o de rango de fechas dispara una nueva carga.
 */
let FESTIVOS_ESTADO = {
  semanaInicio: null,    // 'YYYY-MM-DD' del lunes de la semana mostrada (navegación semanal por defecto)
  idSolicitud: 0,
  datosCache: [],        // conteo completo (getConteoDia) de los días del rango que sí tienen notas/cierres
  diasRango: [],         // TODAS las fechas del rango actual, en orden (aunque no tengan nada guardado)
  filtroTexto: '',
  filtroTipo: 'todos',   // 'todos' | 'cierre' | 'nota'
  filtroDesde: null,     // 'YYYY-MM-DD' -- si desde+hasta están definidos, sustituye la navegación semanal
  filtroHasta: null,
  filtrosAbiertos: false  // si el panel de filtros (oculto tras un icono) está desplegado
};

/** Suma (o resta) días a una fecha 'YYYY-MM-DD' y devuelve otra fecha en el mismo formato. */
function sumarDias_(fecha, delta) {
  const d = new Date(fecha + 'T12:00:00');
  d.setDate(d.getDate() + delta);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

/** Devuelve el lunes ('YYYY-MM-DD') de la semana a la que pertenece la fecha dada. */
function lunesDeSemana_(fecha) {
  const dow = new Date(fecha + 'T12:00:00').getDay(); // 0=domingo..6=sábado
  return sumarDias_(fecha, -((dow + 6) % 7));
}

/** Enumera todas las fechas ('YYYY-MM-DD') entre inicio y fin, ambos incluidos. */
function diasDeRango_(inicio, fin) {
  const out = [];
  let cursor = inicio, guard = 0;
  while (cursor <= fin && guard < 400) { out.push(cursor); cursor = sumarDias_(cursor, 1); guard++; }
  return out;
}

function sumarMeses_(anioMes, delta) {
  const partes = anioMes.split('-').map(Number);
  let anio = partes[0], mes = partes[1] - 1 + delta;
  anio += Math.floor(mes / 12);
  mes = ((mes % 12) + 12) % 12;
  return anio + '-' + pad2(mes + 1);
}

function mesesEnRango_(inicio, fin) {
  const out = [];
  let cursor = inicio, guard = 0;
  while (cursor <= fin && guard < 60) {
    out.push(cursor);
    cursor = sumarMeses_(cursor, 1);
    guard++;
  }
  return out;
}

function formatearFechaCorta_(fecha) {
  const d = new Date(fecha + 'T12:00:00');
  return d.getDate() + ' ' + MESES_ES[d.getMonth()].slice(0, 3) + ' ' + d.getFullYear();
}

function desplazarSemanaFestivos_(delta) {
  if (FESTIVOS_ESTADO.filtroDesde && FESTIVOS_ESTADO.filtroHasta) return; // navegación deshabilitada con rango personalizado
  FESTIVOS_ESTADO.semanaInicio = sumarDias_(FESTIVOS_ESTADO.semanaInicio, delta * 7);
  cargarFestivos();
}

function actualizarFiltroFechas_() {
  const desde = document.getElementById('festivos-desde').value || null;
  const hasta = document.getElementById('festivos-hasta').value || null;
  FESTIVOS_ESTADO.filtroDesde = desde;
  FESTIVOS_ESTADO.filtroHasta = hasta;
  if (desde && hasta) cargarFestivos(); // rango completo: hace falta volver a pedir los meses que cubre
  else aplicarFiltrosFestivos_();       // rango incompleto: no cambia lo que hay que cargar, solo se ignora como filtro
}

function cargarFestivos() {
  if (ESTADO.vista !== 'administracion' || ESTADO_ADMIN.seccionActiva !== 'festivos') return;
  const rangoEl = document.getElementById('festivos-rango');
  const listaEl = document.getElementById('festivos-lista');
  if (!rangoEl || !listaEl) return;

  const rangoPersonalizado = !!(FESTIVOS_ESTADO.filtroDesde && FESTIVOS_ESTADO.filtroHasta);
  const inicio = rangoPersonalizado ? FESTIVOS_ESTADO.filtroDesde : FESTIVOS_ESTADO.semanaInicio;
  const fin = rangoPersonalizado ? FESTIVOS_ESTADO.filtroHasta : sumarDias_(FESTIVOS_ESTADO.semanaInicio, 6);

  rangoEl.textContent = formatearFechaCorta_(inicio) + ' — ' + formatearFechaCorta_(fin);

  ['festivos-prev', 'festivos-next', 'festivos-hoy'].forEach(function (id) {
    const el = document.getElementById(id);
    if (el) el.disabled = rangoPersonalizado;
  });

  const idSolicitud = ++FESTIVOS_ESTADO.idSolicitud;
  listaEl.innerHTML = '<div class="loader">Cargando…</div>';
  const statsElCarga = document.getElementById('festivos-stats');
  if (statsElCarga) statsElCarga.innerHTML = '';

  const meses = mesesEnRango_(anioMesDe(inicio), anioMesDe(fin));

  Promise.all(meses.map(function (m) { return llamarApi_('getMesCalendario', [m]).catch(function () { return []; }); }))
    .then(function (resultadosMeses) {
      // Nos quedamos con la info (fecha, si tiene notas/cierres) de cada día
      // del rango exacto pedido, aunque no tenga nada guardado: así se puede
      // pintar la lista completa día a día (lunes a domingo) más abajo.
      const infoPorFecha = {};
      resultadosMeses.forEach(function (dias) {
        (dias || []).forEach(function (info) { infoPorFecha[info.fecha] = info; });
      });
      const diasRango = diasDeRango_(inicio, fin);
      const fechasConContenido = diasRango.filter(function (fecha) {
        const info = infoPorFecha[fecha];
        return info && (info.tieneNotas || info.tieneCierres || info.tieneExcepciones);
      });
      return Promise.all(fechasConContenido.map(function (fecha) {
        return llamarApi_('getConteoDia', [fecha]).catch(function () { return null; });
      })).then(function (datosDias) { return { diasRango: diasRango, datosDias: datosDias }; });
    })
    .then(function (resultado) {
      if (idSolicitud !== FESTIVOS_ESTADO.idSolicitud) return; // ya no es la petición vigente
      FESTIVOS_ESTADO.diasRango = resultado.diasRango;
      FESTIVOS_ESTADO.datosCache = resultado.datosDias || [];
      aplicarFiltrosFestivos_();
    })
    .catch(function (err) {
      if (idSolicitud !== FESTIVOS_ESTADO.idSolicitud) return;
      listaEl.innerHTML = '<div class="festivos-vacio">No se ha podido cargar la información.</div>';
      mostrarErrorServidor(err);
    });
}

/* Convierte el resultado crudo de getConteoDia en una lista plana de
 * anotaciones individuales {fecha, tag, tipo, texto, id}, sin agrupar
 * todavía: agrupar y filtrar se hace después, en aplicarFiltrosFestivos_,
 * así los filtros de texto/tipo no necesitan volver a tocar el servidor. */
function aplanarDatosFestivos_(datosDias) {
  const lista = [];
  (datosDias || []).forEach(function (data) {
    if (!data) return;
    (data.notasGenerales || []).forEach(function (n) {
      lista.push({ fecha: data.fecha, tag: 'Nota del día', tipo: n.tipo, texto: n.texto, id: n.id });
    });
    (data.secciones || []).forEach(function (seccion) {
      (seccion.notas || []).forEach(function (n) {
        lista.push({ fecha: data.fecha, tag: parsearNombreAgrupacion(seccion.nombre).titulo, tipo: n.tipo, texto: n.texto, id: n.id });
      });
      (seccion.tiendas || []).forEach(function (t) {
        if (t.cerrada) lista.push({ fecha: data.fecha, tag: t.nombre, tipo: 'cierre', texto: t.motivoCierre || 'Tienda cerrada', id: t.cierreId });
      });
      (seccion.excepcionesSalida || []).forEach(function (e) {
        lista.push({ fecha: data.fecha, tag: parsearNombreAgrupacion(seccion.nombre).titulo, tipo: 'cambio', texto: e.texto, id: e.id });
      });
    });
  });
  return lista;
}

function aplicarFiltrosFestivos_() {
  const listaEl = document.getElementById('festivos-lista');
  const statsEl = document.getElementById('festivos-stats');
  if (!listaEl) return;

  let items = aplanarDatosFestivos_(FESTIVOS_ESTADO.datosCache);

  if (FESTIVOS_ESTADO.filtroDesde && FESTIVOS_ESTADO.filtroHasta) {
    items = items.filter(function (it) { return it.fecha >= FESTIVOS_ESTADO.filtroDesde && it.fecha <= FESTIVOS_ESTADO.filtroHasta; });
  }
  if (FESTIVOS_ESTADO.filtroTipo !== 'todos') {
    items = items.filter(function (it) { return it.tipo === FESTIVOS_ESTADO.filtroTipo; });
  }
  if (FESTIVOS_ESTADO.filtroTexto) {
    const q = FESTIVOS_ESTADO.filtroTexto;
    items = items.filter(function (it) {
      return it.tag.toLowerCase().indexOf(q) !== -1 || it.texto.toLowerCase().indexOf(q) !== -1;
    });
  }

  const porFecha = {};
  items.forEach(function (it) { (porFecha[it.fecha] = porFecha[it.fecha] || []).push(it); });

  const hayFiltrosDeContenido = !!FESTIVOS_ESTADO.filtroTexto || FESTIVOS_ESTADO.filtroTipo !== 'todos';
  const hayFiltrosActivos = hayFiltrosDeContenido || !!(FESTIVOS_ESTADO.filtroDesde && FESTIVOS_ESTADO.filtroHasta);
  const badgeEl = document.getElementById('festivos-filtro-badge');
  if (badgeEl) badgeEl.style.display = hayFiltrosActivos ? 'block' : 'none';

  // Con un filtro de texto o tipo activo solo tiene sentido mostrar los días
  // que de verdad tienen algo que coincida. Sin ese filtro (vista normal),
  // se listan TODOS los días del rango, aunque algunos no tengan nada
  // guardado (se marcan como "Sin ninguna anotación").
  const grupos = hayFiltrosDeContenido
    ? Object.keys(porFecha).sort().map(function (fecha) { return { fecha: fecha, items: porFecha[fecha] }; })
    : (FESTIVOS_ESTADO.diasRango || []).map(function (fecha) { return { fecha: fecha, items: porFecha[fecha] || [] }; });

  renderStatsFestivos_(statsEl, grupos);
  renderListaFestivos_(listaEl, grupos, hayFiltrosDeContenido);
  ajustarAlturaListaScrollable_('festivos-lista');
}

function renderStatsFestivos_(statsEl, grupos) {
  if (!statsEl) return;
  let totalCierres = 0, totalNotas = 0, totalCambios = 0, diasConContenido = 0;
  grupos.forEach(function (g) {
    if (g.items.length) diasConContenido++;
    g.items.forEach(function (it) {
      if (it.tipo === 'cierre') totalCierres++;
      else if (it.tipo === 'cambio') totalCambios++;
      else totalNotas++;
    });
  });
  statsEl.innerHTML =

// Quita del caché local (FESTIVOS_ESTADO.datosCache) el elemento con el id
// indicado, sin tocar el servidor: permite repintar al instante tras borrar,
// en vez de tener que volver a pedir todo el rango (con su loader y espera).
function quitarDeCacheFestivos_(id) {
  (FESTIVOS_ESTADO.datosCache || []).forEach(function (data) {
    if (!data) return;
    if (data.notasGenerales) {
      data.notasGenerales = data.notasGenerales.filter(function (n) { return n.id !== id; });
    }
    (data.secciones || []).forEach(function (seccion) {
      if (seccion.notas) {
        seccion.notas = seccion.notas.filter(function (n) { return n.id !== id; });
      }
      (seccion.tiendas || []).forEach(function (t) {
        if (t.cerrada && t.cierreId === id) {
          t.cerrada = false;
          t.motivoCierre = '';
          t.cierreId = null;
        }
        if (t.excepcionId === id) {
          t.entraPorExcepcion = false;
          t.excepcionId = null;
        }
      });
      if (seccion.excepcionesSalida) {
        seccion.excepcionesSalida = seccion.excepcionesSalida.filter(function (e) { return e.id !== id; });
      }
    });
  });
}

function eliminarObservacionDesdeFestivos_(id, tipo) {
  appConfirm(
    'Eliminar registro',
    '¿Seguro que quieres eliminar este registro? Esta acción no se puede deshacer.',
    function () {
      // Guardamos una copia del caché para poder revertir si el servidor falla.
      const copiaCache = JSON.parse(JSON.stringify(FESTIVOS_ESTADO.datosCache || []));
      quitarDeCacheFestivos_(id);
      aplicarFiltrosFestivos_();
      mostrarToast('Eliminado');
      const accion = tipo === 'cambio' ? 'eliminarExcepcionTienda' : 'eliminarObservacion';
      llamarApi_(accion, [id])
        .catch(function (err) {
          FESTIVOS_ESTADO.datosCache = copiaCache;
          aplicarFiltrosFestivos_();
          mostrarErrorServidor(err);
        });
    },
    true
  );
}

 * Lista editable de "Config_Agrupaciones" (nombre de la ruta, notas y
 * emails de la agencia de transporte), para gestionarla desde la propia
 * app en vez de tener que abrir la Google Sheet. Cualquier rol puede
 * consultarla; solo "admin" puede editar, borrar o sincronizar (los
 * campos e iconos correspondientes se muestran/ocultan vía CSS con la
 * clase "es-admin" del <body>, igual que el resto de acciones de solo
 * administrador de la app).
 */
let EMAILS_CONFIG_ESTADO = { datos: [], filtroTexto: '', soloSinUso: false, soloNueva: false, soloSinEmail: false };
/** Nº de tiendas configuradas por agrupación (clave de ruta), calculado a
 *  partir de Config_Tiendas cada vez que se carga "Email agencias". */

// Calcula el alto disponible en pantalla para una lista con scroll propio
// dentro de Configuración o Administración (para que sea ELLA la que se
// desplace, y no toda la página): mide dónde termina la cabecera fija de
// encima y deja un margen para el padding inferior de la tarjeta, en vez
// de usar un número fijo en CSS que no encaja en todas las pantallas.
function ajustarAlturaListaScrollable_(idLista) {
  if (ESTADO.vista !== 'configuracion' && ESTADO.vista !== 'administracion') return;
  const listaEl = document.getElementById(idLista);
  if (!listaEl) return;
  const top = listaEl.getBoundingClientRect().top;
  if (top <= 0) return; // sección no visible ahora mismo
  const disponible = window.innerHeight - top - 50; // 50px = padding inferior de la tarjeta (22) + borde (1) + padding inferior de main (24) + margen
  listaEl.style.maxHeight = Math.max(160, Math.round(disponible)) + 'px';
}
let _timerAjusteAlturasConfig = null;
function ajustarAlturasListasConfig_debounced_() {
  clearTimeout(_timerAjusteAlturasConfig);
  _timerAjusteAlturasConfig = setTimeout(function () {
    ajustarAlturaListaScrollable_('emails-config-lista');
    ajustarAlturaListaScrollable_('festivos-lista');
    ajustarAlturaListaScrollable_('tiendas-config-lista');
    ajustarAlturaListaScrollable_('barrido-resultado');
  }, 120);
}
