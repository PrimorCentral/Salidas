  item.classList.add(claseEstadoMenuRapido_(seccion));
  const dot = item.querySelector('.dot');
  if (dot) dot.title = tituloEstadoMenuRapido_(seccion);
}

function crearNotaChip(n) {
  const div = document.createElement('div');
  div.className = 'nota-chip' + (n.tipo === 'cierre' ? ' tipo-cierre' : '');
  const span = document.createElement('span');
  span.className = 'txt';
  span.textContent = n.texto;
  const del = document.createElement('button');
  del.className = 'del';
  del.type = 'button';
  del.innerHTML = '&times;';
  del.onclick = function () {
    appConfirm('Eliminar nota', '¿Seguro que quieres eliminar esta nota?', function () {
      eliminarObservacionYRecargar(n.id);
    });
  };
  div.appendChild(span);
  div.appendChild(del);
  return div;
}

/**
 * Chip de solo lectura para una nota/instrucción de carga que viene escrita
 * en la propia hoja de Excel de ese día (ej. "1 CAMIÓN 33 P. + ... TODOS LOS
 * LUNES"). No tiene botón de borrar porque no vive en la hoja
 * "Observaciones": para cambiarla hay que editar la celda en la hoja del día.
 */
function crearNotaCargaChip(texto) {
  const div = document.createElement('div');
  div.className = 'nota-carga-chip';
  div.innerHTML =
    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>' +
    '<span>' + escapeHtml(texto) + '</span>';
  return div;
}

/* ---------------- RESUMEN RÁPIDO DEL DÍA (sidebar derecho) ---------------- */

/**
 * Recorre las notas generales del día y, para cada agrupación, sus notas y
 * tiendas cerradas, y construye un resumen agrupado en el panel lateral
 * derecho. Al pulsar sobre un bloque de agrupación, se hace scroll y se
 * expande esa sección en el contenido principal.
 */
function renderResumenDia(data) {
  const body = document.getElementById('resumen-body');
  const countEl = document.getElementById('resumen-count');
  const bloques = [];
  let total = 0;

  if (data.notasGenerales && data.notasGenerales.length) {
    total += data.notasGenerales.length;
    bloques.push({
      titulo: 'Nota general del día',
      key: null,
      items: data.notasGenerales.map(function (n) {
        return { texto: n.texto, tipo: n.tipo, tienda: null };
      })
    });
  }

  (data.secciones || []).forEach(function (seccion) {
    const items = [];
    (seccion.notas || []).forEach(function (n) {
      items.push({ texto: n.texto, tipo: n.tipo, tienda: null });
    });
    seccion.tiendas.forEach(function (t) {
      if (t.cerrada) items.push({ texto: t.motivoCierre || 'Tienda cerrada', tipo: 'cierre', tienda: t.nombre });
    });
    if (items.length) {
      total += items.length;
      bloques.push({
        titulo: parsearNombreAgrupacion(seccion.nombre).titulo,
        key: seccion.nombre,
        items: items
      });
    }
  });

  if (!bloques.length) {
    body.innerHTML = '<div class="resumen-vacio">Sin cierres ni anotaciones para este día.</div>';
    countEl.style.display = 'none';
    return;
  }

  countEl.style.display = 'inline-block';
  countEl.textContent = total;

  body.innerHTML = '';
  bloques.forEach(function (b) {
    const div = document.createElement('div');
    div.className = 'resumen-grupo';
    const itemsHtml = b.items.map(function (it) {
      const clase = it.tipo === 'cierre' ? 'resumen-item cierre' : 'resumen-item';
      const prefijo = it.tienda ? '<span class="tienda">' + escapeHtml(it.tienda) + ':</span> ' : '';
      return '<div class="' + clase + '">' + prefijo + escapeHtml(it.texto) + '</div>';
    }).join('');
    div.innerHTML =
      '<div class="resumen-grupo-titulo"><span>' + escapeHtml(b.titulo) + '</span>' +
      (b.key ? '<span class="ir">Ver &#8599;</span>' : '') + '</div>' +
      itemsHtml;
    if (b.key) {
      div.onclick = function () { irASeccion(b.key); };
    }
    body.appendChild(div);
  });
}

/** Expande y hace scroll hasta la agrupación indicada dentro del contenido principal */
function irASeccion(key) {
  const selector = '.seccion-panel[data-seccion-key="' + cssEscapeAtributo(key) + '"]';
  const panel = document.querySelector(selector);
  if (!panel) return;
  panel.classList.remove('colapsada');
  ESTADO.colapsadas.delete(key);
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  panel.style.transition = 'box-shadow .3s';
  panel.style.boxShadow = '0 0 0 3px rgba(28,43,69,.35)';
  setTimeout(function () { panel.style.boxShadow = ''; }, 1300);
}

function cssEscapeAtributo(s) {
  if (window.CSS && CSS.escape) return CSS.escape(s);
  return String(s).replace(/["\\]/g, '\\$&');
}

/* ---------------- SECCIÓN / AGRUPACIÓN ---------------- */

/**
 * Separa el nombre de la agrupación tal como viene de la hoja
 * (ej. "TXT NORTE (PTA 11:00)") en:
 *   titulo:    "TXT NORTE"
 *   ubicacion: "PTA 11:00"  (lo que va entre paréntesis, o null si no hay)
 */
function parsearNombreAgrupacion(nombre) {
  const m = String(nombre).match(/^(.*?)\s*\(([^)]+)\)\s*$/);
  if (m) return { titulo: m[1].trim(), ubicacion: m[2].trim() };
  return { titulo: String(nombre).trim(), ubicacion: null };
}

/**
 * Muestra el indicador de sincronización durante el autoguardado.
 * Filosofía: silencio cuando todo va bien, solo se ve algo mientras se
 * está guardando (y desaparece solo, sin más aviso).
 *
 * Vive en un único sitio (la barra superior, junto a "Administrador"), no
 * repetido en cada cabecera de agrupación. Como puede haber varias
 * agrupaciones guardando a la vez (el autoguardado de cada una es
 * independiente), se lleva la cuenta con SYNC_GUARDANDO_CONTADOR_: el
 * indicador se mantiene visible mientras el contador sea > 0, y solo se
 * apaga cuando la última agrupación en vuelo termina de guardar.
 */
let SYNC_GUARDANDO_CONTADOR_ = 0;
function marcarGuardando(panel, activo) {
  const ind = document.getElementById('sync-indicator-global');
  if (!ind) return;
  SYNC_GUARDANDO_CONTADOR_ = Math.max(0, SYNC_GUARDANDO_CONTADOR_ + (activo ? 1 : -1));
  if (SYNC_GUARDANDO_CONTADOR_ > 0) {
    ind.classList.add('mostrando');
    ind.innerHTML = '<span class="sync-spinner"></span><span>Guardando…</span>';
  } else {
    ind.classList.remove('mostrando');
    ind.innerHTML = '';
  }
}

/**
 * Texto "hace X" para el aviso de último guardado junto al botón
 * "Guardar conteo" de cada agrupación. Cada agrupación registra aquí su
 * propia función de refresco (ver REFRESCADORES_ULTIMO_GUARDADO_) y un
 * único intervalo global las va llamando a todas cada 20s, para no tener
 * un setInterval por cada agrupación abierta en pantalla.
 */
function formatearTiempoRelativo_(fecha) {
  const segundos = Math.max(0, Math.round((Date.now() - fecha.getTime()) / 1000));
  if (segundos < 10) return 'justo ahora';
  if (segundos < 60) return 'hace ' + segundos + ' s';
  const minutos = Math.round(segundos / 60);
  if (minutos < 60) return 'hace ' + minutos + ' min';
  const horas = Math.round(minutos / 60);
  if (horas < 24) return 'hace ' + horas + ' h';
  return 'hace ' + Math.round(horas / 24) + ' d';
}
let REFRESCADORES_ULTIMO_GUARDADO_ = [];
setInterval(function () {
  // Al re-renderizar (cambio de fecha, recarga de sección…) las agrupaciones
  // viejas se sustituyen en el DOM, pero sus funciones seguirían aquí
  // apuntando a nodos ya desconectados: se limpian solas de paso para que
  // la lista no crezca sin límite en una sesión larga.
  REFRESCADORES_ULTIMO_GUARDADO_ = REFRESCADORES_ULTIMO_GUARDADO_.filter(function (fn) {
    return fn(); // cada función devuelve false si su nodo ya no está en el DOM
  });
}, 20000);

function htmlBotonDeshacerEnvio_() {
  return '<button type="button" class="btn-deshacer-envio" title="Deshacer envío (solo se puede el mismo día)">' +
    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<polyline points="3 6 5 6 21 6"></polyline>' +
    '<path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>' +
    '<path d="M10 11v6"></path><path d="M14 11v6"></path>' +
    '<path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>' +
    '</svg></button>';
}

function crearSeccionPanel(seccion, dia, fecha, esHoy) {
  // El backend calcula seccion.editable teniendo en cuenta la fecha (solo
  // lectura si han pasado más de 2 días) y si ya se envió a la agencia
  // (una vez enviado, ya no se puede modificar). Si por lo que sea no
  // viniera ese campo, se asume editable (compatibilidad hacia atrás).
  let editable = seccion.editable !== false && seccion.estado !== 'enviado';

  const panel = document.createElement('div');
  panel.className = 'seccion-panel estado-' + seccion.estado + (editable ? '' : ' no-editable');
  panel.setAttribute('data-seccion-key', seccion.nombre);
  if (ESTADO.colapsadas.has(seccion.nombre)) panel.classList.add('colapsada');

  const partes = parsearNombreAgrupacion(seccion.nombre);
  const iniciales = partes.titulo.replace(/[^A-ZÁÉÍÓÚÑ ]/gi, '').trim().split(/\s+/).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase() || '·';

  const badgeUbicacion = partes.ubicacion
    ? '<span class="badge-ubicacion">' +
      '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>' +
      escapeHtml(partes.ubicacion) + '</span>'
    : '';

  const header = document.createElement('div');
  header.className = 'seccion-header';
  header.innerHTML =
    '<div class="seccion-header-top">' +
    '<div class="icono-agrup">' + iniciales + '</div>' +
    '<div class="info"><div class="name-row">' +
    '<span class="name">' + escapeHtml(partes.titulo) + '</span>' + badgeUbicacion +
    '<span class="count">' + seccion.tiendas.filter(function (t) { return !t.salePorExcepcion; }).length + ' tienda(s)</span>' +
    badgeEstado(seccion) +
    '</div></div>' +
    '<span class="badge-total-palets"><span class="total-palets-valor">0</span>&nbsp;palets</span>' +
    '<button type="button" class="btn-toggle-colapsar" title="Contraer / expandir">' +
    '<svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>' +
    '</div>' +
    '<div class="seccion-header-meta">' +
    '<div class="seccion-header-badges">' +
    badgePrevision(seccion) +
    (seccion.estado === 'enviado' && esHoy ? htmlBotonDeshacerEnvio_() : '') +
    (!editable && seccion.estado !== 'enviado' ? '<span class="badge badge-solo-lectura">Solo lectura</span>' : '') +
    '</div>' +
    '<div class="seccion-header-acciones">' +
    (editable && seccion.estado !== 'enviado' && !seccion.previsionEnviada
      ? '<button type="button" class="btn-header-prevision" title="Enviar previsión por email (no bloquea el conteo, se puede volver a enviar)">Enviar Previsión</button>'
      : '') +
    (editable && seccion.estado !== 'enviado'
      ? '<button type="button" class="btn-header-definitivo" title="Enviar definitivo por email (bloquea el conteo, lo archiva y vacía las casillas)">Enviar Definitivo</button>'
      : '') +
    '</div>' +
    '<div class="seccion-header-extra">' +
    (editable && seccion.estado !== 'enviado'
      ? '<button type="button" class="btn-header-guardar sin-cambios" title="Guarda el conteo de esta agrupación. Los botones de envío no se activan hasta pulsar aquí.">Guardar conteo</button>' +
        '<span class="ultimo-guardado"></span>'
      : '') +
    '<button type="button" class="btn-add-nota" title="Añadir nota a esta agrupación">' +
    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>' +
    '<button type="button" class="btn-pdf-seccion" title="Generar PDF de esta agrupación">' +
    '<svg width="16" height="18" viewBox="0 0 24 26">' +
    '<path d="M4 2h11l6 6v15a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="#e0342a"/>' +
    '<path d="M15 2v6h6" fill="#ffffff" opacity="0.32"/>' +
    '<text x="12" y="19" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="7.5" font-weight="800" fill="#ffffff">PDF</text>' +
    '</svg></button>' +
    (seccion.tienePdfEspecial
      ? '<button type="button" class="btn-pdf-especial-seccion" title="Generar PDF especial (formato de reparto en camión) de esta agrupación">' +
        '<svg width="16" height="18" viewBox="0 0 24 26">' +
        '<path d="M4 2h11l6 6v15a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="var(--prevision)"/>' +
        '<path d="M15 2v6h6" fill="#ffffff" opacity="0.32"/>' +
        '<text x="12" y="19" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="6" font-weight="800" fill="#ffffff">PDF+</text>' +
        '</svg></button>'
      : '') +
    '</div>' +
    '</div>';
  panel.appendChild(header);

  header.querySelector('.btn-add-nota').onclick = function (e) {
    e.stopPropagation();
    appPrompt('Nota para ' + seccion.nombre, 'Escribe una observación para esta agrupación…', function (texto) {
      guardarObservacionYRecargar({ fecha: fecha, dia: dia, agrupacion: seccion.nombre, tienda: '', tipo: 'nota', texto: texto });
    });
  };
  header.addEventListener('click', function (e) {
    if (!e.target.closest('.btn-toggle-colapsar')) return;
    panel.classList.toggle('colapsada');
    if (panel.classList.contains('colapsada')) ESTADO.colapsadas.add(seccion.nombre);
    else ESTADO.colapsadas.delete(seccion.nombre);
  });

  // Notas/instrucciones de carga escritas en la propia hoja de Excel
  // (ej. "1 CAMIÓN 33 P. + ... TODOS LOS LUNES"). De solo lectura.
  if (seccion.notasCarga && seccion.notasCarga.length) {
    const cargaWrap = document.createElement('div');
    cargaWrap.className = 'seccion-notas-carga';
    seccion.notasCarga.forEach(function (texto) {
      cargaWrap.appendChild(crearNotaCargaChip(texto));
    });
    panel.appendChild(cargaWrap);
  }

  // Observaciones manuales guardadas para esta agrupación (hoja Observaciones), sí se pueden borrar.
  if (seccion.notas && seccion.notas.length) {
    const notasWrap = document.createElement('div');
    notasWrap.className = 'seccion-notas';
    seccion.notas.forEach(function (n) { notasWrap.appendChild(crearNotaChip(n)); });
    panel.appendChild(notasWrap);
  }

  const body = document.createElement('div');
  body.className = 'seccion-body';

  // Columna lateral: solo se muestra si hay una lista de "quitar en este
  // orden" que mostrar; ya no aloja botones (Guardar / Enviar), que ahora
  // viven en la cabecera.
  let acciones = null;
  if (seccion.ordenRetirada && seccion.ordenRetirada.length) {
    acciones = document.createElement('div');
    acciones.className = 'seccion-acciones';
    const ordenWrap = document.createElement('div');
    ordenWrap.className = 'orden-retirada';
    ordenWrap.innerHTML =
      '<div class="orden-retirada-titulo">Quitar en este orden</div>' +
      '<ol>' + seccion.ordenRetirada.map(function (o) { return '<li>' + escapeHtml(quitarCodigoTienda(quitarMarcadorNombre(o))) + '</li>'; }).join('') + '</ol>';
    acciones.appendChild(ordenWrap);
    body.appendChild(acciones);
  }

  const tablaCol = document.createElement('div');
  tablaCol.className = 'seccion-tabla-col';
  const tableWrap = document.createElement('div');
  tableWrap.className = 'table-wrap';
  // Nombres de las tiendas de cada grupo (para mostrarlos juntos una sola
  // vez en la fila-cabecera, en vez de repetir la nota en cada tienda).
  const nombresPorGrupo = {};
  seccion.tiendas.forEach(function (t) {
    if (!t.notaGrupoId) return;
    if (!nombresPorGrupo[t.notaGrupoId]) nombresPorGrupo[t.notaGrupoId] = [];
    nombresPorGrupo[t.notaGrupoId].push(t.nombre);
  });

  const filasHtml = seccion.tiendas.map(function (t, i) {
    const anterior = seccion.tiendas[i - 1];
    const siguiente = seccion.tiendas[i + 1];
    const esPrimeraDeGrupo = !!t.notaGrupoId && (!anterior || anterior.notaGrupoId !== t.notaGrupoId);
    const esUltimaDeGrupo = !!t.notaGrupoId && (!siguiente || siguiente.notaGrupoId !== t.notaGrupoId);
    const headerHtml = esPrimeraDeGrupo ? filaGrupoHeaderHtml(t, nombresPorGrupo[t.notaGrupoId], seccion.tienePeso, seccion.tieneCExpress, seccion.tieneSobrestock) : '';
    return headerHtml + filaHtml(t, esPrimeraDeGrupo, esUltimaDeGrupo, seccion.tienePeso, seccion.tieneCExpress, seccion.tieneSobrestock);
  }).join('');
  tableWrap.innerHTML =
    '<table class="conteo"><thead><tr>' +
    '<th class="th-nombre">Tienda</th><th>Límite</th><th>60</th><th>PTA</th><th>CART.</th><th class="th-total">TOTAL</th><th>PDTE</th>' +
    (seccion.tienePeso ? '<th>PESO</th>' : '') +
    (seccion.tieneCExpress ? '<th>C.EXPRESS</th>' : '') +
    (seccion.tieneSobrestock ? '<th>SOBRESTOCK</th>' : '') +
    '<th></th>' +
    '</tr></thead><tbody>' + filasHtml + '</tbody></table>';
  if (!editable) {
    // Fecha demasiado antigua (2+ días atrás) o ya enviada: se puede
    // consultar, pero no modificar nada de esta agrupación.
    tableWrap.querySelectorAll('input.celda, input.celda-total').forEach(function (input) { input.disabled = true; });
    tableWrap.querySelectorAll('.btn-cerrar-tienda, .btn-reabrir, input.celda-no').forEach(function (btn) { btn.disabled = true; });
  }
  tablaCol.appendChild(tableWrap);
  body.appendChild(tablaCol);

  panel.appendChild(body);

  // Total de palets de la agrupación: suma en vivo del TOTAL de cada tienda
  // (no cuenta las tiendas cerradas, que no tienen input de TOTAL).
  function actualizarTotalPalets() {
    let suma = 0;
    tableWrap.querySelectorAll('input.celda-total').forEach(function (inp) {
      const v = parseFloat(inp.value);
      if (!isNaN(v)) suma += v;
    });
    const el = header.querySelector('.total-palets-valor');
    if (el) el.textContent = suma;
    return suma;
  }
  const sumaInicialPalets = actualizarTotalPalets();

  // GUARDADO MANUAL: ya no se guarda solo mientras se escribe. En su
  // lugar, cualquier cambio en un input marca la agrupación como "con
  // cambios sin guardar" (botón "Guardar conteo" destacado y con pulso).
  // Los botones "Enviar Previsión" / "Enviar Definitivo" se activan si ya
  // hay algún total guardado para esta agrupación (venga de esta sesión o
  // de una anterior: si al recargar la página ya trae datos, no tiene
  // sentido pedir pulsar "Guardar conteo" otra vez solo para desbloquear
  // el envío). Si después se edita algo, se apagan otra vez hasta el
  // siguiente guardado.
  const btnGuardarConteo = header.querySelector('.btn-header-guardar');
  const spanUltimoGuardado = header.querySelector('.ultimo-guardado');
  let hayCambiosSinGuardar = false;
  let haGuardadoAlMenosUnaVez = sumaInicialPalets > 0;
  let ultimoGuardadoEn = null; // Date del último guardado con éxito (esta sesión)
  function refrescarTextoUltimoGuardado_() {
    if (!spanUltimoGuardado || !spanUltimoGuardado.isConnected) return false;
    if (ultimoGuardadoEn) {
      spanUltimoGuardado.textContent = 'Guardado ' + formatearTiempoRelativo_(ultimoGuardadoEn);
      spanUltimoGuardado.title = 'Guardado a las ' + ultimoGuardadoEn.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    }
    return true;
  }
  REFRESCADORES_ULTIMO_GUARDADO_.push(refrescarTextoUltimoGuardado_);
  function actualizarBotonesEnvio_() {
    const bloquear = !haGuardadoAlMenosUnaVez || hayCambiosSinGuardar;
    [header.querySelector('.btn-header-prevision'), header.querySelector('.btn-header-definitivo')].forEach(function (btn) {
      if (!btn) return;
      if (!btn.hasAttribute('data-title-original')) btn.setAttribute('data-title-original', btn.title);
      btn.disabled = bloquear;
      btn.title = bloquear ? 'Pulsa antes "Guardar conteo"' : btn.getAttribute('data-title-original');
    });
  }
  function marcarCambiosSinGuardar_() {
    hayCambiosSinGuardar = true;
    if (btnGuardarConteo) {
      btnGuardarConteo.classList.remove('sin-cambios');
      btnGuardarConteo.classList.add('con-cambios');
      btnGuardarConteo.textContent = 'Guardar conteo';
    }
    actualizarBotonesEnvio_();
  }
  function marcarTodoGuardado_() {
    hayCambiosSinGuardar = false;
    haGuardadoAlMenosUnaVez = true;
    if (btnGuardarConteo) {
      btnGuardarConteo.classList.remove('con-cambios');
      btnGuardarConteo.classList.add('sin-cambios');
      btnGuardarConteo.textContent = 'Guardado';
    }
    actualizarBotonesEnvio_();
  }
  // Se llama solo cuando de verdad ha habido una vuelta al servidor con
  // éxito (no en el caso de "Guardar conteo" pulsado sin cambios), para
  // que el "hace X min" refleje guardados reales.
  function marcarGuardadoAhora_() {
    ultimoGuardadoEn = new Date();
    refrescarTextoUltimoGuardado_();
  }
  // "Guardar conteo" siempre se puede pulsar (mientras sea editable),
  // haya o no cambios: si no hay nada nuevo que guardar, no llama al
  // servidor (evita una petición de red innecesaria), pero igualmente
  // deja constancia de que se ha "confirmado" el guardado en esta
  // sesión, que es lo que activa los botones de envío.
  function autoguardarSeccion(onDone) {
    if (!editable) { if (onDone) onDone(false); return; } // por si acaso: no se guarda nada de una agrupación no editable
    if (!hayCambiosSinGuardar) { marcarTodoGuardado_(); if (onDone) onDone(true); return; }
    const filas = recogerFilas(tableWrap);
    marcarGuardando(panel, true);
    if (btnGuardarConteo) btnGuardarConteo.disabled = true;
    llamarApi_('guardarConteo', [dia, filas, fecha, seccion.nombre])
      .then(function () {
        marcarGuardando(panel, false);
        if (btnGuardarConteo) btnGuardarConteo.disabled = false;
        marcarTodoGuardado_();
        marcarGuardadoAhora_();
        if (onDone) onDone(true);
      })
      .catch(function (err) {
        marcarGuardando(panel, false);
        if (btnGuardarConteo) btnGuardarConteo.disabled = false;
        marcarCambiosSinGuardar_(); // el guardado falló: sigue habiendo cambios sin guardar
        mostrarErrorServidor(err);
        if (onDone) onDone(false);
      });
  }
  if (btnGuardarConteo) {
    btnGuardarConteo.onclick = function (e) {
      e.stopPropagation();
      autoguardarSeccion();
    };
  }

  // GUARDADO AUTOMÁTICO AL PERDER EL FOCO: si el usuario termina de tocar
  // una casilla de esta tabla y el foco se va fuera de ella (a otra
  // agrupación, a un botón, o fuera de la página), se guarda solo, sin
  // esperar a que pulse "Guardar conteo" a mano. Si el foco simplemente
  // salta a otra casilla DENTRO de la misma tabla (lo normal al usar
  // Tab o ir campo a campo), no se hace nada todavía: se espera a que de
  // verdad termine con esta agrupación. El botón sigue ahí como respaldo
  // manual y como indicador visual de si queda algo sin guardar.
  tableWrap.addEventListener('focusout', function () {
    if (!editable) return;
    // No nos fiamos solo de e.relatedTarget (en algunos navegadores llega
    // null al hacer clic fuera de la ventana o en un elemento no
    // enfocable), así que se revisa en el siguiente tick dónde ha
    // quedado realmente el foco.
    setTimeout(function () {
      const focoActual = document.activeElement;
      const siguetocandoEstaTabla = focoActual && tableWrap.contains(focoActual);
      if (siguetocandoEstaTabla) return; // saltó a otra casilla de la misma tabla: no hacer nada aún
      if (!hayCambiosSinGuardar) return; // nada pendiente
      autoguardarSeccion();
    }, 0);
  }, true);

  actualizarBotonesEnvio_(); // estado inicial: envío apagado hasta el primer "Guardar conteo" de esta sesión

  /** Recalcula EN VIVO (sin esperar a guardar ni a recargar) si esta
   *  agrupación "tiene datos" (pendiente -> en progreso), para que el
   *  borde de la cabecera y el punto de "Acceso rápido a agrupación" se
   *  pongan en naranja nada más empezar a escribir, en vez de solo tras
   *  guardar/enviar o recargar la página. Nunca toca una agrupación ya
   *  enviada (candado). */
  function actualizarEstadoLocalSeccion_() {
    if (seccion.estado === 'enviado') return;
    let tieneDatos = false;
    tableWrap.querySelectorAll('table.conteo tbody tr').forEach(function (tr) {
      if (tr.classList.contains('fila-grupo-header') || tr.classList.contains('fila-cerrada') || tr.classList.contains('fila-sale-excepcion')) return;
      tr.querySelectorAll('input.celda').forEach(function (inp) {
        const v = String(inp.value || '').trim();
        if (v !== '' && v.toUpperCase() !== 'NO') tieneDatos = true;
      });
    });
    const nuevoEstado = tieneDatos ? 'progreso' : 'pendiente';
    if (seccion.estado === nuevoEstado) return;
    seccion.estado = nuevoEstado;
    panel.classList.remove('estado-pendiente', 'estado-progreso');
    panel.classList.add('estado-' + nuevoEstado);
    actualizarMenuRapidoItem_(seccion);
  }

  tableWrap.querySelectorAll('table.conteo tbody tr').forEach(function (tr) {
    if (tr.classList.contains('fila-grupo-header')) {
      return; // fila-resumen del grupo: no es una tienda, no lleva inputs
    }
    if (tr.classList.contains('fila-sale-excepcion')) {
      return; // tienda que hoy sale por otra agrupación: solo un td-colspan informativo, sin inputs
    }
    if (tr.classList.contains('fila-cerrada')) {
      const btnReabrir = tr.querySelector('.btn-reabrir');
      if (btnReabrir) {
        btnReabrir.onclick = function () {
          if (!editable) return;
          const cierreId = tr.getAttribute('data-cierre-id');
          appConfirm('Reabrir tienda', '¿Quieres reabrir esta tienda para el conteo de hoy?', function () {
            eliminarObservacionYRecargar(cierreId);
          });
        };
      }
    } else {
      attachCalculoYValidacion(tr);
      attachForzarNo(tr);
      tr.querySelectorAll('input.celda:not(.celda-total):not(.celda-total-visual)').forEach(function (input) {
        input.addEventListener('input', function () {
          marcarCambiosSinGuardar_();
          actualizarTotalPalets();
          actualizarEstadoLocalSeccion_();
        });
      });
      const btnCerrar = tr.querySelector('.btn-cerrar-tienda');
      if (btnCerrar) {
        btnCerrar.onclick = function () {
          if (!editable) return;
          const nombreTienda = tr.getAttribute('data-nombre');
          appPrompt('Cerrar tienda', 'Motivo (ej. "Tienda cerrada, no se da a agencia")…', function (texto) {
            guardarObservacionYRecargar({ fecha: fecha, dia: dia, agrupacion: seccion.nombre, tienda: nombreTienda, tipo: 'cierre', texto: texto });
          });
        };
      }
    }
  });

  attachValidacionGrupos(tableWrap);

  const btnHeaderPrevision = header.querySelector('.btn-header-prevision');
  if (btnHeaderPrevision) {
    btnHeaderPrevision.onclick = function (e) {
      e.stopPropagation();
      mostrarModalEnviarAgencia(calcularResumenEnvio(), function (callback) {
        enviarSeccion('prevision', callback);
      }, 'prevision');
    };
  }

  const btnHeaderDefinitivo = header.querySelector('.btn-header-definitivo');
  if (btnHeaderDefinitivo) {
    btnHeaderDefinitivo.onclick = function (e) {
      e.stopPropagation();
      mostrarModalEnviarAgencia(calcularResumenEnvio(), function (callback) {
        enviarSeccion('definitivo', callback);
      }, 'definitivo');
    };
  }

  // Enlaza el click de "Deshacer envío" sobre el botón que se le pase: sirve
  // tanto para el que ya viniera en el HTML inicial del panel (si la página
  // se carga con la agrupación ya enviada hoy) como para el que se añade
  // dinámicamente justo después de un envío definitivo (ver
  // aplicarResultadoEnvio_ más abajo), sin duplicar esta lógica.
  function bindBotonDeshacerEnvio_(btnDeshacerEnvio) {
    if (!btnDeshacerEnvio) return;
    btnDeshacerEnvio.onclick = function (e) {
      e.stopPropagation();
      appConfirm(
        'Deshacer envío',
        'Vas a deshacer el envío de "' + seccion.nombre + '". Se quitará la marca de enviado y se recuperarán los datos para poder seguir editándolos. Solo puedes hacer esto el mismo día en que se envió. ¿Seguro que quieres continuar?',
        function () {
          btnDeshacerEnvio.disabled = true;
          google.script.run
            .withSuccessHandler(function () {
              btnDeshacerEnvio.disabled = false;
              cargarConteoDia();
              cargarCalendario();
            })
            .withFailureHandler(function (err) {
              btnDeshacerEnvio.disabled = false;
              mostrarErrorServidor(err);
            })
            .deshacerEnvioSeccion(dia, seccion.nombre, fecha);
        },
        true
      );
    };
  }
  bindBotonDeshacerEnvio_(header.querySelector('.btn-deshacer-envio'));

  const btnPdf = header.querySelector('.btn-pdf-seccion');
  if (btnPdf) {
    btnPdf.onclick = function (e) {
      e.stopPropagation();
      generarPdfSeccion(seccion, dia, fecha, tableWrap);
    };
  }

  const btnPdfEspecial = header.querySelector('.btn-pdf-especial-seccion');
  if (btnPdfEspecial) {
    btnPdfEspecial.onclick = function (e) {
      e.stopPropagation();
      generarPdfEspecialSeccion(seccion, dia, fecha, tableWrap);
    };
  }

  /** Recopila, en vivo desde los inputs actuales, los datos para el modal de envío. */
  function calcularResumenEnvio() {
    let totalTiendas = 0;
    let tiendasConDatos = 0;
    const pendientes = [];
    const excedidas = [];
    const pesoFaltante = [];
    tableWrap.querySelectorAll('table.conteo tbody tr').forEach(function (tr) {
      if (tr.classList.contains('fila-grupo-header') || tr.classList.contains('fila-cerrada') || tr.classList.contains('fila-sale-excepcion')) return;
      totalTiendas++;
      const totalInput = tr.querySelector('input[data-campo="total"]');
      const valor = totalInput ? parseFloat(totalInput.value) : NaN;
      if (!isNaN(valor) && valor > 0) tiendasConDatos++;
      else pendientes.push(tr.getAttribute('data-nombre') || '');
      const limite = parseFloat(tr.getAttribute('data-limite'));
      if (!isNaN(valor) && valor > 0 && !isNaN(limite) && limite > 0 && valor > limite) {
        excedidas.push({
          nombre: tr.getAttribute('data-nombre') || '',
          total: valor,
          limite: limite,
          exceso: valor - limite
        });
      }
      if (seccion.tienePeso && !isNaN(valor) && valor > 0) {
        const pesoInput = tr.querySelector('input[data-campo="peso"]');
        const peso = pesoInput ? parseFloat(pesoInput.value) : NaN;
        if (isNaN(peso) || peso <= 0) pesoFaltante.push(tr.getAttribute('data-nombre') || '');
      }
    });
    let totalPalets = 0;
    tableWrap.querySelectorAll('input.celda-total').forEach(function (inp) {
      const v = parseFloat(inp.value);
      if (!isNaN(v)) totalPalets += v;
    });
    return {
      nombre: seccion.nombre,
      fechaTexto: formatearFechaLarga(fecha),
      totalTiendas: totalTiendas,
      tiendasConDatos: tiendasConDatos,
      pendientes: pendientes,
      totalPalets: totalPalets,
      excedidas: excedidas,
      pesoFaltante: pesoFaltante
    };
  }

  function enviarSeccion(tipo, callback) {
    if (!editable) { if (callback) callback(false, 'Esta agrupación ya no se puede modificar.'); return; }
    const btnPrevision = header.querySelector('.btn-header-prevision');
    const btnDefinitivo = header.querySelector('.btn-header-definitivo');
    if (btnPrevision) btnPrevision.disabled = true;
    if (btnDefinitivo) btnDefinitivo.disabled = true;
    const metodo = tipo === 'definitivo' ? 'enviarDefinitivoAgencia' : 'enviarPrevisionAgencia';
    // Guarda inmediatamente (sin esperar el debounce) y, si todo va bien, envía.
    autoguardarSeccion(function (ok) {
      if (!ok) {
        if (btnPrevision) btnPrevision.disabled = false;
        if (btnDefinitivo) btnDefinitivo.disabled = false;
        if (callback) callback(false, 'No se han podido guardar los datos. Inténtalo de nuevo.');
        return;
      }
      google.script.run
        .withSuccessHandler(function (res) {
          if (btnPrevision) btnPrevision.disabled = false;
          if (btnDefinitivo) btnDefinitivo.disabled = false;
          aplicarResultadoEnvio_(tipo, res);
          // El cuadrante (este panel) ya se ha actualizado en vivo, sin
          // recargar nada; solo se refresca el calendario mensual (ligero,
          // sin loader de página) para que la celda del día refleje el
          // nuevo estado (pendiente/parcial/enviado).
          cargarCalendario();
          const mensaje = tipo === 'definitivo' 
          ? 'Definitivo enviado correctamente' 
          : 'Previsión enviada correctamente';

if (callback) callback(true, mensaje);
        })
        .withFailureHandler(function (err) {
          if (btnPrevision) btnPrevision.disabled = false;
          if (btnDefinitivo) btnDefinitivo.disabled = false;
          if (callback) callback(false, (err && err.message) ? err.message : String(err));
        })
        [metodo](dia, seccion.nombre, fecha);
    });
  }

  /**
   * Aplica el resultado de un envío de previsión/definitivo directamente
   * sobre el panel ya pintado en pantalla, sin volver a pedir todo el
   * cuadrante al servidor (mismo espíritu que quitarDeCacheFestivos_ en
   * "Gestión festivos": actualizar en vivo el estado local + el DOM).
   *
   *  - 'prevision': no bloquea nada; solo se añade/actualiza el badge
   *    "Previsión enviada" y se oculta el botón de "Enviar Previsión".
   *  - 'definitivo': la agrupación pasa a "enviado": se bloquean los
   *    inputs de la tabla, se ocultan los botones de envío, se actualiza
   *    el badge de estado y, si es hoy, aparece "Deshacer envío".
   */
  function aplicarResultadoEnvio_(tipo, resultado) {
    if (tipo === 'prevision') {
      seccion.previsionEnviada = (resultado && resultado.previsionEnviada) || seccion.previsionEnviada || '';
      seccion.previsionEnviadaPor = (resultado && resultado.enviadoPor) || seccion.previsionEnviadaPor || '';

      const badgeExistente = header.querySelector('.badge-prevision');
      if (badgeExistente) badgeExistente.remove();
      const wrapTmp = document.createElement('div');
      wrapTmp.innerHTML = badgePrevision(seccion);
      const nuevoBadge = wrapTmp.firstElementChild;
      if (nuevoBadge) {
        const anclaBoton = header.querySelector('.btn-header-prevision, .btn-header-definitivo');
        if (anclaBoton) anclaBoton.insertAdjacentElement('beforebegin', nuevoBadge);
        else header.appendChild(nuevoBadge);
      }

      const btnPrevisionEl = header.querySelector('.btn-header-prevision');
      if (btnPrevisionEl) btnPrevisionEl.remove();
      actualizarMenuRapidoItem_(seccion);
      return;
    }

    // tipo === 'definitivo'
    seccion.estado = 'enviado';
    seccion.horaEnvio = (resultado && resultado.horaEnvio) || seccion.horaEnvio || '';
    seccion.enviadoPor = (resultado && resultado.enviadoPor) || seccion.enviadoPor || '';
    // OJO: seccion.previsionEnviada NO se limpia aquí a propósito: el
    // backend (Estado_Previsiones) tampoco se borra al enviar el
    // definitivo, así que si se había mandado antes una previsión, su
    // badge se sigue viendo junto al de "Definitivo enviado" -- igual que
    // pasaría si recargases la página. Si aquí lo ocultáramos, quedaría
    // una diferencia entre "recién enviado, en esta sesión" y "recargado
    // desde cero", que es justo lo que queremos evitar.
    editable = false;

    panel.classList.remove('estado-pendiente', 'estado-progreso');
    panel.classList.add('estado-enviado', 'no-editable');

    const badgeEstadoExistente = header.querySelector('.badge-enviado, .badge-progreso');
    if (badgeEstadoExistente) badgeEstadoExistente.remove();

    const wrapTmp = document.createElement('div');
    wrapTmp.innerHTML = badgeEstado(seccion);
    const nuevoBadgeEstado = wrapTmp.firstElementChild;
    const countEl = header.querySelector('.name-row .count');
    if (nuevoBadgeEstado && countEl) countEl.insertAdjacentElement('afterend', nuevoBadgeEstado);

    const btnPrevisionEl = header.querySelector('.btn-header-prevision');
    if (btnPrevisionEl) btnPrevisionEl.remove();
    const btnDefinitivoEl = header.querySelector('.btn-header-definitivo');
    if (btnDefinitivoEl) btnDefinitivoEl.remove();

    if (esHoy && !header.querySelector('.btn-deshacer-envio')) {
      const wrapBtn = document.createElement('div');
      wrapBtn.innerHTML = htmlBotonDeshacerEnvio_();
      const nuevoBtn = wrapBtn.firstElementChild;
      const anclaBoton = header.querySelector('.btn-header-prevision, .btn-header-definitivo');
      if (anclaBoton) anclaBoton.insertAdjacentElement('beforebegin', nuevoBtn);
      else header.appendChild(nuevoBtn);
      bindBotonDeshacerEnvio_(nuevoBtn);
    }

    tableWrap.querySelectorAll('input.celda, input.celda-total').forEach(function (input) { input.disabled = true; });
    tableWrap.querySelectorAll('.btn-cerrar-tienda, .btn-reabrir, input.celda-no').forEach(function (btn) { btn.disabled = true; });
    actualizarMenuRapidoItem_(seccion);
  }

  // AUTOREFRESCO EN VIVO (varios ordenadores a la vez): antes de devolver
  // el panel se le cuelgan dos cosas para que refrescarConteoDiaEnVivo_()
  // sepa si puede sustituirlo sin molestar:
  //  - _firma: "foto" de los datos con los que se pintó, para no
  //    reconstruir nada si el próximo sondeo trae exactamente lo mismo.
  //  - _enUso: si hay cambios sin guardar, un guardado en curso, o el
  //    foco está dentro de este panel, se considera que el usuario está
  //    trabajando aquí y el refresco automático no debe tocarlo todavía
  //    (se reintentará en el siguiente sondeo).
  panel._firma = JSON.stringify([seccion, dia, esHoy]);
  panel._enUso = function () {
    // OJO: document.activeElement es por documento, no por ventana. Si el
    // usuario hizo clic en una casilla de esta agrupación y luego cambió de
    // ventana/pestaña SIN volver a tocar nada en esta página, el navegador
    // no dispara "focusout" (el foco no se ha movido a otro elemento del
    // DOM) y esa casilla se queda como activeElement para siempre, aunque
    // la ventana ya no esté activa. Sin el "document.hasFocus() &&" de abajo,
    // eso bloquearía el autorefresco de esta agrupación indefinidamente. Por
    // eso el "cursor puesto en un campo" solo cuenta como "en uso" si la
    // ventana realmente tiene el foco en este instante; los cambios sin
    // guardar o un guardado en curso sí protegen siempre, foco o no.
    return hayCambiosSinGuardar || (btnGuardarConteo && btnGuardarConteo.disabled) || (document.hasFocus() && panel.contains(document.activeElement));
  };

  return panel;
}

/**
 * Genera y descarga un PDF con el conteo completo de una agrupación: todas
 * sus tiendas y casillas (Límite, 60, PTA, CART., TOTAL, PDTE), tal cual
 * están en ese momento en la pantalla (incluye cambios aún sin autoguardar),
 * más las notas de carga, observaciones y el orden de retirada si los hay.
 *
 * Usa jsPDF + el plugin autoTable (cargados por CDN en el <head>). No se
 * usan emojis en el texto para evitar el mismo problema de renderizado que
 * ya se dio en los PDF de incidencias.
 *
 * SIEMPRE UNA SOLA PÁGINA: en vez de usar un A4 apaisado de tamaño fijo (lo
 * que hacía que autoTable repartiera las agrupaciones grandes en varias
 * páginas), primero se "mide" en un lienzo muy alto cuánto ocupa realmente
 * el contenido completo (cabecera + notas + todas las filas) y luego se crea
 * el PDF definitivo con el alto justo para que quepa entero: el ancho de A4
 * apaisado (297mm) siempre, y de alto el estándar de un A4 (210mm) si cabe,
 * o algo más alto si la agrupación es grande — pero nunca una página más.
 */
const PDF_ANCHO_MM_ = 297; // ancho fijo tipo A4 apaisado
const PDF_ALTO_A4_MM_ = 210; // alto estándar de un A4 apaisado

/** Lee de la tabla en pantalla (no de "seccion", para incluir cambios aún
 *  sin guardar) las filas [tienda, límite, 60, PTA, CART., TOTAL, PDTE, (PESO), (C.EXPRESS), (SOBRESTOCK)]. */
function leerFilasPdfSeccion_(tableWrap, seccion) {
  const filas = [];
  tableWrap.querySelectorAll('table.conteo tbody tr').forEach(function (tr) {
    if (tr.classList.contains('fila-grupo-header')) return;

    const nombre = tr.getAttribute('data-nombre') || '';

    if (tr.classList.contains('fila-cerrada')) {
      const limiteCelda = tr.querySelector('td.limite');
      filas.push([
        nombre,
        limiteCelda ? limiteCelda.textContent.trim() : '',
        'CERRADA', '', '', '', ''
      ].concat(seccion.tienePeso ? [''] : []).concat(seccion.tieneCExpress ? [''] : []).concat(seccion.tieneSobrestock ? [''] : []));
      return;
    }

    if (tr.classList.contains('fila-sale-excepcion')) {
      const limiteCelda = tr.querySelector('td.limite');
      const motivo = tr.querySelector('.motivo-excepcion');
      filas.push([
        nombre,
        limiteCelda ? limiteCelda.textContent.trim() : '',
        motivo ? motivo.textContent.trim() : 'SALE POR EXCEPCIÓN', '', '', '', ''
      ].concat(seccion.tienePeso ? [''] : []).concat(seccion.tieneCExpress ? [''] : []).concat(seccion.tieneSobrestock ? [''] : []));
      return;
    }

    function valorCampo(campo) {
      const inp = tr.querySelector('input[data-campo="' + campo + '"]');
      return inp ? inp.value : '';
    }

    filas.push([
      nombre,
      tr.getAttribute('data-limite') || '',
      valorCampo('c60'),
      valorCampo('pta'),
      valorCampo('cart'),
      valorCampo('total'),
      valorCampo('pdte')
    ].concat(seccion.tienePeso ? [valorCampo('peso')] : []).concat(seccion.tieneCExpress ? [valorCampo('cexpress')] : []).concat(seccion.tieneSobrestock ? [valorCampo('sobrestock')] : []));
  });
  return filas;
}

/** Crea un doc de jsPDF con el ancho/alto exactos pedidos (en mm), eligiendo
 *  la orientación ('p' o 'l') que ya cumple esa forma, para que jsPDF no
 *  intercambie ancho y alto por su cuenta (lo hace si, p.ej., pides
 *  orientación "landscape" pero el alto que le das es mayor que el ancho). */
function crearDocPdfPaginaExacta_(jsPDF, anchoMM, altoMM) {
  const orientacion = altoMM > anchoMM ? 'p' : 'l';
  return new jsPDF({ unit: 'mm', format: [anchoMM, altoMM], orientation: orientacion });
}

/** Dibuja la cabecera, las notas y la tabla completa de la agrupación en el
 *  doc dado (empezando siempre en la misma posición) y devuelve la
 *  coordenada Y justo debajo de la tabla, para poder saber cuánto ocupa. */
function dibujarPdfSeccion_(doc, partes, dia, fecha, fechaGeneracion, seccion, filas) {
  doc.setFontSize(8);
  doc.setTextColor(140, 148, 158);
  doc.text('Generado el ' + fechaGeneracion, 14, 10);
  doc.setTextColor(0, 0, 0);

  doc.setFontSize(15);
  doc.setTextColor(28, 43, 69);
  doc.text(partes.titulo + (partes.ubicacion ? ' · ' + partes.ubicacion : ''), 14, 18);

  doc.setFontSize(10);
  doc.setTextColor(90, 100, 114);
  doc.text((dia || '') + ' · ' + formatearFechaLarga(fecha), 14, 24);
  doc.setTextColor(0, 0, 0);

  let y = 31;

  if (seccion.notasCarga && seccion.notasCarga.length) {
    doc.setFontSize(9);
    seccion.notasCarga.forEach(function (texto) {
      doc.text('• ' + texto, 14, y);
      y += 5;
    });
    y += 2;
  }

  if (seccion.notas && seccion.notas.length) {
    doc.setFontSize(9);
    seccion.notas.forEach(function (n) {
      doc.text('Nota: ' + n.texto, 14, y);
      y += 5;
    });
    y += 2;
  }

  // Fila final de TOTAL GENERAL: suma del TOTAL de todas las tiendas no
  // cerradas (misma lógica que el total que se ve en el chip de cabecera
  // de la agrupación en pantalla). El resto de columnas de esa fila se
  // dejan en blanco salvo "Tienda", donde va la etiqueta.
  const totalGeneral = filas.reduce(function (acc, fila) {
    const v = parseFloat(fila[5]); // índice 5 = TOTAL
    return acc + (isNaN(v) ? 0 : v);
  }, 0);
  const filaTotal = ['TOTAL GENERAL', '', '', '', '', String(totalGeneral), '']
    .concat(seccion.tienePeso ? [''] : [])
    .concat(seccion.tieneCExpress ? [''] : [])
    .concat(seccion.tieneSobrestock ? [''] : []);
  const filasConTotal = filas.concat([filaTotal]);
  const indiceFilaTotal = filasConTotal.length - 1;

  doc.autoTable({
    startY: y,
    head: [['Tienda', 'Límite', '60', 'PTA', 'CART.', 'TOTAL', 'PDTE'].concat(seccion.tienePeso ? ['PESO'] : []).concat(seccion.tieneCExpress ? ['C.EXPRESS'] : []).concat(seccion.tieneSobrestock ? ['SOBRESTOCK'] : [])],
    body: filasConTotal,
    styles: { fontSize: 9, cellPadding: 2.5, valign: 'middle', halign: 'center' },
    headStyles: { fillColor: [28, 43, 69], textColor: 255, halign: 'center' },
    bodyStyles: { halign: 'center' },
    columnStyles: {
      0: { fontStyle: 'bold', fontSize: 11, halign: 'left' },
      5: { fontStyle: 'bold' }
    },
    // La fila de TOTAL GENERAL se pinta con un fondo distinto y en negrita,
    // igual que una fila de cierre en una tabla contable.
    didParseCell: function (data) {
      if (data.section === 'body' && data.row.index === indiceFilaTotal) {
        data.cell.styles.fillColor = [242, 245, 249];
        data.cell.styles.fontStyle = 'bold';
        data.cell.styles.lineWidth = { top: 0.4 };
      }
    },
    // Margen inferior reducido y a propósito pequeño: la página final se
    // dimensiona para que quepa justo, así que no hace falta el hueco de
    // 20mm que deja autoTable por defecto (y que forzaría un salto de
    // página con el alto ajustado que calculamos más abajo).
    margin: { bottom: 10 },
    // Por si acaso: nunca partir una fila entre dos páginas.
    rowPageBreak: 'avoid'
  });

  return doc.lastAutoTable.finalY;
}

function generarPdfSeccion(seccion, dia, fecha, tableWrap) {
  if (!window.jspdf || !window.jspdf.jsPDF) {
    mostrarToast('No se ha podido cargar el generador de PDF. Revisa tu conexión e inténtalo de nuevo.', true);
    return;
  }

  const jsPDF = window.jspdf.jsPDF;
  const partes = parsearNombreAgrupacion(seccion.nombre);

  // Fecha/hora de generación del PDF (no la fecha del conteo), arriba del todo.
  const ahora = new Date();
  const fechaGeneracion = Utilities_formatearFechaHora_(ahora);

  const filas = leerFilasPdfSeccion_(tableWrap, seccion);

  // 1ª pasada (de medición, se descarta): se dibuja todo en un lienzo muy
  // alto (2000mm) para que la tabla nunca necesite paginarse, y así saber
  // cuánto ocupa el contenido real completo, sea cual sea el tamaño de la
  // agrupación.
  const docMedida = crearDocPdfPaginaExacta_(jsPDF, PDF_ANCHO_MM_, 2000);
  const alturaContenido = dibujarPdfSeccion_(docMedida, partes, dia, fecha, fechaGeneracion, seccion, filas);

  // 2ª pasada (definitiva): si con el alto estándar de un A4 apaisado
  // (210mm) ya cabe todo, se usa ese tamaño normal de siempre; si la
  // agrupación es más grande, se alarga la página lo justo para que quepa
  // entera en UNA sola hoja (nunca se generan páginas adicionales).
  const alturaPagina = Math.max(PDF_ALTO_A4_MM_, alturaContenido + 14);
  const doc = crearDocPdfPaginaExacta_(jsPDF, PDF_ANCHO_MM_, alturaPagina);
  dibujarPdfSeccion_(doc, partes, dia, fecha, fechaGeneracion, seccion, filas);

  const nombreArchivo = 'Conteo_' + seccion.nombre.replace(/[^a-z0-9áéíóúñ]+/gi, '_') + '_' + fecha + '.pdf';
  doc.save(nombreArchivo);
}

/**
 * PDF ESPECIAL: mismo formato que la plantilla Excel de reparto en camión
 * (columnas LÍMITE CAMIÓN / AGENCIA / LÍMITE / TIENDA / NAVE 60 / PTA /
 * CÁRTAMA / TOTAL / SOBRAN / TOTAL RUTA / FIRMA RES. TARDE / FIRMA RES.
 * NOCHE / CONFIRMACIÓN RECOGIDA / ZONA-PASILLO), pensado para imprimir y
 * rellenar a mano en el momento del reparto.
 *
 * Igual que en pantalla, las tiendas que comparten camión/ruta (la misma
 * anotación "8P MAX. POR RUTA" de las columnas K:L del Excel — en la app,
 * mismo "data-nota-grupo") se agrupan visualmente: LÍMITE CAMIÓN, AGENCIA,
 * SOBRAN, TOTAL RUTA y los campos de firma se pintan en UNA sola celda que
 * abarca todas las filas de esa ruta (como una celda combinada), en vez de
 * repetirse en cada tienda. Una tienda sin ruta compartida forma su propio
 * grupo de una sola fila.
 *
 * - LÍMITE CAMIÓN sale del número de la anotación de ruta compartida por
 *   varias tiendas (ej. "8P MAX. POR RUTA" -> 8). Si la tienda no comparte
 *   ruta con nadie, o la anotación no tiene un número reconocible (p.ej.
 *   "SIN LÍMITE..."), queda en blanco: no es el límite de una tienda
 *   suelta, es el del camión.
 * - AGENCIA es el nombre de la agrupación (ej. "SEYLOTRANS MEDIO DIA").
 * - TOTAL RUTA es la suma en vivo del TOTAL de todas las tiendas de esa
 *   ruta (misma suma que ya se ve en pantalla en el chip de la
 *   fila-cabecera del grupo).
 * - SOBRAN queda SIEMPRE en blanco: es un dato que se anota a mano en el
 *   momento del reparto, no se calcula.
 * - LÍMITE, TIENDA, 60, PTA, CART. y TOTAL de cada fila salen de los
 *   datos ya introducidos en el conteo (igual que el PDF normal).
 * - Las 3 firmas y ZONA/PASILLO siguen en blanco para rellenar a mano,
 *   como se pidió: no hay ningún dato de la app del que puedan salir.
 */
function leerFilasPdfEspecialSeccion_(tableWrap, agenciaNombre) {
  // 1) Se recorren las filas de la tabla en pantalla y se agrupan por
  // "data-nota-grupo" (mismas tiendas que comparten ruta/camión). Una fila
  // sin ese atributo forma un grupo de 1 sola tienda.
  const grupos = [];
  let grupoActualId = null;
  let grupoActual = null;

  tableWrap.querySelectorAll('table.conteo tbody tr').forEach(function (tr) {
    if (tr.classList.contains('fila-grupo-header')) return;
    const id = tr.getAttribute('data-nota-grupo'); // null si no comparte ruta con nadie

    if (id && id === grupoActualId) {
      grupoActual.filas.push(tr);
      return;
    }
    const limiteStr = tr.getAttribute('data-nota-limite');
    grupoActual = {
      limiteCamion: id && limiteStr ? Number(limiteStr) : null,
      esGrupoInformativo: tr.getAttribute('data-nota-grupo-tipo') === 'total',
      filas: [tr]
    };
    grupos.push(grupoActual);
    grupoActualId = id || null;
  });

  // 2) Cada grupo se convierte en sus filas de tabla del PDF: la primera
  // fila lleva las celdas "de ruta" (LÍMITE CAMIÓN, AGENCIA, SOBRAN, TOTAL
  // RUTA, firmas, ZONA/PASILLO) con rowSpan = nº de tiendas del grupo; las
  // siguientes filas del mismo grupo NO repiten esas columnas (quedan
  // cubiertas por la celda combinada de la primera).
  const filasPdf = [];
  const grupoPorFilaPdf = []; // índice de grupo por cada fila añadida, para sombrear por ruta al dibujar

  grupos.forEach(function (grupo, indiceGrupo) {
    let sumaTotal = 0;
    grupo.filas.forEach(function (tr) {
      const totalInput = tr.querySelector('input[data-campo="total"]');
      const v = totalInput ? parseFloat(totalInput.value) : NaN;
      if (!isNaN(v)) sumaTotal += v;
    });

    // LÍMITE CAMIÓN solo se rellena cuando de verdad hay una nota de ruta
    // compartida por varias tiendas (ej. "8P MAX. POR RUTA"): es el límite
    // del CAMIÓN, no el de una tienda suelta, así que una tienda sin ruta
    // compartida se deja en blanco (antes se rellenaba con su propio
    // límite de tienda por error). Si no hay ningún número (ruta sin
    // límite, o nota tipo "SIN LÍMITE..."), se escribe "SIN LÍMITE" en vez
    // de dejarlo vacío. SOBRAN se deja SIEMPRE en blanco: es un dato que
    // se anota a mano en el reparto, no se calcula.
    const limiteCamion = grupo.limiteCamion;
    const limiteCamionTexto = limiteCamion == null ? 'SIN LÍMITE' : String(limiteCamion);
    const sobran = '';
    const totalRuta = grupo.esGrupoInformativo ? '' : sumaTotal;

    grupo.filas.forEach(function (tr, i) {
      const esPrimera = i === 0;
      const rowSpan = grupo.filas.length;
      const nombre = tr.getAttribute('data-nombre') || '';

      function celdaGrupo(valor) {
        return esPrimera ? { content: valor === '' || valor == null ? '' : String(valor), rowSpan: rowSpan } : null;
      }

      let celdasPropias;
      if (tr.classList.contains('fila-cerrada')) {
        const limiteCelda = tr.querySelector('td.limite');
        celdasPropias = [
          limiteCelda ? limiteCelda.textContent.trim() : '', nombre,
          { content: 'CERRADA', colSpan: 4, styles: { fontStyle: 'bold', textColor: [201, 79, 79] } }
        ];
      } else if (tr.classList.contains('fila-sale-excepcion')) {
        const limiteCelda = tr.querySelector('td.limite');
        const motivo = tr.querySelector('.motivo-excepcion');
        celdasPropias = [
          limiteCelda ? limiteCelda.textContent.trim() : '', nombre,
          { content: motivo ? motivo.textContent.trim() : 'SALE POR EXCEPCIÓN', colSpan: 4, styles: { fontStyle: 'bold', textColor: [31, 78, 140] } }
        ];
      } else {
        function valorCampo(campo) {
          const inp = tr.querySelector('input[data-campo="' + campo + '"]');
          return inp ? inp.value : '';
        }
        celdasPropias = [
          tr.getAttribute('data-limite') || '', nombre,
          valorCampo('c60'), valorCampo('pta'), valorCampo('cart'), valorCampo('total')
        ];
      }

      const fila = [];
      if (esPrimera) {
        fila.push(celdaGrupo(limiteCamionTexto));
        fila.push(celdaGrupo(agenciaNombre));
      }
      fila.push.apply(fila, celdasPropias);
      if (esPrimera) {
        fila.push(celdaGrupo(sobran));
        fila.push(celdaGrupo(totalRuta));
        fila.push(celdaGrupo('')); // FIRMA RES. TARDE
        fila.push(celdaGrupo('')); // FIRMA RES. NOCHE
        fila.push(celdaGrupo('')); // CONFIRMACIÓN RECOGIDA
        fila.push(celdaGrupo('')); // ZONA/PASILLO
      }

      filasPdf.push(fila);
      grupoPorFilaPdf.push(indiceGrupo);
    });
  });

  return { filas: filasPdf, grupoPorFila: grupoPorFilaPdf };
}

function dibujarPdfEspecialSeccion_(doc, partes, dia, fecha, fechaGeneracion, seccion, filasInfo) {
  doc.setFontSize(8);
  doc.setTextColor(140, 148, 158);
  doc.text('Generado el ' + fechaGeneracion, 14, 10);
  doc.setTextColor(0, 0, 0);

  doc.setFontSize(15);
  doc.setTextColor(28, 43, 69);
  doc.text(partes.titulo + (partes.ubicacion ? ' · ' + partes.ubicacion : ''), 14, 18);

  doc.setFontSize(10);
  doc.setTextColor(90, 100, 114);
  doc.text((dia || '') + ' · ' + formatearFechaLarga(fecha), 14, 24);
  doc.setTextColor(0, 0, 0);

  const grupoPorFila = filasInfo.grupoPorFila;

  doc.autoTable({
    startY: 31,
    theme: 'plain',
    head: [['LÍMITE\nCAMIÓN', 'AGENCIA', 'LÍMITE', 'TIENDA', '60', 'PTA', 'CART.', 'TOTAL', 'SOBRAN', 'TOTAL\nRUTA', 'FIRMA RES.\nTARDE', 'FIRMA RES.\nNOCHE', 'CONFIRMACIÓN\nRECOGIDA', 'ZONA/\nPASILLO']],
    body: filasInfo.filas,
    styles: { fontSize: 7.5, cellPadding: 2.5, valign: 'middle', halign: 'center', lineColor: [190, 196, 205], lineWidth: 0.15, fillColor: [255, 255, 255] },
    headStyles: { fillColor: [28, 43, 69], textColor: 255, halign: 'center', fontSize: 7 },
    bodyStyles: { halign: 'center', minCellHeight: 9 },
    columnStyles: {
      1: { fontStyle: 'bold' },
      3: { fontStyle: 'bold', fontSize: 9, halign: 'left' },
      7: { fontStyle: 'bold' },
      13: { cellWidth: 30 }
    },
    // Sombreado suave alternado POR RUTA (no por fila): todas las filas del
    // mismo grupo comparten color, para que se aprecien de un vistazo los
    // bloques de reparto por camión, igual que las celdas combinadas del
    // Excel original. Con "theme: 'plain'" se desactiva el rayado propio
    // de la librería (que alterna por FILA, no por ruta, y pisaba este
    // color de forma inconsistente dentro de un mismo grupo).
    didParseCell: function (data) {
      if (data.section !== 'body') return;
      const grupo = grupoPorFila[data.row.index];
      if (grupo % 2 === 1) data.cell.styles.fillColor = [242, 245, 249];
    },
    margin: { bottom: 10 },
    rowPageBreak: 'avoid'
  });

  return doc.lastAutoTable.finalY;
}

function generarPdfEspecialSeccion(seccion, dia, fecha, tableWrap) {
  if (!window.jspdf || !window.jspdf.jsPDF) {
    mostrarToast('No se ha podido cargar el generador de PDF. Revisa tu conexión e inténtalo de nuevo.', true);
    return;
  }

  const jsPDF = window.jspdf.jsPDF;
  const partes = parsearNombreAgrupacion(seccion.nombre);
  const ahora = new Date();
  const fechaGeneracion = Utilities_formatearFechaHora_(ahora);
  const filasInfo = leerFilasPdfEspecialSeccion_(tableWrap, partes.titulo);

  const docMedida = crearDocPdfPaginaExacta_(jsPDF, PDF_ANCHO_MM_, 2000);
  const alturaContenido = dibujarPdfEspecialSeccion_(docMedida, partes, dia, fecha, fechaGeneracion, seccion, filasInfo);

  const alturaPagina = Math.max(PDF_ALTO_A4_MM_, alturaContenido + 14);
  const doc = crearDocPdfPaginaExacta_(jsPDF, PDF_ANCHO_MM_, alturaPagina);
  dibujarPdfEspecialSeccion_(doc, partes, dia, fecha, fechaGeneracion, seccion, filasInfo);

  const nombreArchivo = 'Especial_' + seccion.nombre.replace(/[^a-z0-9áéíóúñ]+/gi, '_') + '_' + fecha + '.pdf';
  doc.save(nombreArchivo);
}

/** 'lunes, 19 de julio de 2026, 14:32' — usada solo como marca de tiempo de
 *  generación del PDF; no confundir con formatearFechaLarga(), que formatea
 *  la fecha del CONTEO (que puede ser distinta a hoy si se abre un día pasado). */
function Utilities_formatearFechaHora_(d) {
  const dd = pad2(d.getDate());
  const mm = MESES_ES[d.getMonth()];
  const yyyy = d.getFullYear();
  const hh = pad2(d.getHours());
  const min = pad2(d.getMinutes());
  return dd + ' de ' + mm + ' de ' + yyyy + ', ' + hh + ':' + min;
}

function badgeEstado(seccion) {
  if (seccion.estado === 'enviado') {
    const texto = seccion.enviadoPor ? ('Definitivo enviado por: ' + escapeHtml(seccion.enviadoPor)) : 'Definitivo enviado';
    const tooltip = seccion.horaEnvio ? ' title="' + escapeAttr(seccion.horaEnvio) + '"' : '';
    return '<span class="badge badge-enviado"' + tooltip + '><span class="badge-dot"></span>' + texto + '</span>';
  }
  if (seccion.estado === 'progreso') return '<span class="badge badge-progreso"><span class="badge-dot"></span>En progreso</span>';
  return ''; // ya no se muestra el badge "Pendiente" en la cabecera de la agrupación
}

/** Badge independiente para la previsión: a diferencia del estado principal
 *  (que solo refleja el envío DEFINITIVO), esto avisa de que ya se ha
 *  mandado una previsión, sin bloquear nada ni sustituir al badge de
 *  estado — ambos pueden verse a la vez. */
function badgePrevision(seccion) {
  if (!seccion.previsionEnviada) return '';
  const texto = seccion.previsionEnviadaPor ? ('Previsión enviada por: ' + escapeHtml(seccion.previsionEnviadaPor)) : 'Previsión enviada';
  const tooltip = ' title="' + escapeAttr(seccion.previsionEnviada) + '"';
  return '<span class="badge badge-prevision"' + tooltip + '><span class="badge-dot"></span>' + texto + '</span>';
}

/**
 * Fila-cabecera de un grupo de rutas: aparece UNA sola vez, justo encima de
 * la primera tienda del grupo. Dos variantes, según t.notaGrupoTipo:
 *
 *  - Ruta normal (tipo null, ej. "8P MAX. POR RUTA"): a la izquierda los
 *    nombres de las tiendas que comparten esa ruta, a la derecha el chip
 *    con el contador en vivo "texto — x/8" (comportamiento de siempre).
 *  - Total informativo (tipo 'total', ej. "TOTAL LISBOA"): a la izquierda
 *    se muestra la descripción tal cual la escribiste en el Excel (no la
 *    lista de tiendas), y a la derecha el chip con la suma de palets en
 *    vivo de esa agrupación, sin ningún aviso/alerta de límite (es solo
 *    información visual).
 */
function filaGrupoHeaderHtml(t, nombresGrupo, tienePeso, tieneCExpress, tieneSobrestock) {
  const esTotal = t.notaGrupoTipo === 'total';
  const tiendas = (nombresGrupo || []).map(quitarCodigoTienda).join(' + ');
  const textoIzquierda = esTotal ? t.nota : tiendas;
  const chipInicial = esTotal ? '0 palets' : t.nota;
  return '<tr class="fila-grupo-header' + (esTotal ? ' fila-grupo-header-total' : '') + '" data-nota-grupo-header="' + escapeAttr(t.notaGrupoId) + '" data-nota-grupo-tipo="' + escapeAttr(t.notaGrupoTipo || '') + '">' +
    '<td colspan="' + (8 + (tienePeso ? 1 : 0) + (tieneCExpress ? 1 : 0) + (tieneSobrestock ? 1 : 0)) + '">' +
    '<div class="grupo-header">' +
    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>' +
    '<span class="grupo-header-tiendas">' + escapeHtml(textoIzquierda) + '</span>' +
    '<span class="grupo-header-chip' + (esTotal ? ' grupo-header-chip-total' : '') + '" data-nota-base="' + escapeAttr(t.nota) + '">' + escapeHtml(chipInicial) + '</span>' +
    '</div></td></tr>';
}

/** "127- NERVIÓN" -> "NERVIÓN" (quita el código numérico de tienda, solo para el
 *  texto de la fila-cabecera del grupo; el nombre completo se sigue mostrando
 *  tal cual en la fila individual de cada tienda). */
function quitarCodigoTienda(nombre) {
  return String(nombre).replace(/^\s*\d+\s*-\s*/, '').trim();
}

/** Quita un "*"/"^" residual del final del nombre, si lo hubiera (nombres
 *  antiguos de antes de mover el tránsito a config_tiendas.transito_dias).
 *  Es solo cosmético para lo que se pinta en pantalla; el badge de plazo
 *  ya no depende de esto, ver badgeTransitoTienda(). */
function quitarMarcadorNombre(nombre) {
  return String(nombre || '').replace(/\s*[*^]\s*$/, '');
}

/**
 * Devuelve el badge de plazo de tránsito a partir del campo `transito`
 * (1 a 5, ver config_tiendas.transito_dias) que ya viene en los datos de
 * la tienda desde get_conteo_dia. transito=1 (24h) es el caso normal y no
 * muestra badge, igual que antes cuando el nombre no llevaba marcador.
 * Sustituye al viejo sistema de "*"/"^" al final del nombre de la tienda.
 */
var TRANSITO_BADGES = {
  2: { texto: '48H', clase: 'badge-48h' },
  3: { texto: '72H', clase: 'badge-72h' },
  4: { texto: '96H', clase: 'badge-96h' },
  5: { texto: '120H', clase: 'badge-120h' }
};
function badgeTransitoTienda(transito) {
  return TRANSITO_BADGES[Number(transito)] || null;
}

/** Punto de entrada del botón de imprimir: construye de cero la hoja de
 *  cuadrícula manual (ver construirHojaImpresionDia_) a partir de los
 *  últimos datos del día ya cargados, y lanza el diálogo de impresión del
 *  navegador. No hace falta volver a pedir nada al servidor. */
function imprimirConteoDia_() {
  if (!ESTADO.datosDiaActual) {
    mostrarToast('Espera a que termine de cargar el conteo del día antes de imprimir', true);
    return;
  }
  construirHojaImpresionDia_(ESTADO.datosDiaActual);
  window.print();
}

/** Construye, desde cero, la hoja de impresión en cuadrícula pensada para
 *  rellenar A MANO (no reutiliza el HTML de pantalla en absoluto: colores,
 *  botones, inputs... aquí no pintan nada). Cabecera con la fecha y el
 *  aviso general del día, y luego cada agrupación con su tabla + caja de
 *  TOTAL + caja de "quitar en este orden" al lado, tal como se venía
 *  imprimiendo antes de esta aplicación.
 *  IMPORTANTE: las celdas de conteo (60/PTA/CART./TOTAL/PDTE) se dejan
 *  siempre en blanco a propósito -- es un papel para escribir con boli,
 *  no un volcado de lo que ya haya escrito en pantalla. */
function construirHojaImpresionDia_(data) {
  const cont = document.getElementById('hoja-impresion-manual');
  if (!cont) return;
  cont.innerHTML = '';

  // "2026-08-25" -> "25/08/2026" (con ceros, para "CONTEOS DE MIÉRCOLES - 25/08/2026").
  const partesFecha = String(data.fecha || '').split('-');
  const pad2_ = function (n) { return String(n).padStart(2, '0'); };
  const fechaConCeros = partesFecha.length === 3
    ? pad2_(partesFecha[2]) + '/' + pad2_(partesFecha[1]) + '/' + partesFecha[0]
    : (data.fecha || '');

  const tituloHoja = 'CONTEOS DE ' + String(data.dia || '').toUpperCase() + ' - ' + fechaConCeros;

  const cabecera = document.createElement('div');
  cabecera.className = 'hi-cabecera';
  cabecera.innerHTML = '<b>' + escapeHtml(tituloHoja) + '</b>';

  let aviso = null;
  if (data.notasGenerales && data.notasGenerales.length) {
    aviso = document.createElement('div');
    aviso.className = 'hi-aviso';
    aviso.innerHTML = data.notasGenerales.map(function (n) {
      return '<div>' + escapeHtml(n.texto || '') + '</div>';
    }).join('');
  }

  const grupos = (data.secciones || []).map(construirGrupoImpresionDia_);

  paginarYMontarHojaImpresion_(cont, tituloHoja, cabecera, aviso, grupos);
}

/** Reparte cabecera + aviso + grupos entre tantas ".hi-pagina" como hagan
 *  falta, cada una con el alto exacto de una hoja A4 (menos los márgenes de
 *  @page), para poder poner "Página N de X" en el pie de cada una con el
 *  total real -- dato que el navegador nunca expone durante la impresión,
 *  así que aquí se pagina "a mano" en vez de fiarse del motor de impresión.
 *  Para saber cuánto ocupa cada trozo se mide su alto real metiéndolo,
 *  fuera de la pantalla, en un contenedor con el mismo ancho útil que
 *  tendrá la página impresa (en mm, no en px: el mm de CSS es una unidad
 *  fija -96px por pulgada, siempre igual-, así que la medida hecha en
 *  pantalla normal predice fielmente lo que pasará al imprimir). */
function paginarYMontarHojaImpresion_(cont, tituloHoja, cabecera, aviso, grupos) {
  const ANCHO_UTIL_MM = 192; // A4 (210mm) - 2 x margen de @page (9mm)
  const ALTO_UTIL_MM = 279;  // A4 (297mm) - 2 x margen de @page (9mm)
  const MM_A_PX = 96 / 25.4; // conversión fija de CSS, independiente de la pantalla

  const medidor = document.createElement('div');
  medidor.style.cssText = 'position:absolute; left:-9999px; top:0; width:' + ANCHO_UTIL_MM + 'mm; visibility:hidden;';
  document.body.appendChild(medidor);

  const pieMedida = crearPiePaginaImpresion_(tituloHoja, 1, 1);
  medidor.appendChild(cabecera);
  if (aviso) medidor.appendChild(aviso);
  medidor.appendChild(pieMedida);
  const altoCabecera = cabecera.offsetHeight + (aviso ? aviso.offsetHeight : 0);
  const altoPie = pieMedida.offsetHeight;
  medidor.removeChild(pieMedida);

  const alturasGrupos = grupos.map(function (g) {
    medidor.appendChild(g);
    const alto = g.offsetHeight + parseFloat(getComputedStyle(g).marginBottom || 0);
    medidor.removeChild(g);
    return alto;
  });

  document.body.removeChild(medidor);

  const altoUtilPx = ALTO_UTIL_MM * MM_A_PX;
  const presupuestoPagina1 = altoUtilPx - altoCabecera - altoPie;
  const presupuestoPaginaSiguiente = altoUtilPx - altoPie;

  // Reparto "greedy": se van metiendo grupos en la página actual mientras
  // quepan; en cuanto uno no cabe, se cierra esa página y se abre otra.
  // Los grupos nunca se parten (igual que antes con break-inside:avoid),
  // solo que ahora la decisión de "no cabe, página nueva" se toma aquí en
  // vez de dejársela al navegador.
  const paginas = [[]];
  let alturaUsada = 0;
  let presupuestoActual = presupuestoPagina1;
  grupos.forEach(function (g, i) {
    const alto = alturasGrupos[i];
    if (alturaUsada + alto > presupuestoActual && paginas[paginas.length - 1].length > 0) {
      paginas.push([]);
      alturaUsada = 0;
      presupuestoActual = presupuestoPaginaSiguiente;
    }
    paginas[paginas.length - 1].push(g);
    alturaUsada += alto;
  });

  const totalPaginas = paginas.length;
  paginas.forEach(function (gruposPagina, idx) {
    const pagina = document.createElement('div');
    pagina.className = 'hi-pagina' + (idx < totalPaginas - 1 ? ' hi-pagina-salto' : '');

    const contenido = document.createElement('div');
    contenido.className = 'hi-pagina-contenido';
    if (idx === 0) {
      contenido.appendChild(cabecera);
      if (aviso) contenido.appendChild(aviso);
    }
    gruposPagina.forEach(function (g) { contenido.appendChild(g); });
    pagina.appendChild(contenido);

    pagina.appendChild(crearPiePaginaImpresion_(tituloHoja, idx + 1, totalPaginas));
    cont.appendChild(pagina);
  });
}

/** Pie de una hoja impresa: mismo título de la cabecera a la izquierda/
 *  centro, y "Página N de X" a la derecha del todo. */
function crearPiePaginaImpresion_(tituloHoja, numPagina, totalPaginas) {
  const pie = document.createElement('div');
  pie.className = 'hi-pie-pagina';
  pie.innerHTML =
    '<span></span>' +
    '<span class="hi-pie-titulo">' + escapeHtml(tituloHoja) + '</span>' +
    '<span class="hi-pie-num">Página ' + numPagina + ' de ' + totalPaginas + '</span>';
  return pie;
}

/** Construye un ".hi-grupo" (una agrupación completa) para la hoja de
 *  impresión manual: título, notas de carga, tabla con filas en blanco
 *  para rellenar, caja de TOTAL y caja de "quitar en este orden". */
function construirGrupoImpresionDia_(seccion) {
  const grupo = document.createElement('div');
  grupo.className = 'hi-grupo';

  const titulo = document.createElement('div');
  titulo.className = 'hi-grupo-titulo';
  titulo.textContent = seccion.nombre;
  grupo.appendChild(titulo);

  if (seccion.notasCarga && seccion.notasCarga.length) {
    const notas = document.createElement('div');
    notas.className = 'hi-notas-carga';
    notas.innerHTML = seccion.notasCarga.map(function (texto) {
      return '<div>' + escapeHtml(texto) + '</div>';
    }).join('');
    grupo.appendChild(notas);
  }

  // extraCols cuenta solo las columnas de datos en blanco (60/PTA/CART/
  // TOTAL/PDTE + opcionales); la fila de cabecera de una agrupación (p.ej.
  // "MENDEZ + FORUM ALG.") necesita cubrir TODAS las columnas de la tabla,
  // así que a extraCols hay que sumarle las 2 columnas iniciales (LIM y
  // nombre) para que la barra llegue hasta el final -- si no, se queda
  // corta y no tapa las últimas columnas (TOTAL, PDTE...).
  const extraCols = 5 + (seccion.tienePeso ? 1 : 0) + (seccion.tieneCExpress ? 1 : 0) + (seccion.tieneSobrestock ? 1 : 0);
  const totalCols = extraCols + 2;

  // Solo las tiendas que hoy hay que contar físicamente aquí: se dejan
  // fuera las cerradas y las que hoy salen por otra agrupación (cambio
  // puntual), igual que en pantalla no se cuentan ahí.
  const tiendas = (seccion.tiendas || []).filter(function (t) { return !t.cerrada && !t.salePorExcepcion; });

  const nombresPorGrupo = {};
  tiendas.forEach(function (t) {
    if (!t.notaGrupoId) return;
    if (!nombresPorGrupo[t.notaGrupoId]) nombresPorGrupo[t.notaGrupoId] = [];
    nombresPorGrupo[t.notaGrupoId].push(t.nombre);
  });

  const filasHtml = tiendas.map(function (t, i) {
    const anterior = tiendas[i - 1];
    const siguiente = tiendas[i + 1];
    const esPrimeraDeGrupo = !!t.notaGrupoId && (!anterior || anterior.notaGrupoId !== t.notaGrupoId);
    const esUltimaDeGrupo = !!t.notaGrupoId && (!siguiente || siguiente.notaGrupoId !== t.notaGrupoId);
    let html = '';
    if (esPrimeraDeGrupo) {
      const esTotal = t.notaGrupoTipo === 'total';
      const nombresGrupo = (nombresPorGrupo[t.notaGrupoId] || []).map(quitarCodigoTienda).join(' + ');
      // Si la ruta compartida trae una anotación de carga (ej. "8P MAX. POR
      // RUTA - CARGA EN GAITE", lo mismo que se ve en pantalla en el chip de
      // la cabecera del grupo), se añade también aquí -- en pantalla se ve
      // aparte en un chip a la derecha, pero en el papel no hay chip, así
      // que se pega al final del mismo renglón de cabecera.
      const textoIzquierda = esTotal
        ? t.nota
        : (t.nota ? nombresGrupo + ' — ' + t.nota : nombresGrupo);
      html += '<tr class="hi-fila-grupo"><td colspan="' + totalCols + '">' + escapeHtml(textoIzquierda) + '</td></tr>';
    }
    const badge = badgeTransitoTienda(t.transito);
    // El "*" tras el nombre marca las tiendas que tienen una nota/aviso
    // propio (ver icono de nota en pantalla) -- igual que en las hojas de
    // toda la vida.
    const sufijo = (badge ? ' (' + badge.texto + ')' : '') + (t.nota && !t.notaGrupoId ? ' *' : '');
    // Las tiendas que pertenecen a una agrupación de rutas llevan un fondo
    // tenue en TODAS sus filas (no solo en la cabecera), y la última de
    // ellas cierra el bloque con un borde inferior grueso -- así se ve de
    // un vistazo dónde empieza y termina la agrupación, sin confundirla
    // con las tiendas sueltas que vienen después.
    const claseFila = t.notaGrupoId
      ? ' class="hi-fila-grupo-miembro' + (esUltimaDeGrupo ? ' hi-fila-grupo-fin' : '') + '"'
      : '';
    html += '<tr' + claseFila + '>' +
      '<td class="hi-lim">' + escapeHtml(String(t.limite)) + '</td>' +
      '<td class="hi-nombre">' + escapeHtml(quitarMarcadorNombre(t.nombre)) + escapeHtml(sufijo) + '</td>' +
      celdaImpresionManual_(t.c60) + celdaImpresionManual_(t.pta) + celdaImpresionManual_(t.cart) +
      '<td class="hi-blanco"></td><td class="hi-blanco"></td>' +
      (seccion.tienePeso ? '<td class="hi-blanco"></td>' : '') +
      (seccion.tieneCExpress ? '<td class="hi-blanco"></td>' : '') +
      (seccion.tieneSobrestock ? '<td class="hi-blanco"></td>' : '') +
      '</tr>';
    return html;
  }).join('');

  const tabla = document.createElement('table');
  tabla.className = 'hi-tabla';
  tabla.innerHTML =
    '<thead><tr><th>Lim</th><th></th><th>60</th><th>PTA</th><th>Cart.</th><th>Total</th><th>Pdte</th>' +
    (seccion.tienePeso ? '<th>Peso</th>' : '') +
    (seccion.tieneCExpress ? '<th>C.Express</th>' : '') +
    (seccion.tieneSobrestock ? '<th>Sobrestock</th>' : '') +
    '</tr></thead><tbody>' + filasHtml + '</tbody>';

  const layout = document.createElement('table');
  layout.className = 'hi-layout';
  const tbody = document.createElement('tbody');
  const fila = document.createElement('tr');

  const tdTabla = document.createElement('td');
  tdTabla.className = 'hi-tabla-cell';
  tdTabla.appendChild(tabla);
  fila.appendChild(tdTabla);

  // El cuadro de TOTAL tiene un tamaño fijo pensado para agrupaciones con
  // varias tiendas (la tabla, más alta, "sostiene" ese tamaño). Cuando la
  // agrupación tiene muy pocas filas (p.ej. una sola tienda), ese mismo
  // cuadro obliga a estirar la fila entera y queda un hueco enorme -- aquí
  // se calcula un tamaño más pequeño para esos casos, en proporción al
  // número de filas reales de la tabla (tiendas + cabeceras de subgrupo).
  const filasTablaTotal = tiendas.length + Object.keys(nombresPorGrupo).length;
  let ladoCajaTotal = 60;
  if (filasTablaTotal <= 1) ladoCajaTotal = 30;
  else if (filasTablaTotal === 2) ladoCajaTotal = 42;

  const tdTotal = document.createElement('td');
  tdTotal.className = 'hi-total-cell';
  tdTotal.innerHTML = '<div class="hi-total-label">Total</div><div class="hi-total-box" style="width:' + ladoCajaTotal + 'px;height:' + ladoCajaTotal + 'px;"></div>';
  fila.appendChild(tdTotal);

  if (seccion.ordenRetirada && seccion.ordenRetirada.length) {
    const tdOrden = document.createElement('td');
    tdOrden.className = 'hi-orden-cell';
    tdOrden.innerHTML =
      '<div class="hi-orden-label">Quitar en este orden</div>' +
      '<div class="hi-orden-wrap">' +
      '<table class="hi-orden-tabla">' +
      seccion.ordenRetirada.map(function (o, i) {
        return '<tr><td class="hi-orden-num">' + (i + 1) + 'º</td><td>' + escapeHtml(quitarCodigoTienda(quitarMarcadorNombre(o))) + '</td></tr>';
      }).join('') +
      '</table>' +
      '</div>';
    fila.appendChild(tdOrden);
  }

  tbody.appendChild(fila);
  layout.appendChild(tbody);
  grupo.appendChild(layout);
  return grupo;
}

/** "NO" tal cual viene del Excel (sin importar mayúsculas/espacios): esa
 *  tienda no debe recibir palets por esa vía ese día. */
function esValorNo(v) {
  return String(v == null ? '' : v).trim().toUpperCase() === 'NO';
}

/** Celda de 60/PTA/CART en la hoja de impresión manual (construirGrupoImpresionDia_):
 *  se deja en blanco para rellenar a mano, salvo que el valor de origen sea
 *  "NO" (ver esValorNo), en cuyo caso se marca con una "X" para que quede
 *  claro sobre el papel que esa tienda no debe recibir palets por esa vía. */
function celdaImpresionManual_(valor) {
  return esValorNo(valor) ? '<td class="hi-blanco hi-no">X</td>' : '<td class="hi-blanco"></td>';
}

/**
 * Celda de 60/PTA/CART. Si el valor es "NO", se muestra en rojo y no
 * editable (con un botón para forzar un número igualmente si hiciera
 * falta); si no, es el input numérico normal de siempre.
 */
function celdaConteoHtml(campo, valor, forzado) {
  if (forzado) {
    return '<input class="celda celda-forzada" data-campo="' + campo + '" data-forzado="1" type="number" value="' + valor + '" title="Forzado pese al &quot;NO&quot; original. Toca para volver a forzar/cambiar el número.">';
  }
  if (esValorNo(valor)) {
    return '<input class="celda celda-no" data-campo="' + campo + '" type="text" value="NO" readonly title="Esta tienda no debe recibir palets por esta vía. Toca para forzar un número igualmente.">';
  }
  return '<input class="celda" data-campo="' + campo + '" type="number" value="' + valor + '">';
}

function filaHtml(t, esPrimeraDeGrupo, esUltimaDeGrupo, tienePeso, tieneCExpress, tieneSobrestock) {
  const nombreLimpio = quitarMarcadorNombre(t.nombre);
  const badge = badgeTransitoTienda(t.transito);
  const badgeHtml = badge
    ? '<span class="badge-plazo ' + badge.clase + '">' + badge.texto + '</span>'
    : '';
  const notaHtml = (t.nota && !t.notaGrupoId)
    ? '<div class="nota-tienda" data-nota-base="' + escapeAttr(t.nota) + '">' + escapeHtml(t.nota) + '</div>'
    : '';
  const atrGrupo = t.notaGrupoId
    ? ' data-nota-grupo="' + escapeAttr(t.notaGrupoId) + '" data-nota-limite="' + (t.notaLimite != null ? t.notaLimite : '') + '" data-nota-grupo-tipo="' + escapeAttr(t.notaGrupoTipo || '') + '"'
    : '';
  const claseGrupo = t.notaGrupoId
    ? ' fila-grupo-ruta' + (t.notaGrupoTipo === 'total' ? ' fila-grupo-total' : '') + (esPrimeraDeGrupo ? ' fila-grupo-primera' : '') + (esUltimaDeGrupo ? ' fila-grupo-ultima' : '')
    : '';
  if (t.cerrada) {
    return '<tr class="fila-cerrada' + claseGrupo + '" data-row="' + t.row + '" data-nombre="' + escapeAttr(t.nombre) + '" data-cierre-id="' + escapeAttr(t.cierreId) + '"' + atrGrupo + '>' +
      '<td class="nombre">' + escapeHtml(nombreLimpio) + badgeHtml + notaHtml + '</td>' +
      '<td class="limite">' + t.limite + '</td>' +
      '<td colspan="' + (5 + (tienePeso ? 1 : 0) + (tieneCExpress ? 1 : 0) + (tieneSobrestock ? 1 : 0)) + '"><div class="motivo-cierre">CERRADA — ' + escapeHtml(t.motivoCierre) + '</div></td>' +
      '<td><button type="button" class="btn-reabrir">Reabrir</button></td>' +
      '</tr>';
  }
  // Tienda que HOY sale por otra agrupación por un "cambio puntual"
  // (excepción): se mantiene visible aquí, en su agrupación de siempre,
  // pero tachada y sin celdas de conteo — igual que una tienda cerrada,
  // pero dejando claro que no está cerrada: solo sale por otro sitio hoy.
  // Se gestiona (y se quita) desde "Gestión festivos", no desde aquí.
  if (t.salePorExcepcion) {
    return '<tr class="fila-sale-excepcion' + claseGrupo + '" data-row="' + t.row + '" data-nombre="' + escapeAttr(t.nombre) + '"' + atrGrupo + '>' +
      '<td class="nombre">' + escapeHtml(nombreLimpio) + badgeHtml + notaHtml + '</td>' +
      '<td class="limite">' + t.limite + '</td>' +
      '<td colspan="' + (5 + (tienePeso ? 1 : 0) + (tieneCExpress ? 1 : 0) + (tieneSobrestock ? 1 : 0)) + '"><div class="motivo-cierre motivo-excepcion">POR EXCEPCIÓN SALE POR ' + escapeHtml(t.excepcionAgrupacionDestino || '') + '</div></td>' +
      '<td></td>' +
